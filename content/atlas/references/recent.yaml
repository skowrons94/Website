# Results of 2020–2026 added after the literature reviews of 2026-10-13, and
# the references of the open-questions page (debates.yaml). Every entry was
# checked by web search on that date; `checked` says what the search showed.
# A DOI is given only where a record showed it.

# --- Hydrogen burning and the Sun -------------------------------------------

chen2025:
  authors: X. Chen, J. Su, Y. P. Shen et al.
  title: Enhanced S-factor for the ¹⁴N(p,γ)¹⁵O reaction and its impact on the solar composition problem
  journal: Phys. Rev. Lett. 135, 232701 (2025)
  year: 2025
  doi: 10.1103/q756-hzmt
  arxiv: "2410.16086"
  checked: Nature Index record (PRL 135, 232701, 2 December 2025, DOI) and arXiv 2410.16086 snippets (direct measurement at Ep = 110–260 keV with the 350 kV accelerator in Hefei, all transitions fitted together in a multichannel Bayesian analysis), by web search; S(0) = 1.92 ± 0.08 keV b, about 14% above Solar Fusion III, from a web-search summary only (see needs-full-text), 2026-10-13

borexino2023:
  authors: D. Basilico et al. (Borexino Collaboration)
  title: Final results of Borexino on CNO solar neutrinos
  journal: Phys. Rev. D 108, 102005 (2023)
  year: 2023
  arxiv: "2307.14636"
  checked: arXiv 2307.14636 abstract and the Princeton, TUM and TU Dresden records, by web search (φ_CNO = 6.7 +1.2/−0.8 × 10⁸ cm⁻² s⁻¹; with ⁷Be and ⁸B, B16-AGSS09met disfavoured at 3.2σ assuming B16-GS98; N_CN = 5.81 +1.22/−0.94 × 10⁻⁴, 2σ from the low-metallicity case; published 14 November 2023); DOI not shown, 2026-10-13

asplund2021:
  authors: M. Asplund, A. M. Amarsi, N. Grevesse
  title: "The chemical make-up of the Sun: A 2020 vision"
  journal: Astron. Astrophys. 653, A141 (2021)
  year: 2021
  arxiv: "2105.01661"
  checked: arXiv 2105.01661 and ANU record (Z = 0.0139; the solar modelling problem "remains intact"; journal reference A&A 653, A141), by web search, 2026-10-13

magg2022:
  authors: E. Magg et al.
  title: Observational constraints on the origin of the elements. IV. Standard composition of the Sun
  journal: Astron. Astrophys. 661, A140 (2022)
  year: 2022
  doi: 10.1051/0004-6361/202142971
  arxiv: "2203.02255"
  checked: A&A article page and arXiv 2203.02255 (Z/X = 0.0225; the mismatch with helioseismology resolved with this composition), by web search, 2026-10-13

iliadis2022:
  authors: C. Iliadis, V. Palanivelrajan, R. S. de Souza
  title: Bayesian estimation of the S factor and thermonuclear reaction rate for ¹⁶O(p,γ)¹⁷F
  journal: Phys. Rev. C 106, 055802 (2022)
  year: 2022
  doi: 10.1103/PhysRevC.106.055802
  arxiv: "2210.14354"
  checked: arXiv 2210.14354 abstract and University of Hertfordshire record, by web search (potential model with the ANCs as scaling parameters; rate uncertainty ±4.2%, about half of the earlier 7.5%); DOI from the APS scheme, 2026-10-13

toth2023:
  authors: Á. Tóth, T. Szücs et al.
  title: Experimental determination of the ³He(α,γ)⁷Be reaction cross section above the ⁷Be proton separation threshold
  journal: Phys. Rev. C 108, 025802 (2023)
  year: 2023
  doi: 10.1103/PhysRevC.108.025802
  arxiv: "2307.10218"
  checked: EXFOR entry D4430 (journal reference and DOI) and arXiv 2307.10218, by web search (activation with a ³He gas cell; extends the data above the proton threshold, where only one data set at 4.0–4.4 MeV existed), 2026-10-13

hayakawa2021:
  authors: S. Hayakawa, M. La Cognata, L. Lamia et al.
  title: "Constraining the primordial lithium abundance: new cross section measurement of the ⁷Be + n reactions updates the total ⁷Be destruction rate"
  journal: Astrophys. J. Lett. 915, L13 (2021)
  year: 2021
  doi: 10.3847/2041-8213/ac061f
  checked: conference abstracts of the same group and the CRIB report, by web search (Trojan Horse ⁷Be(d,⁷Li p)¹H and ⁷Be(d,αα)¹H with a CRIB beam; improved (n,p₀), first (n,p₁) at BBN energies; about 10% less ⁷Li in PRIMAT), 2026-10-13

guardo2023:
  authors: G. L. Guardo et al.
  title: Direct measurement of the ¹⁹F(p,α)¹⁶O reaction at E_cm = 0.4–0.9 MeV using the LHASA detector array
  journal: Eur. Phys. J. A 59 (2023)
  year: 2023
  doi: 10.1140/epja/s10050-023-00957-1
  checked: DOAJ and Osmangazi University records (EPJ A 59, issue 3; S-factor about 1.4 times NACRE at 0.6–0.8 MeV), by web search; article number not seen, 2026-10-13

petruse2025:
  authors: T. Petruse et al.
  title: Direct measurement of the ¹⁹F(p,α)¹⁶O reaction using the LHASA detector array
  journal: Eur. Phys. J. A 61, 4 (2025)
  year: 2025
  doi: 10.1140/epja/s10050-024-01462-9
  checked: web-search records of the article (EPJ A 61, issue 1, DOI; E_cm = 400–900 keV; resolves the discrepancy between the two earlier data sets; INSPIRE copy of the article header, title),  2026-10-13

# --- Big Bang ----------------------------------------------------------------

pitrou2021:
  authors: C. Pitrou, A. Coc, J.-P. Uzan, E. Vangioni
  title: A new tension in the cosmological model from primordial deuterium?
  journal: Mon. Not. R. Astron. Soc. 502, 2474 (2021)
  year: 2021
