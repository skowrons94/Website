desouza2019:
  authors: R. S. de Souza, C. Iliadis, A. Coc
  title: Astrophysical S-factors, thermonuclear rates, and electron screening potential for the ³He(d,p)⁴He Big Bang reaction via a hierarchical Bayesian model
  journal: Astrophys. J. (2019)
  year: 2019
  arxiv: "1809.06966"
  checked: arXiv 1809.06966 (journal ApJ; screening potential 213 ± 13 eV, consistent with Aliotta et al. 2001), by web search; volume and page not seen, 2026-10-13

# --- Carbon burning ----------------------------------------------------------

adsley2022:
  authors: P. Adsley et al.
  title: Extending the Hoyle-state paradigm to ¹²C + ¹²C fusion
  journal: Phys. Rev. Lett. 129, 102701 (2022)
  year: 2022
