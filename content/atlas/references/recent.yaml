nguyen2012:
  authors: N. B. Nguyen, F. M. Nunes, I. J. Thompson, E. F. Brown
  title: Low-temperature triple-alpha rate in a full three-body model
  journal: Phys. Rev. Lett. 109, 141101 (2012)
