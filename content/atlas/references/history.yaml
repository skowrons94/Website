# References for timeline.yaml, facilities.yaml and methods.yaml: the history
# of the field, neutrino observations, facility papers and method reviews.
#
# Verification note (2026-10-11): every entry below was checked by web search
# against a publisher, arXiv, INSPIRE, ADS or institutional-repository record.
# A DOI is given only where a record showed it; for older papers without a
# confirmed DOI the journal reference alone is given. Network access to
# doi.org, Crossref, arXiv and INSPIRE was not available from the build
# container, so no entry was checked by resolving its DOI directly.

