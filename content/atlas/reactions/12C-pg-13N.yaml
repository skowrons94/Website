id: 12C-pg-13N
label: ¹²C(p,γ)¹³N
kind: capture
target: 12C
projectile: 1H
ejectile: g
product: 13N
networks: [cno1]
importance: key
summary: >-
  The first step of the CN cycle. A carbon-12 nucleus captures a proton,
  emits a γ-ray and becomes radioactive nitrogen-13, which then decays to
  carbon-13.
role: >-
  Together with the next proton capture, on carbon-13, this reaction fixes the
  ratio of the two stable carbon isotopes in gas that has burnt hydrogen.
  Astronomers measure this ratio in the atmospheres of red giants, where it
  shows how much material from the burning layers has been mixed to the
  surface. The same reaction also makes the carbon-13 that, in giant stars,
  later releases the neutrons needed to build many elements heavier than iron.
details: >-
  At low energy the capture proceeds by direct E1 capture to the ¹³N ground
  state, which interferes with the broad resonance at E = 422 keV formed by the
  first excited state of ¹³N. The S-factor at stellar energies is obtained from
  R-matrix fits, so the result depends on the normalisation of the data and on
  the width of that resonance. Measurements since 2023, prompt-γ and
  activation, give S-factors about 25 % lower than most of the earlier
  literature. The LUNA data reach E = 60 keV, where the cross section enters the
  energy range of hydrogen burning in the shells of giant stars.
status: improving
status_note: >-
  Direct data now reach 60 keV with systematic uncertainties of 7–8 %; the
  remaining question is the normalisation difference of about 25 % with
  respect to the older data sets.
methods: [direct-underground, direct-surface, activation]
measurements:
  - year: 1974
    method: direct-surface
    energy: "about 150 keV to 2.5 MeV (proton energy)"
    note: >-
      Showed that direct E1 capture to the ground state, interfering with the
      resonances at proton energies of 457 and 1699 keV, is needed to describe
      the excitation function; ground-state spectroscopic factor
      C²S = 0.49 ± 0.15.
    refs: [rolfs1974]
  - year: 2023
    facility: atomki
    method: activation
    energy: "300–1900 keV (proton energy)"
    note: >-
      Total cross section from the ¹³N activity, with uncertainties independent
      of in-beam γ-ray spectroscopy; covers the region of the 1.7 MeV resonance,
      where earlier data were scarce.
    refs: [gyurky2023]
  - year: 2023
    facility: felsenkeller
    method: direct-underground
    energy: "320–620 keV"
    note: >-
      Shallow-underground measurement across the 422 keV resonance; S-factor
      about 25 % below the literature. The R-matrix fit gives the first excited
      state of ¹³N at 2369.6(4) keV with Γγ = 0.49(3) eV and Γp = 34.9(2) keV.
    refs: [skowronski2023b]
  - year: 2023
    facility: notre-dame
    method: direct-surface
    energy: "1.0–2.5 MeV (proton energy)"
    note: >-
      Absolute cross section over a wide energy range to fix the overall
      normalisation and the interference between overlapping resonances; the
      extrapolation to low energy uses a Bayesian uncertainty analysis.
    refs: [kettner2023]
  - year: 2023
    facility: luna-400
    method: direct-underground
    energy: "down to 60 keV"
    note: >-
      Prompt γ-ray detection and activation, with overall systematic
      uncertainties of 7–8 %; the S-factor is about 25 % lower than most
      earlier data.
    refs: [skowronski2023]
evaluations: [acharya2025]
open_questions:
  - The 25 % normalisation difference between the measurements since 2023 and the older data sets.
  - The radiative width of the 422 keV resonance, which dominates the rate at higher temperatures.
related: [13N-bp-13C, 13C-pg-14N, 14N-pg-15O]
rmatrix: [13N]
