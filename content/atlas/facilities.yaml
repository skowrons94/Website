    country: Germany
    country_it: Germania
    underground: false
    accelerator: >-
      Van de Graaff for ⁷Li(p,n) activations; a high-current RFQ–IH proton
      linac (about 2 MeV) under construction
    accelerator_it: >-
      Van de Graaff per attivazioni con ⁷Li(p,n); un linac protonico RFQ–IH ad
      alta corrente (circa 2 MeV) in costruzione
    summary: >-
      The Frankfurt Neutron Source, designed to be the most intense source of
      neutrons at the energies found in stars, about a thousand times more
      intense than the Karlsruhe source in that energy range. Like Karlsruhe,
      it makes the neutrons from protons on lithium.
    summary_it: >-
      La sorgente di neutroni di Francoforte, progettata per essere la più
      intensa sorgente di neutroni alle energie che si trovano nelle stelle,
      circa mille volte più intensa della sorgente di Karlsruhe in quell'intervallo
      di energia. Come a Karlsruhe, i neutroni nascono da protoni sul litio.
    refs: [reifarth2009]

  - id: saraf-lilit
    name: SARAF and LiLiT
    lab: Soreq Nuclear Research Center
    location: Yavne
    country: Israel
    underground: false
    accelerator: >-
      superconducting proton linac (SARAF) on a liquid-lithium target (LiLiT),
      1.9 MeV, 1–2 mA
    accelerator_it: >-
      linac superconduttore per protoni (SARAF) su un bersaglio di litio
      liquido (LiLiT), 1,9 MeV, 1–2 mA
    summary: >-
      A proton accelerator whose milliampere beam strikes a flowing film of
      liquid lithium, making neutrons with a spectrum close to that of a star
      at 30 keV, more than ten times more intensely than earlier lithium
      targets. Samples are activated and their radioactivity counted.
    summary_it: >-
      Un acceleratore di protoni il cui fascio di qualche milliampere colpisce
      un velo di litio liquido in movimento, producendo neutroni con uno
      spettro vicino a quello di una stella a 30 keV, più di dieci volte più
      intensamente dei bersagli di litio precedenti. I campioni vengono
      attivati e se ne conta la radioattività.
    details: >-
      The thick-target ⁷Li(p,n)⁷Be spectrum at 1.92 MeV is quasi-Maxwellian
      with kT ≈ 30 keV; 3–5 × 10¹⁰ n/s were reached in the first experiments,
      which measured the 30 keV MACS of ⁹⁴Zr and ⁹⁶Zr (Tessler et al. 2015).
    refs: [tessler2015]
