# Checks on every push to main and every pull request, in a couple of minutes: the
# evaluations (docs/ADDING-AN-EVALUATION.md), the atlas, the search index, the
# rates, the types and the Python tests that need no AZURE2. The tests that run
# AZURE2 itself are in the GitHub Pages workflow, which builds it.
name: Checks

# Main and pull requests only: the working branches are merged into main,
# so checking them as well sent every failure twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the pages' "last changed" dates come from git
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: npm ci --ignore-scripts
      # Hash-pinned: the server's packages (server/requirements.txt) and the test tools.
      - run: pip install --quiet --require-hashes -r .github/requirements-ci.txt

      - name: Evaluations (info.json, .azr paths, data labels, atlas links)
        run: |
          npm run check:evaluations
          (cd server && python -m app.check)
      - name: Site content (YAML)
        run: npm run check:content
      - name: Atlas
        run: npm run check:atlas -- --quiet
      - name: Types
        run: npx tsc --noEmit
      - name: Search index
        run: npm run test:search
      - name: Reaction rates
        run: npm run test:rates
      - name: Evaluation checks and add-evaluation (pytest)
        run: cd server && python -m pytest -q tests/test_check.py
      - name: ORCID/Crossref check against its recorded answers
        run: npm run test:pubs
      - name: Data explorer pipeline (pytest)
        run: python -m pytest -q scripts/data/tests
