  - id: n-tof
    name: n_TOF, CERN
    lab: CERN
    location: Geneva
    location_it: Ginevra
    country: Switzerland
    country_it: Svizzera
    underground: false
    accelerator: 20 GeV/c proton beam from the CERN PS on a lead spallation target
    accelerator_it: >-
      fascio di protoni da 20 GeV/c del PS del CERN su un bersaglio di
      spallazione di piombo
    years: in operation since 2001
    years_it: in funzione dal 2001
    summary: >-
      A neutron source at CERN in which protons from an accelerator strike a
      lead target and knock out neutrons with a wide range of energies. The
      energy of each neutron is found from its time of flight along a long beam
      line. It measures neutron captures for the s- and r-processes and
      neutron-induced reactions on light nuclei.
    summary_it: >-
      Una sorgente di neutroni al CERN in cui i protoni di un acceleratore
      colpiscono un bersaglio di piombo ed estraggono neutroni di energie molto
      diverse. L'energia di ciascun neutrone si ricava dal suo tempo di volo
      lungo una lunga linea di fascio. Misura catture di neutroni per i processi
      s e r e reazioni indotte da neutroni su nuclei leggeri.
    details: >-
      Pulses of up to 8.5 × 10¹² protons, 6 ns (rms) long, strike the lead
      target. The horizontal flight path to experimental area EAR1 is 185 m;
      a second area, EAR2, sits about 20 m above the target on a vertical
      flight path. A nitrogen-cooled third-generation target was installed
      during the CERN Long Shutdown 2 (2019–2021).
    details_it: >-
      Impulsi fino a 8,5 × 10¹² protoni, lunghi 6 ns (rms), colpiscono il
      bersaglio di piombo. La base di volo orizzontale fino all'area
      sperimentale EAR1 è di 185 m; una seconda area, EAR2, si trova circa 20 m
      sopra il bersaglio, su una base di volo verticale. Durante il Long
      Shutdown 2 del CERN (2019–2021) è stato installato un bersaglio di terza
      generazione raffreddato ad azoto.
    refs: [guerrero2013]

  - id: nif
