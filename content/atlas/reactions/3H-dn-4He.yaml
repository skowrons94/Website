id: 3H-dn-4He
label: ³H(d,n)⁴He
kind: fusion
target: 3H
projectile: 2H
ejectile: n
product: 4He
networks: [bbn]
importance: minor
summary: >-
  Tritium and a deuteron fuse into ⁴He and a neutron. After the Big Bang it
  turned tritium into helium; on Earth it is the reaction planned for fusion
  power plants.
summary_it: >-
  Trizio e deutone si fondono in ⁴He e un neutrone. Dopo il Big Bang trasformò
  il trizio in elio; sulla Terra è la reazione prevista per le centrali a
  fusione.
role: >-
  The tritium made by deuteron fusion after the Big Bang was mostly turned
  into ⁴He by this reaction. Its rate is so high that it does not limit the
  predicted abundances. Because the same reaction powers fusion experiments,
  its cross section is among the best studied in nuclear physics.
role_it: >-
  Il trizio prodotto dalla fusione di deutoni dopo il Big Bang fu trasformato
  per lo più in ⁴He da questa reazione. Il suo tasso è così alto che non limita
  le abbondanze previste. Poiché la stessa reazione alimenta gli esperimenti di
  fusione, la sua sezione d'urto è tra le più studiate della fisica nucleare.
details: >-
  The cross section is dominated by a broad 3/2⁺ resonance in ⁵He just above
  the d+t threshold, which makes it very large at BBN energies. Bosch and Hale
  (1992) gave parametrizations of the cross section and of the Maxwellian
  reactivity, based on R-matrix calculations, that are widely used in fusion
  research, together with those of ²H(d,n)³He,
  ²H(d,p)³H and ³He(d,p)⁴He.
status: well-known
status_note: >-
  Measured precisely for fusion-energy applications; its uncertainty does not
  affect BBN predictions.
status_note_it: >-
  Misurata con precisione per le applicazioni all'energia da fusione; la sua
  incertezza non influisce sulle previsioni della nucleosintesi primordiale.
methods: [direct-surface, theory]
measurements:
  - year: 1992
    method: theory
    note: >-
      Parametrizations of the cross section and thermal reactivity based on
      R-matrix calculations; a correction followed in 1993.
    refs: [bosch1992]
evaluations: [descouvemont2004, bosch1992]
open_questions: []
related: [2H-dp-3H, 3He-dp-4He, 3H-ag-7Li]
details_it: >-
  La sezione d'urto è dominata da un'ampia risonanza 3/2⁺ nel ⁵He appena
  sopra la soglia d+t, che la rende molto grande alle energie della BBN.
  Bosch e Hale (1992) diedero parametrizzazioni della sezione d'urto e della
  reattività maxwelliana, basate su calcoli R-matrix, molto usate nella
  ricerca sulla fusione, insieme a quelle di ²H(d,n)³He, ²H(d,p)³H e
  ³He(d,p)⁴He.
