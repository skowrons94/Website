    lab: Lawrence Livermore National Laboratory
    location: Livermore, California
    country: United States
    country_it: Stati Uniti
    underground: false
    summary: >-
      A large laser system built for inertial-confinement fusion. Its lasers
      compress small capsules of fuel into a hot, dense plasma, in which fusion
      reactions between light nuclei can be studied in conditions closer to
      those in stars than an accelerator beam on a cold target.
    summary_it: >-
      Un grande sistema laser costruito per la fusione a confinamento inerziale.
      I suoi laser comprimono piccole capsule di combustibile in un plasma caldo
      e denso, in cui si possono studiare reazioni di fusione tra nuclei leggeri
      in condizioni più vicine a quelle stellari di un fascio da acceleratore su
      un bersaglio freddo.

