    summary_it: >-
      Un laboratorio universitario con diversi acceleratori per l'astrofisica
      nucleare, usato per reazioni di cattura e indotte da particelle alfa. Ne
      fa parte il separatore di rinculo St. George.

  - id: st-george
    name: St. George recoil separator
    lab: University of Notre Dame
    location: Notre Dame, Indiana
    country: United States
    country_it: Stati Uniti
    underground: false
    accelerator: recoil separator on the 5 MV Sta. Ana accelerator
    accelerator_it: separatore di rinculo sull'acceleratore Sta. Ana da 5 MV
    summary: >-
      A recoil separator built to study helium captures in inverse kinematics.
      A heavy beam hits a helium gas target, and the separator picks out the
      few product nuclei from the much more intense beam.
    summary_it: >-
      Un separatore di rinculo costruito per studiare le catture di elio in
      cinematica inversa. Un fascio pesante colpisce un bersaglio di elio
      gassoso, e il separatore isola i pochi nuclei prodotti dal fascio, molto
      più intenso.
    details: >-
      St. George (Strong Gradient Electromagnetic Online Recoil separator for
      capture Gamma Ray Experiments) was designed for (α,γ) reactions in
      inverse kinematics with beams up to about A = 40, with an angular
      acceptance of 40 mrad and an energy acceptance of 7.4%.
    details_it: >-
      St. George (Strong Gradient Electromagnetic Online Recoil separator for
      capture Gamma Ray Experiments) è stato progettato per reazioni (α,γ) in
      cinematica inversa con fasci fino a circa A = 40, con un'accettanza
      angolare di 40 mrad e un'accettanza in energia del 7,4 %.
    refs: [couder2008]

  - id: tunl-lena
    name: LENA, TUNL
    lab: Triangle Universities Nuclear Laboratory
    location: Durham, North Carolina
    country: United States
    country_it: Stati Uniti
    underground: false
    accelerator: 230 kV ECR accelerator and 1 MV JN Van de Graaff; a 2 MV Singletron was added in the LENA II upgrade
    accelerator_it: >-
      acceleratore ECR da 230 kV e Van de Graaff JN da 1 MV; con l'aggiornamento
      LENA II è stato aggiunto un Singletron da 2 MV
    url: https://tunl.duke.edu/nuclear-astrophysics/lena-accelerators
    summary: >-
      The Laboratory for Experimental Nuclear Astrophysics, a low-energy,
      high-current accelerator facility at the surface. It uses detector
      arrays with active shielding against cosmic rays to measure weak
      proton-capture resonances.
    summary_it: >-
      Il Laboratory for Experimental Nuclear Astrophysics, un'infrastruttura in
      superficie con acceleratori a bassa energia e alta corrente. Usa insiemi
      di rivelatori con schermature attive contro i raggi cosmici per misurare
      risonanze deboli di cattura protonica.

  - id: dragon
    name: DRAGON, TRIUMF
    lab: TRIUMF
    location: Vancouver, British Columbia
    country: Canada
    country_it: Canada
    underground: false
    summary: >-
      The Detector of Recoils And Gammas Of Nuclear reactions, a recoil
      separator at the radioactive-beam facility of TRIUMF. It measures
      radiative captures in inverse kinematics, including captures on
      short-lived nuclei that cannot be made into targets.
    summary_it: >-
      Il Detector of Recoils And Gammas Of Nuclear reactions, un separatore di
      rinculo all'infrastruttura per fasci radioattivi di TRIUMF. Misura catture
      radiative in cinematica inversa, comprese catture su nuclei a vita breve
      con cui non si possono fare bersagli.
    details: >-
      DRAGON has a windowless gas target surrounded by a γ-ray detector array,
      an electromagnetic recoil mass separator and focal-plane detectors. It
      was commissioned with stable and radioactive beams from ISAC; its first
      radioactive-beam study was ²¹Na(p,γ)²²Mg.
    details_it: >-
      DRAGON ha un bersaglio gassoso senza finestre circondato da un insieme di
      rivelatori di raggi γ, un separatore elettromagnetico di massa per i
      nuclei di rinculo e rivelatori sul piano focale. È stato messo in funzione
      con fasci stabili e radioattivi di ISAC; il suo primo studio con fascio
      radioattivo è stato ²¹Na(p,γ)²²Mg.
    refs: [hutcheon2003]

  - id: erna
    name: ERNA recoil separator
    lab: CIRCE laboratory, Caserta (at Ruhr-Universität Bochum until 2009)
    lab_it: Laboratorio CIRCE, Caserta (alla Ruhr-Universität Bochum fino al 2009)
    location: Caserta
    country: Italy
    country_it: Italia
    underground: false
    accelerator: recoil separator, first on the Bochum 4 MV Dynamitron, since 2009 at CIRCE
    accelerator_it: >-
      separatore di rinculo, prima sul Dynamitron da 4 MV di Bochum, dal 2009 al
      CIRCE
    summary: >-
      The European Recoil separator for Nuclear Astrophysics, built to measure
      helium-capture reactions such as ¹²C(α,γ)¹⁶O in inverse kinematics by
      counting the product nuclei directly.
    summary_it: >-
      L'European Recoil separator for Nuclear Astrophysics, costruito per
      misurare reazioni di cattura di elio come ¹²C(α,γ)¹⁶O in cinematica
      inversa, contando direttamente i nuclei prodotti.
    details: >-
      ERNA was built at the 4 MV Dynamitron in Bochum to detect ¹⁶O recoils
      from ¹²C(α,γ)¹⁶O. Wien filters before and after the analysing magnet
      reduced the ¹⁶O contamination of the ¹²C beam from about 10⁻¹¹ to below
      2 × 10⁻²⁹. In 2009 the separator moved to the CIRCE laboratory in
      Caserta, where a charge-state selection dipole was added directly after
      the target.
    details_it: >-
      ERNA è stato costruito al Dynamitron da 4 MV di Bochum per rivelare i
      nuclei di rinculo di ¹⁶O da ¹²C(α,γ)¹⁶O. Filtri di Wien prima e dopo il
      magnete di analisi riducevano la contaminazione di ¹⁶O nel fascio di ¹²C
      da circa 10⁻¹¹ a meno di 2 × 10⁻²⁹. Nel 2009 il separatore è stato
      trasferito al laboratorio CIRCE di Caserta, dove è stato aggiunto un
      dipolo di selezione dello stato di carica subito dopo il bersaglio.
    refs: [rogalla1999, schurmann2005, broggini2019]

  - id: kellogg
    name: Kellogg Radiation Laboratory, Caltech
    lab: California Institute of Technology
    location: Pasadena, California
    country: United States
    country_it: Stati Uniti
    underground: false
    summary: >-
      The laboratory where William Fowler and colleagues measured many of the
      reactions that power stars. Salpeter's work on the triple-alpha process
      (1951) and the measurements of the Hoyle state (1953, 1957) were done
      here.
    summary_it: >-
      Il laboratorio in cui William Fowler e colleghi misurarono molte delle
      reazioni che alimentano le stelle. Qui furono svolti il lavoro di Salpeter
      sul processo tre alfa (1951) e le misure dello stato di Hoyle (1953,
      1957).
    refs: [salpeter1952, dunbar1953, cook1957, fowler1984]

  - id: atomki
    name: Atomki, Debrecen
    lab: Institute for Nuclear Research (Atomki)
    location: Debrecen
    country: Hungary
    country_it: Ungheria
    underground: false
    summary: >-
      A nuclear research institute with several accelerators. Its astrophysics
      group is known for activation measurements, in which the cross section is
      found by counting the decays of the radioactive product after the
      irradiation.
    summary_it: >-
      Un istituto di ricerca nucleare con diversi acceleratori. Il suo gruppo di
      astrofisica è noto per le misure per attivazione, in cui la sezione d'urto
      si ricava contando, dopo l'irraggiamento, i decadimenti del prodotto
      radioattivo.
    refs: [gyurky2023]

