# References for carbon burning (¹²C + ¹²C).
# Verified by web search on 2026-10-12. Direct access to arxiv.org, doi.org and
# the publishers was blocked from the build container, so `checked` names the
# records that confirmed each entry. A DOI is given only where a record showed
# it, or where it follows the APS scheme from a confirmed APS journal
# reference. Titles are given as the confirming record printed them.

# --- Early direct measurements --------------------------------------------------

patterson1969:
  authors: J. R. Patterson, H. Winkler, C. S. Zaidins
  title: Experimental investigation of the stellar nuclear reaction ¹²C + ¹²C at low energies
  journal: Astrophys. J. 157, 367 (1969)
  year: 1969
  checked: citation (authors, title, volume, page) from the reference lists of arXiv 1905.02054, 1810.07887 and nucl-ex/0702023; DOI not shown by any record found, so omitted, 2026-10-12

mazarakis1973:
  authors: M. G. Mazarakis, W. E. Stephens
  title: Experimental measurements of the ¹²C + ¹²C nuclear reactions at low energies
  journal: Phys. Rev. C 7, 1280 (1973)
  year: 1973
  doi: 10.1103/PhysRevC.7.1280
  checked: APS Phys. Rev. C vol. 7 issue 4 listing and the reference lists of arXiv 2609.25996 and nucl-ex/0702023; DOI from the APS scheme, 2026-10-12

high1977:
  authors: M. D. High, B. Čujec
