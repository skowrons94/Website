        "Software": { "webdaq": "…", "caendaq": "…", "acquisition_mode": "hardware" },
        "Boards": [ … ]
      },
      "Files": {
        "Data": ["run_1276_0000.caendat"],
        "Board Configuration": ["V1730_0.json"],
