id: 26Al-bp-26Mg
label: ²⁶Al(β⁺ν)²⁶Mg
kind: decay
target: 26Al
projectile: ""
ejectile: e+ nu
product: 26Mg
networks: [mgal]
summary: >-
  ²⁶Al in its ground state lives for about a million years. It decays to an
  excited state of ²⁶Mg, which at once emits a γ-ray of 1809 keV. Space
  telescopes see this γ-ray line across the Milky Way: a map of where nuclei
  were made in the last few million years. ²⁶Al also has a second, excited form,
  the isomer ²⁶ᵐAl. It decays within seconds, straight to the ground state of
  ²⁶Mg, and gives no 1809 keV γ-ray. Only ²⁶Al made in its ground state feeds
  the line.
summary_it: >-
  Il ²⁶Al nel suo stato fondamentale vive circa un milione di anni. Decade in
  uno stato eccitato del ²⁶Mg, che emette subito un raggio γ da 1809 keV. I
  telescopi spaziali vedono questa riga γ in tutta la Via Lattea: una mappa di
  dove sono stati prodotti nuclei negli ultimi pochi milioni di anni. Il ²⁶Al ha
  anche una seconda forma, eccitata: l'isomero ²⁶ᵐAl. Decade in pochi secondi,
  direttamente nello stato fondamentale del ²⁶Mg, e non emette il raggio γ da
  1809 keV. Solo il ²⁶Al prodotto nello stato fondamentale alimenta la riga.
