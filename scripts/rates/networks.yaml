# The networks of the rates explorer (/atlas/rates), as data.
#
# Read by scripts/rates/build.py, which asks pynucastro (scripts/rates/
# pyna_export.py) for every forward REACLIB rate linking `nuclei`, keeps those
# that `select` admits, and writes public/rates/<id>.json. Nothing about a
# network is written in the site's components: they read these fields.
#
#   family      the atlas family (networks.yaml of the atlas) it belongs to
#   nuclei      pynucastro names
#   select      hydrogen-burning: proton captures and weak decays, Q > 0
#               all: every forward rate
#   include     REACLIB rate names (pynucastro fname) added to the selection
#   exclude     REACLIB rate names removed from it
#   scenarios   ids from scenarios.yaml, the first is the default
#   fuel        the nucleus a burn "until" condition refers to by default
#   key         the reactions a general reader sees first (one slider each)
#   reference   the default reference of the "relative to" rate plot
#   cycle       optional: the reactions of the main cycle or chain, among
#               which the slowest step is the bottleneck
#   show        the nuclei the abundance plot opens with (at most three: the
#               fuel, the ash and one nucleus the network is about)
#   notes       optional {en, it}: a caveat shown to specialists
#   newer       optional {reaction: {en, it}}: rates REACLIB still takes from
#               an older source although newer data exist (flagged in the
#               specialist table)
#   not_modelled optional {nucleus: {en, it}}: nuclei whose production needs
#               physics the network lacks (greyed out, with the reason)
#
# Decays: every REACLIB decay of a nucleus living longer than 10⁸ years
# (NUBASE2020) is dropped, and the laboratory ground-state decay of ²⁶Al is
# added to REACLIB's isomer term (pyna_export.py: lab_decays).

networks:
  - id: pp
    show: [p, he4, he3]
    family: pp
    nuclei: [p, d, he3, he4, li7, be7, b8]
    select: all
    # Minor channels left out: the deuteron is destroyed by protons within
    # seconds, so d + d, d + ³He and d + ⁷Be never compete, and ³He + ⁷Be is
    # negligible. ⁸B → ⁸Be duplicates ⁸B → 2α in REACLIB (⁸Be is not tracked).
    exclude:
      - d_d_to_He4_reaclib
      - He3_d_to_p_He4_reaclib
      - Be7_d_to_p_He4_He4_reaclib
      - Be7_He3_to_p_p_He4_He4_reaclib
    scenarios: [sun-core, massive-15]
    fuel: p
    key:
      - p_p_to_d_beta_pos_reaclib
      - d_p_to_He3_reaclib
      - He3_He3_to_p_p_He4_reaclib
      - He3_He4_to_Be7_reaclib
      - Be7_p_to_B8_reaclib
    reference: He3_He3_to_p_p_He4_reaclib
    newer:
      d_p_to_He3_reaclib:
        en: "REACLIB: Descouvemont et al. 2004 (de04). LUNA measured it at Big Bang energies: Mossa et al. 2020, Nature 587, 210."
        it: "REACLIB: Descouvemont et al. 2004 (de04). LUNA l'ha misurata alle energie del Big Bang: Mossa et al. 2020, Nature 587, 210."
    cycle:
      - p_p_to_d_beta_pos_reaclib
      - d_p_to_He3_reaclib
      - He3_He3_to_p_p_He4_reaclib

  - id: cno
    show: [p, c12, n14]
    family: cno
    nuclei: [p, he4, c12, c13, n13, n14, n15, o14, o15, o16, o17, o18, f17, f18, f19, ne18, ne19, ne20]
    select: hydrogen-burning
    # The breakout of the hot CNO cycle by α captures on ¹⁴O and ¹⁵O; the
    # other α captures belong to helium burning.
    include: [O15_He4_to_Ne19_reaclib, O14_He4_to_p_F17_reaclib]
    scenarios: [massive-15, sun-core, nova]
    fuel: p
    key:
      - C12_p_to_N13_reaclib
      - C13_p_to_N14_reaclib
      - N14_p_to_O15_reaclib
      - N15_p_to_He4_C12_reaclib
      - N15_p_to_O16_reaclib
      - O17_p_to_He4_N14_reaclib
    reference: N14_p_to_O15_reaclib
    newer:
      C12_p_to_N13_reaclib:
        en: "REACLIB: ls09. Newer: LUNA, Skowronski et al. 2023, PRL 131, 162701."
        it: "REACLIB: ls09. Più recente: LUNA, Skowronski et al. 2023, PRL 131, 162701."
      C13_p_to_N14_reaclib:
        en: "REACLIB: NACRE 1999. Newer: LUNA, Skowronski et al. 2023, PRL 131, 162701."
        it: "REACLIB: NACRE 1999. Più recente: LUNA, Skowronski et al. 2023, PRL 131, 162701."
      O17_p_to_He4_N14_reaclib:
        en: "REACLIB: Iliadis et al. 2010 (il10). Newer: LUNA, Bruno et al. 2016, PRL 117, 142502 (the 64.5 keV resonance)."
        it: "REACLIB: Iliadis et al. 2010 (il10). Più recente: LUNA, Bruno et al. 2016, PRL 117, 142502 (la risonanza a 64,5 keV)."
    cycle:
      - C12_p_to_N13_reaclib
      - N13_to_C13_beta_pos_reaclib
      - C13_p_to_N14_reaclib
      - N14_p_to_O15_reaclib
      - O15_to_N15_beta_pos_reaclib
      - N15_p_to_He4_C12_reaclib

  - id: nena
    show: [p, ne22, na23]
    family: nena
    nuclei: [p, he4, ne20, ne21, ne22, na21, na22, na23, mg22, mg23, mg24]
    select: hydrogen-burning
    scenarios: [agb-hbb, massive-25, nova-one]
    fuel: p
    newer:
      Ne22_p_to_Na23_reaclib:
        en: "REACLIB: Kelly et al. 2017 (ke17). Newer: LUNA, Ferraro et al. 2018, PRL 121, 172701."
        it: "REACLIB: Kelly et al. 2017 (ke17). Più recente: LUNA, Ferraro et al. 2018, PRL 121, 172701."
    key:
      - Ne20_p_to_Na21_reaclib
      - Ne21_p_to_Na22_reaclib
      - Ne22_p_to_Na23_reaclib
      - Na23_p_to_He4_Ne20_reaclib
      - Na23_p_to_Mg24_reaclib
    reference: Ne22_p_to_Na23_reaclib
    cycle:
      - Ne20_p_to_Na21_reaclib
      - Na21_to_Ne21_beta_pos_reaclib
      - Ne21_p_to_Na22_reaclib
      - Na22_to_Ne22_beta_pos_reaclib
      - Ne22_p_to_Na23_reaclib
      - Na23_p_to_He4_Ne20_reaclib

  - id: mgal
    show: [p, mg25, al26]
    notes:
      en: "²⁶Al is one species here. Its decay is the laboratory β⁺ decay of the ground state (t½ = 7.17 × 10⁵ yr, NUBASE2020; REACLIB lacks it) plus REACLIB's term for the thermally populated isomer ²⁶Alᵐ (228 keV, 6.3 s), which assumes the two in equilibrium: true above about 0.4 GK only, so at nova temperatures the decay is an upper bound, and below 0.05 GK the term vanishes. ²⁵Mg(p,γ) feeds the ground state entirely, while in a star part of it goes to the isomer, which decays to ²⁶Mg without leaving ²⁶Al: the ²⁶Al here is an upper limit."
      it: "Qui il ²⁶Al è una sola specie. Il suo decadimento è il decadimento β⁺ di laboratorio dello stato fondamentale (t½ = 7,17 × 10⁵ anni, NUBASE2020; REACLIB non lo contiene) più il termine di REACLIB per l'isomero ²⁶Alᵐ popolato termicamente (228 keV, 6,3 s), che suppone i due in equilibrio: vero solo sopra circa 0,4 GK, quindi alle temperature di una nova il decadimento è un limite superiore, e sotto 0,05 GK il termine si annulla. La ²⁵Mg(p,γ) alimenta tutto lo stato fondamentale, mentre in una stella una parte va all'isomero, che decade in ²⁶Mg senza lasciare ²⁶Al: il ²⁶Al qui è un limite superiore."
    family: mgal
    nuclei: [p, he4, mg24, mg25, mg26, al25, al26, al27, si26, si27, si28]
    select: hydrogen-burning
    scenarios: [agb-hbb, massive-25, nova-one]
    fuel: p
    newer:
      Mg25_p_to_Al26_reaclib:
        en: "REACLIB: Iliadis et al. 2010 (il10). Newer: LUNA, Straniero et al. 2013, ApJ 763, 100 (resonance strengths and the ground-state fraction)."
        it: "REACLIB: Iliadis et al. 2010 (il10). Più recente: LUNA, Straniero et al. 2013, ApJ 763, 100 (forze delle risonanze e frazione allo stato fondamentale)."
    key:
      - Mg24_p_to_Al25_reaclib
      - Mg25_p_to_Al26_reaclib
      - Mg26_p_to_Al27_reaclib
      - Al27_p_to_He4_Mg24_reaclib
      - Al27_p_to_Si28_reaclib
    reference: Mg25_p_to_Al26_reaclib
    cycle:
      - Mg24_p_to_Al25_reaclib
      - Al25_to_Mg25_beta_pos_reaclib
      - Mg25_p_to_Al26_reaclib
      - Al26_to_Mg26_beta_pos_reaclib
      - Mg26_p_to_Al27_reaclib
      - Al27_p_to_He4_Mg24_reaclib

  # The s-process, iron to bismuth: a reduced network along the valley of
  # stability (scripts/rates/pyna_export.py, s_process_rates), with the
  # light nuclei that make and steal the neutrons. Its explorer is
  # /atlas/rates/s-process.
  #   light   every forward REACLIB rate among these
  #   heavy   Lodders' nuclei from zmin to zmax, closed under (n,γ) from any
  #           nucleus living longer than extend_halflife_s, and under decay
  #   groups  the reactions the explorer offers to scale, by their role
  #   knobs   initial abundances the explorer offers to scale
  - id: sprocess
    family: s-process
    builder: sprocess
    light: [n, p, he4, c12, c13, n13, c14, n14, n15, o15, o16, o17, o18, f18, f19, ne20, ne21, ne22, ne23, na23, na24, mg24, mg25, mg26, mg27, al27]
    heavy: { zmin: 26, zmax: 84, extend_halflife_s: 21600 }
    scenarios: [agb-13c-pocket, agb-thermal-pulse, massive-he-core]
    show: [n, fe56, ba138]
    # heavy nuclei whose abundance over time the explorer keeps (the light
    # ones are always kept)
    track: [fe56, ni60, se80, kr84, kr85, kr86, sr86, sr88, zr90, zr96, ba134, ba136, ba138, ce140, sm148, sm150, sm151, pb204, pb206, pb207, pb208, bi209]
    groups:
      - id: sources
        reactions: [C13_He4_to_n_O16_reaclib, Ne22_He4_to_n_Mg25_reaclib]
      - id: competitors
        reactions: [Ne22_He4_to_Mg26_reaclib, O17_He4_to_n_Ne20_reaclib]
      - id: poisons
        reactions: [N14_n_to_p_C14_reaclib, C12_n_to_C13_reaclib, O16_n_to_O17_reaclib, Ne22_n_to_Ne23_reaclib, Mg25_n_to_Mg26_reaclib, Mg26_n_to_Mg27_reaclib]
      - id: seeds
        reactions: [Fe56_n_to_Fe57_reaclib]
      - id: branches
        reactions: [Kr85_n_to_Kr86_reaclib, Zr93_n_to_Zr94_reaclib, Sm151_n_to_Sm152_reaclib, Tm171_n_to_Tm172_reaclib, Tl204_n_to_Tl205_reaclib]
    knobs: [c13, n14, ne22]
    newer:
      C13_He4_to_n_O16_reaclib:
        en: "REACLIB: Guo et al. 2012 (gl12). Newer: LUNA, Ciani et al. 2021, PRL 127, 152701."
        it: "REACLIB: Guo et al. 2012 (gl12). Più recente: LUNA, Ciani et al. 2021, PRL 127, 152701."
      N14_n_to_p_C14_reaclib:
        en: "REACLIB: Caughlan & Fowler 1988 (cf88), the main poison of the pocket; newer measurements exist."
        it: "REACLIB: Caughlan e Fowler 1988 (cf88), il veleno principale della tasca; esistono misure più recenti."
    # stable nuclei whose s-process production needs decays REACLIB does
    # not have (stellar, temperature-dependent ones)
    not_modelled:
      er164:
        en: "needs the decay of ¹⁶³Dy in the star (stable in the laboratory, β⁻-unstable when ionised; Jung et al. 1992), not modelled"
        it: "richiede il decadimento del ¹⁶³Dy nella stella (stabile in laboratorio, instabile β⁻ quando è ionizzato; Jung et al. 1992), non modellato"
      hf176:
        en: "needs the short-lived isomer of ¹⁷⁶Lu, thermally populated in the star (Takahashi & Yokoi 1987), not modelled"
        it: "richiede l'isomero di vita breve del ¹⁷⁶Lu, popolato termicamente nella stella (Takahashi e Yokoi 1987), non modellato"
    # 481 nuclei: the explorer's burns run at rtol 1e-3 (RODAS3 then agrees
    # with pynucastro to ~5e-5; npm run test:rates checks it at 1e-6)
    solver: { rtol: 1.0e-3 }
