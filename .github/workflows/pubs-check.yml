# Once a month, compare content/publications.yaml with ORCID and Crossref
# (`npm run pubs:check`, scripts/pubs/check.mjs) and, when there is anything
# to review, open an issue with the proposal (or comment on the one already
# open). It never edits the YAML and never commits.
#
# Opt-in. The schedule does nothing until the repository variable
# PUBS_CHECK is set to `true` (Settings → Secrets and variables → Actions →
# Variables). "Run workflow" on the Actions tab runs it at any time.
# Optional variable PUBS_MAILTO: an address for Crossref's "polite pool"
# (sent to Crossref with each request; leave unset to send none).
#
# Permissions: read the code, write issues; nothing else.
name: Publications check (ORCID)

on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pubs-check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.PUBS_CHECK == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # js-yaml is the only package the check needs; no install scripts run.
      - run: npm ci --ignore-scripts

      - name: Compare with ORCID and Crossref
        env:
          PUBS_MAILTO: ${{ vars.PUBS_MAILTO }}
        run: npm run pubs:check -- --out pubs-proposal.md

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(node -p 'require("./pubs-proposal.json").count')
          if [ "$count" = "0" ]; then
            echo "Nothing new on ORCID or Crossref."
            exit 0
          fi
          # An issue body is limited to 65536 characters.
          head -c 60000 pubs-proposal.md > body.md
          title="Publications: ORCID and Crossref differences to review"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
