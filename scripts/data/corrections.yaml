# Curated corrections to EXFOR, applied by the pipeline (nucdata/corrections.py)
# before anything else reads the numbers: shards, index, exports and plots all
# carry the corrected values, and each corrected dataset says so (flag
# `corrected`, `meta.corrections`). Nothing else in EXFOR is changed.
#
# Each entry:
#   id        EXFOR subentry ("F0580.002", every reaction pointer of it) or
#             subentry and pointer ("O2548.002.1")
#   reaction  what it measures (site notation), for the reader
#   paper     the publication the subentry compiles
#   problem   what is wrong in the EXFOR file
#   correct   the change, one item per column of the DATA/COMMON tables:
#               column   the EXFOR heading as written
#               heading  read the column under this heading instead (a frame
#                        error: EN holds c.m. energies -> EN-CM)
#               unit     read the column in this EXFOR unit instead
#               factor   multiply the column by this number
#               where    only on the rows whose value in another column is
#                        below a number ({column: EN, below: 819}, in that
#                        column's own unit); with heading DATA-MAX it reads
#                        plain values as upper limits
#   evidence  why, from the EXFOR file itself (lines of the pinned commit,
#             sources.json) and from the paper
#   verified  who checked it against the EXFOR file, and how
#   status    what is still open
#   reported_to_nrdc  no | yes (date)
#   apply     false keeps an entry on record without applying it
#   nrdc      false: not a compilation error (the file gives what the paper
#             gives), but a reading the site makes; listed apart in the report
#
# scripts/data/nrdc-report.md is the draft report to the NRDC built from this
# list (`python scripts/data/dx.py nrdc-report`); the owner has decided not to
# send it. Every entry here was checked against the .x4 file at the pinned
# commit; its status says whether the owner has also confirmed it.

