id: 7Be-pg-8B
label: ⁷Be(p,γ)⁸B
kind: capture
target: 7Be
projectile: 1H
ejectile: g
product: 8B
networks: [pp3]
importance: key
summary: >-
  A ⁷Be nucleus captures a proton and becomes ⁸B, giving off a γ-ray. The ⁸B
  then decays and emits the high-energy solar neutrinos that started the solar
  neutrino problem.
summary_it: >-
  Un nucleo di ⁷Be cattura un protone e diventa ⁸B, emettendo un raggio γ. L'⁸B
  poi decade ed emette i neutrini solari di alta energia da cui nacque il
  problema dei neutrini solari.
role: >-
  Only a small fraction of the ⁷Be in the Sun captures a proton; most of it
  captures an electron instead. Yet this rare branch makes the most energetic
  of the common solar neutrinos, the ones seen by the first chlorine detector
  in the Homestake mine and later measured precisely by Super-Kamiokande and
  SNO. The predicted number of these neutrinos is directly proportional to the
  rate of this reaction, so it has to be known well to use them as a probe of
  the solar core and of neutrino properties.
role_it: >-
  Solo una piccola frazione del ⁷Be nel Sole cattura un protone; la maggior
  parte cattura invece un elettrone. Eppure questo ramo raro produce i più
  energetici tra i neutrini solari comuni, quelli visti dal primo rivelatore al
  cloro nella miniera di Homestake e poi misurati con precisione da
  Super-Kamiokande e SNO. Il numero previsto di questi neutrini è direttamente
  proporzionale al tasso di questa reazione, che deve quindi essere ben noto per
  usarli come sonda del nucleo solare e delle proprietà dei neutrini.
details: >-
  The measurement is difficult because the target is radioactive: ⁷Be decays by
  electron capture, so targets must be produced, characterized and used within
  months, and their areal density and uniformity become the main systematic
  uncertainty. The capture is an external,
  non-resonant E1 process at low energy, with a narrow M1 resonance (the 1⁺
  state of ⁸B) near 630 keV, and the extrapolation to solar energies relies on
  models of the energy dependence. Since 1998 the direct experiments with ⁷Be
  targets at Orsay and Bordeaux, at the Weizmann Institute and in Seattle give
  S(0) between about 18.5 and 22 eV b; the Seattle group quotes a model
  uncertainty of the extrapolation as large as its experimental one. The
  S-factor has also been inferred from Coulomb dissociation of ⁸B beams on
  heavy targets, at RIKEN and at GSI. The Solar Fusion evaluations base the
  recommended value on the direct measurements.
status: improving
status_note: >-
  The best experiments, all with radioactive ⁷Be targets, differ by up to
  about 15%, and extending their data to solar energies adds an uncertainty
  of similar size.
status_note_it: >-
  I migliori esperimenti, tutti con bersagli radioattivi di ⁷Be, differiscono
  fino a circa il 15%, e il prolungamento dei loro dati alle energie solari
  aggiunge un'incertezza di entità simile.
methods: [direct-surface, coulomb-dissociation]
measurements:
  - year: 1983
    facility: other
    lab: "Argonne National Laboratory, Argonne IL"
    method: direct-surface
    energy: "low energies and the 1⁺ resonance"
    energy_it: "basse energie e la risonanza 1⁺"
    note: >-
      Radioactive ⁷Be target, ⁸B detected through the delayed α particles from
      its β decay; the ⁷Be areal density determined with two independent
      methods, which removed the dependence of earlier data on the ⁷Li(d,p)⁸Li
      normalization.
    refs: [filippone1983]
  - year: 1994
    facility: riken
    method: coulomb-dissociation
    energy: "⁸B beam at about 50 MeV/u"
    energy_it: "fascio di ⁸B a circa 50 MeV/u"
    note: >-
      First Coulomb-dissociation experiment: break-up of ⁸B into ⁷Be + p in the
      Coulomb field of a heavy target, converted to the low-energy capture
      cross section.
    refs: [motobayashi1994]
  - year: 1998
    facility: cenbg
    method: direct-surface
    energy: "0.35–1.4 MeV"
    note: >-
      Two independent measurements with different beam conditions, targets and
      detectors, in agreement with each other; the extrapolated S(0) is
      15–20% below the value recommended at the time.
    refs: [hammache1998]
  - year: 2001
    facility: csnsm-orsay
    method: direct-surface
    energy: "111.7, 134.7 and 185.8 keV"
    energy_it: "111,7; 134,7 e 185,8 keV"
    note: >-
      A 132 mCi ⁷Be target, intense proton beams and a large-acceptance
      solenoidal spectrometer; S(0) = 18.5 ± 2.4 eV b from these data and
      18.8 ± 1.7 eV b combined with the 1998 results.
    refs: [hammache2001]
  - year: 2003
    facility: weizmann
    method: direct-surface
    note: >-
      ⁷Be implanted in the backing and a raster-scanned proton beam, which
      removed the loss of ⁸B by backscattering; extrapolated S(0) =
      21.2 ± 0.7 eV b in the arXiv version (an erratum followed in 2004).
    refs: [baby2003]
  - year: 2003
    facility: gsi
    method: coulomb-dissociation
    energy: "⁸B beam at 254 MeV/u"
    energy_it: "fascio di ⁸B a 254 MeV/u"
    note: >-
      Exclusive Coulomb-dissociation measurement at high beam energy; the full
      analysis followed in 2006.
    refs: [schumann2003, schumann2006]
  - year: 2003
    facility: cenpa
    method: direct-surface
    note: >-
      Precision measurement with a ⁷Be target made at TRIUMF; S(0) =
      22.1 ± 0.6 (expt) ± 0.6 (theor) eV b, and a recommended best value of
      21.4 eV b.
    refs: [junghans2003]
  - year: 2010
    facility: cenpa
    method: direct-surface
    energy: "below the 1⁺ resonance"
    energy_it: "sotto la risonanza 1⁺"
    note: >-
      Reanalysis of the earlier data with a more detailed target analysis and
      improved stopping powers: S(0) = 21.5 ± 0.6 (expt) ± 0.6 (theor) eV b,
      and 20.9 ± 0.6 ± 0.6 eV b from a fit of all modern low-energy data with
      the same theory.
    refs: [junghans2010]
evaluations: [adelberger2011, acharya2025]
open_questions:
  - The theoretical energy dependence used to extrapolate the direct data to solar energies.
  - The spread of about 15% between the S(0) values of the modern direct experiments.
open_questions_it:
  - "L'andamento in energia teorico usato per estrapolare i dati diretti alle energie solari."
  - "La dispersione di circa il 15% tra i valori di S(0) degli esperimenti diretti moderni."
related: [3He-ag-7Be, 8B-bp-8Be, 7Be-ec-7Li, 3He-hep-4He]
