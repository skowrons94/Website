# The WebDAQ companion page, /software/webdaq and /it/software/webdaq
# (components/pages/webdaq.tsx). A field ending in `_it` is the Italian version
# of the field before it.
#
# Every statement about what WebDAQ does is checked against the WebDAQ code at
# commit a1cc18f (github.com/skowrons94/WebDAQ): README.md, doc/details.md,
# doc/example-session.md, doc/usage.md, doc/run-data.md,
# server/app/services/run_metadata_snapshot.py and
# server/app/services/caen_acquisition.py. Under FAIR, `now` is only what the
# code does (Jakub: metadata.json is designed to be FAIR-ready); `later` holds
# only what verifiably does not exist yet, shown as next steps.
# Wording rule: the 3.5 MV accelerator is "the MV machine of the Bellotti Ion
# Beam Facility (BIBF)".

lead: >-
  WebDAQ is the browser-based data acquisition developed for LUNA. It
  configures the CAEN digitizers, tunes them against a live spectrum, takes
  the runs, watches the rates and the beam, and keeps with every run a record
  meant to outlive the shift. It runs the measurements of ¹²C + ¹²C, of
  SHADES (²²Ne(α,n)²⁵Mg), of EASY (²²Ne(α,γ)²⁶Mg), of ¹⁹F + p, of ¹⁰B + α (the
  NUCLEAR project led by Marialuisa Aliotta) and of ²⁴Mg + p.
lead_it: >-
  WebDAQ è il sistema di acquisizione dati via browser sviluppato per LUNA.
  Configura i digitizzatori CAEN, li regola guardando uno spettro in tempo
  reale, avvia i run, sorveglia i rate e il fascio, e accompagna ogni run con
  una documentazione pensata per durare più del turno. Gestisce le misure di
  ¹²C + ¹²C, di SHADES (²²Ne(α,n)²⁵Mg), di EASY (²²Ne(α,γ)²⁶Mg), di ¹⁹F + p,
  di ¹⁰B + α (il progetto NUCLEAR guidato da Marialuisa Aliotta) e di ²⁴Mg + p.

demoNote: >-
  The demo runs in your browser with simulated detectors: nothing in it is real
  hardware or real data.
demoNote_it: >-
  La demo gira nel tuo browser con rivelatori simulati: niente di ciò che vedi
  è hardware vero o dati veri.

hero:
