        "Manifest": [ { "Name": "run_1276_0000.caendat", "Role": "raw-data", "Bytes": 1843200000 } ]
      }
    }
  exampleCaption: >-
    An abridged metadata.json. The keys and their order are WebDAQ's; the values
    are made up for the example.
  exampleCaption_it: >-
    Un metadata.json abbreviato. Le chiavi e il loro ordine sono quelli di
    WebDAQ; i valori sono inventati per l'esempio.

demo:
  title: Try the demo
  title_it: Prova la demo
  text: >-
    The real WebDAQ interface, built from its code and connected to a simulated
    acquisition that runs in your browser. Choose the detectors: germanium
    (HPGe) for resolution, BGO scintillators for efficiency, or neutron
    detectors, liquid scintillators like EJ-309 that tell neutrons from γ-rays
    by the shape of the pulse. Then pick a source, tune a channel while the run
    goes, mark a peak, and download the files a real run would leave,
    metadata.json included.
  text_it: >-
    La vera interfaccia di WebDAQ, costruita dal suo codice e collegata a
    un'acquisizione simulata che gira nel tuo browser. Scegli i rivelatori: al
    germanio (HPGe) per la risoluzione, scintillatori BGO per l'efficienza,
    oppure rivelatori di neutroni, scintillatori liquidi come l'EJ-309 che
    distinguono i neutroni dai raggi γ dalla forma dell'impulso. Poi scegli una
    sorgente, regola un canale mentre il run va avanti, segna un picco e
    scarica i file che lascerebbe un run vero, metadata.json compreso.
  phone: >-
    WebDAQ is made for a desktop screen; on a phone the demo works, but its
    tables scroll sideways.
  phone_it: >-
    WebDAQ è pensato per lo schermo di un computer; sul telefono la demo
    funziona, ma le sue tabelle scorrono di lato.

outlook: >-
  Keeping data alive starts with recording them well. I keep developing
  WebDAQ with that aim, and the demo is kept in step with WebDAQ
  by a test that checks every call the interface makes against the simulation.
outlook_it: >-
  Tenere vivi i dati comincia dal registrarli bene. È con questo obiettivo che
  continuo a sviluppare WebDAQ, e la demo resta allineata
  a WebDAQ grazie a un test che confronta ogni chiamata dell'interfaccia con la
  simulazione.

