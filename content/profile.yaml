intro:
  - >-
    I measure the nuclear reactions that power stars, at the energies at which
    stars actually run them. Most of that work happens at LUNA, under 1400 m of
    Gran Sasso rock, where the cosmic-ray background is six orders of magnitude
    lower than at the surface and cross sections of picobarns become reachable.
  - >-
    A measurement, though, is only ever a handful of points in a narrow window of
    energy. Turning those points into the quantity astrophysics needs — a rate at
    stellar temperatures, often far below anything measurable — is R-matrix
    theory's job. Since 2025 I have been the maintainer and lead developer of
    AZURE2, the reference R-matrix code for the field, and I sit on the IAEA
    INDEN-LE committee that evaluates light-element cross sections.
  - >-
    This site collects both halves: notes on the theory, and evaluations you can
    open and run yourself in the browser.

intro_it:
  - >-
    Misuro le reazioni nucleari che alimentano le stelle, alle energie a cui
    avvengono davvero nelle stelle. Gran parte di questo lavoro si svolge a LUNA,
    sotto 1400 m di roccia del Gran Sasso, dove il fondo dovuto ai raggi cosmici
    è sei ordini di grandezza più basso che in superficie e diventano misurabili
    sezioni d'urto dell'ordine del picobarn.
  - >-
    Una misura, però, è sempre solo una manciata di punti in una stretta
    finestra di energia. Trasformare quei punti nella grandezza che serve
    all'astrofisica, un tasso di reazione alle temperature stellari, spesso
    molto al di sotto di qualunque energia misurabile, è il compito della teoria
    R-matrix. Dal 2025 sono il responsabile e lo sviluppatore principale di
    AZURE2, il codice R-matrix di riferimento nel settore, e faccio parte del
    comitato INDEN-LE della IAEA, che valuta le sezioni d'urto degli elementi
    leggeri.
  - >-
    Questo sito raccoglie entrambe le metà: note sulla teoria e valutazioni che
    puoi aprire ed eseguire da te nel browser.

