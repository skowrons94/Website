# The longer introduction, beside the research threads on the landing page,
# for specialists. The lead above already says where and why; this is the rest.
intro:
  - >-
    At LUNA the rock above the laboratory reduces the flux of cosmic-ray muons
    by a factor of about a million, and cross sections of picobarns become
    measurable. A measurement, though, is only ever a handful of points in a
    narrow window of energy. Turning those points into the quantity astrophysics
    needs — a rate at stellar temperatures, often far below anything
    measurable — is R-matrix theory's job.
  - >-
    Since June 2025 I have been the maintainer and lead developer of AZURE2, the
    reference R-matrix code for the field, and I sit on the IAEA INDEN-LE
    committee that evaluates light-element cross sections. This site collects
    both halves: notes on the theory, and evaluations you can open and run
    yourself in the browser.

intro_it:
  - >-
    A LUNA la roccia sopra il laboratorio riduce il flusso dei muoni cosmici di
    circa un milione di volte, e diventano misurabili sezioni d'urto
    dell'ordine del picobarn. Una misura, però, è sempre solo una manciata di
    punti in una stretta finestra di energia. Trasformare quei punti nella
    grandezza che serve all'astrofisica, un tasso di reazione alle temperature
    stellari, spesso molto al di sotto di qualunque energia misurabile, è il
    compito della teoria R-matrix.
  - >-
    Da giugno 2025 sono il responsabile e lo sviluppatore principale di AZURE2, il
    codice R-matrix di riferimento nel settore, e faccio parte del comitato
    INDEN-LE della IAEA, che valuta le sezioni d'urto degli elementi leggeri.
    Questo sito raccoglie entrambe le metà: note sulla teoria e valutazioni che
    puoi aprire ed eseguire da te nel browser.

