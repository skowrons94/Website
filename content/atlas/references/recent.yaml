shen2023:
  authors: Y. P. Shen et al.
  title: New determination of the ¹²C(α,γ)¹⁶O reaction rate and its impact on the black-hole mass gap
  journal: Astrophys. J. 945, 41 (2023)
  year: 2023
  doi: 10.3847/1538-4357/acb7de
  checked: ApJ article page, NSF PAR and DOAJ records, by web search (ground-state ANC from ¹²C(¹¹B,⁷Li)¹⁶O at the Q3D spectrograph; total rate up to 21% above deBoer et al. 2017; lower and upper edges of the black-hole gap down by about 12% and 5%), 2026-10-13

haverson2026:
  authors: K. Haverson, R. Smith, M. Gai et al.
  title: Background-free ¹²C(α,γ) angular distribution measurements with a time projection chamber operating in gamma beams
  journal: Commun. Phys. 9, 27 (2026)
  year: 2026
  doi: 10.1038/s42005-025-02458-7
  checked: Communications Physics record (6 January 2026, DOI) and a 2026 LBL conference abstract, by web search (¹⁶O(γ,α) with an N₂O gas target at HIγS; E1–E2 phase angle reported to agree with unitarity for the first time); the value of the phase needs the full text, 2026-10-13

farmer2020:
  authors: R. Farmer, M. Renzo, S. E. de Mink, M. Fishbach, S. Justham
  title: Constraints from gravitational-wave detections of binary black hole mergers on the ¹²C(α,γ)¹⁶O rate
  journal: Astrophys. J. Lett. 902, L36 (2020)
  year: 2020
  arxiv: "2006.06678"
  checked: arXiv 2006.06678 and University of Amsterdam record, by web search (S(300 keV) > 175 keV b at 68% from the first ten black-hole mergers; O(50) mergers could pin S to ±10–30 keV b), 2026-10-13

# --- Neutron sources -----------------------------------------------------------

deboer2024:
  authors: R. J. deBoer et al.
  title: Measurement of the ¹³C(α,n₀)¹⁶O differential cross section from 0.8 to 6.5 MeV
  journal: Phys. Rev. Lett. 132, 062702 (2024)
  year: 2024
  doi: 10.1103/PhysRevLett.132.062702
  checked: ORNL record and NSF PAR copy, by web search (18 angles, 0–160°, over 700 angular distributions; extrapolation uncertainty potentially about 5%, against about 15% before; published 9 February 2024), 2026-10-13

shahina2024:
  authors: Shahina, R. J. deBoer, M. Wiescher et al.
  title: Strength measurement of the E_α,lab = 830 keV resonance in the ²²Ne(α,n)²⁵Mg reaction using a stilbene detector
  journal: Phys. Rev. C 110, 015801 (2024)
  year: 2024
  doi: 10.1103/PhysRevC.110.015801
  checked: ORNL and AFIT records and the Notre Dame highlight, by web search (published 3 July 2024; (α,n) strength similar to earlier direct studies, about three times the (α,γ) strength, against transfer data that suggest the two are about equal), 2026-10-13

