id: 14N-pg-15O
label: ¹⁴N(p,γ)¹⁵O
kind: capture
target: 14N
projectile: 1H
ejectile: g
product: 15O
networks: [cno1]
importance: key
summary: >-
  The slowest step of the CNO cycle. Its rate decides how fast the cycle runs,
  how much energy it gives, and how many CNO neutrinos leave the Sun.
summary_it: >-
  Il passo più lento del ciclo CNO. Il suo tasso decide quanto velocemente
  procede il ciclo, quanta energia fornisce e quanti neutrini CNO lasciano il
  Sole.
role: >-
  In a star burning hydrogen through the CNO cycle, nuclei wait longest as ¹⁴N
  before they capture the next proton. This one reaction therefore sets the pace
  of the whole cycle. It controls the energy production of stars more massive
  than the Sun, the flux of CNO neutrinos from the Sun's core, and, through the
  lifetime of stars leaving the main sequence, the ages estimated for the oldest
  star clusters.
role_it: >-
  In una stella che brucia idrogeno attraverso il ciclo CNO, i nuclei restano
  più a lungo come ¹⁴N prima di catturare il protone successivo. Questa sola
  reazione detta quindi il ritmo dell'intero ciclo. Controlla la produzione di
  energia delle stelle più massicce del Sole, il flusso di neutrini CNO dal
  nucleo del Sole e, attraverso la durata della vita delle stelle che lasciano
  la sequenza principale, le età stimate per gli ammassi stellari più antichi.
details: >-
  At solar temperatures the Gamow window lies near 27 keV, where the cross
  section is far too small to measure, so the S-factor is extrapolated from
  higher energies with R-matrix fits. The capture proceeds mainly to the
  6.79 MeV excited state of ¹⁵O and to its ground state, which makes the
  extrapolation sensitive to the γ-ray summing and to the subthreshold state at
  6.79 MeV. The width of that state, and so its contribution at low energy,
  has been probed through its lifetime and through asymptotic normalization
  coefficients from transfer reactions. The LUNA measurements at the 400 kV
  accelerator under Gran Sasso extended the data down to 70 keV, much closer
  to the solar energies than any surface experiment, and gave a total S(0)
  near 1.7 keV b. Surface measurements at HZDR and Notre Dame since 2018 cover
  0.3–1.3 MeV with high precision and anchor the R-matrix fit above the
  underground data, and an activation measurement at Atomki gives the total
  cross section at 0.55–1.4 MeV independently of γ-ray spectroscopy. A new
  LUNA campaign with solid nitrogen targets and a 4π BGO detector aims at the
  total and partial cross sections at about 100–370 keV, for a rate with 5 %
  precision (Gosta et al. 2025; Compagnucci et al. 2025).
status: improving
status_note: >-
  Direct data reach 70 keV; the remaining uncertainty comes from the split into
  the individual γ-ray transitions and from the extrapolation to solar energies.
status_note_it: >-
  I dati diretti arrivano a 70 keV; l'incertezza residua viene dalla
  suddivisione nelle singole transizioni γ e dall'estrapolazione alle energie
  solari.
status_plain: >-
  Measured underground close to the energies of the Sun. What remains
  uncertain is how the reaction divides among its several ways of giving off
  γ-rays, and the last step down to solar energies.
status_plain_it: >-
  Misurata sotto terra vicino alle energie del Sole. Resta incerto come la
  reazione si ripartisca tra i diversi modi in cui emette raggi γ, e
  l'ultimo passo fino alle energie solari.
methods: [direct-underground, direct-surface, activation, lifetime, anc]
measurements:
  - year: 2001
    facility: other
    lab: "Triangle Universities Nuclear Laboratory, Durham NC"
    method: lifetime
    energy: "259 keV resonance (Doppler-shift attenuation)"
    energy_it: "risonanza a 259 keV (attenuazione dello spostamento Doppler)"
    note: >-
      Mean lifetime of the 6793 keV state of ¹⁵O, τ ≈ 1.6 fs (90 % C.L.), from
      the Doppler-shift attenuation method. The value implies a much smaller
      contribution of the subthreshold state than inferred from the (p,γ)
      data.
    refs: [bertone2001]
  - year: 2003
    facility: texas-am
    method: anc
    energy: "proton-transfer reactions"
    energy_it: "reazioni di trasferimento di protoni"
    note: >-
      Asymptotic normalization coefficients for ¹⁴N + p → ¹⁵O from
      proton-transfer reactions, which fix the normalization of the direct
      capture to the ¹⁵O states and constrain the S-factor at zero energy.
    refs: [mukhamedzhanov2003]
  - year: 2004
    facility: luna-400
    method: direct-underground
    energy: "140–400 keV (proton energy)"
    energy_it: "140–400 keV (energia del protone)"
    note: >-
      First underground measurement with a solid TiN target and a HPGe detector,
      separating the γ-ray transitions; total S(0) = 1.7 ± 0.2 keV b from an
      R-matrix analysis.
    refs: [formicola2004]
  - year: 2005
    facility: other
    lab: "Triangle Universities Nuclear Laboratory, Durham NC"
    method: direct-surface
    energy: "155–524 keV (proton energy)"
    energy_it: "155–524 keV (energia del protone)"
    note: >-
      Direct measurement of the individual transitions at the surface; the
      extrapolated total S(0) is close to 1.7 keV b, in agreement with the LUNA
      result.
    refs: [runkle2005]
  - year: 2005
    facility: luna-400
    method: direct-underground
    energy: "119–367 keV (effective)"
    energy_it: "119–367 keV (energia efficace)"
    note: >-
      Full account of the LUNA solid-target campaign with TiN targets and HPGe
      detectors. Because of the level structure of ¹⁵O, the extrapolated S(0)
      depends on the R-matrix model.
    refs: [imbriani2005]
  - year: 2006
    facility: luna-400
    method: direct-underground
    energy: "down to 70 keV"
    energy_it: "fino a 70 keV"
    note: >-
      Windowless nitrogen gas target and 4π BGO summing detector; the cross
      section was measured down to 70 keV, where it is 0.24 pb.
    refs: [lemut2006]
  - year: 2008
    method: lifetime
    energy: "278 keV resonance (proton energy; Doppler-shift attenuation)"
    energy_it: "risonanza a 278 keV (energia del protone; attenuazione dello spostamento Doppler)"
    note: >-
      New Doppler-shift attenuation measurement of the 6792 keV state at the
      same resonance: the finite lifetime reported in 2001 is not confirmed,
      and τ < 0.77 fs.
    refs: [schurmann2008]
  - year: 2011
    facility: luna-400
    method: direct-underground
    energy: "proton energies 359, 380 and 399 keV"
    energy_it: "energie del protone 359, 380 e 399 keV"
    note: >-
      A composite germanium detector reduced the summing corrections; new cross
      sections for capture to the ground state and to the 5181, 6172 and
      6792 keV states.
    refs: [marta2011]
  - year: 2018
    facility: hzdr
    method: direct-surface
    energy: "0.357–1.292 MeV"
    note: >-
      S-factors at twelve energies for capture to the 6.79 MeV state, the
      strongest transition, and at ten energies between 0.479 and 1.202 MeV for
      the second strongest; the total rate uncertainty remained about 8 %.
    refs: [wagner2018]
  - year: 2021
    facility: notre-dame
    method: lifetime
    energy: "Doppler-shift attenuation"
    energy_it: "attenuazione dello spostamento Doppler"
    note: >-
      Lifetimes of several excited states of ¹⁵O; τ = 0.6 ± 0.4 fs for the
      6792 keV state, below the 2001 value and consistent with the 2008 limit.
    refs: [frentz2021]
  - year: 2022
    facility: atomki
    method: activation
    energy: "550–1400 keV"
    note: >-
      Total cross section from the ¹⁵O activity, counted through the
      annihilation radiation of its β⁺ decay, with about 10 % uncertainty and
      no dependence on γ-ray angular distributions or summing.
    refs: [gyurky2022]
  - year: 2022
    facility: notre-dame
    method: direct-surface
    energy: "0.27–1.07 MeV (proton energy)"
    energy_it: "0,27–1,07 MeV (energia del protone)"
    note: >-
      New data in an energy range where few measurements existed, analysed
      with a multichannel R-matrix fit of the ground-state and 6.79 MeV
      transitions; differences between the data and the R-matrix fits
      remain.
    refs: [frentz2022]
  - year: 2025
    facility: luna-400
    method: direct-underground
    energy: "about 100–370 keV (campaign under way)"
    energy_it: "circa 100–370 keV (campagna in corso)"
    note: >-
      Description of a new LUNA campaign with solid nitrogen targets and a 4π
      BGO detector, which aims at total and partial cross sections for a rate
      with 5 % precision; no cross sections published yet.
    refs: [gosta2025, compagnucci2025]
evaluations: [adelberger2011, acharya2025]
open_questions:
  - The ground-state transition, whose contribution at low energy depends on interference in the R-matrix fit.
  - The lifetime of the 6.79 MeV state of ¹⁵O, for which the published values disagree.
open_questions_it:
  - "La transizione allo stato fondamentale, il cui contributo a bassa energia dipende dall'interferenza nel fit R-matrix."
  - "La vita media dello stato a 6,79 MeV del ¹⁵O, per la quale i valori pubblicati non concordano."
related: [13C-pg-14N, 15O-bp-15N, 15N-pa-12C, 15N-pg-16O, 12C-pg-13N]
