id: 16O-pg-17F
label: ¹⁶O(p,γ)¹⁷F
kind: capture
target: 16O
projectile: 1H
ejectile: g
product: 17F
networks: [cno2]
importance: major
summary: >-
  Oxygen-16 captures a proton and becomes radioactive fluorine-17. It is the
  slowest step of the second CNO cycle.
summary_it: >-
  L'ossigeno-16 cattura un protone e diventa fluoro-17 radioattivo. È il passo
  più lento del secondo ciclo CNO.
role: >-
  Because this capture is slow, most of the oxygen-16 in a star survives
  hydrogen burning. The small part that burns makes oxygen-17, whose amount
  relative to oxygen-16 is measured in red giants and in grains of stardust
  found in meteorites, and is used to test stellar models.
role_it: >-
  Poiché questa cattura è lenta, la maggior parte dell'ossigeno-16 di una stella
  sopravvive alla combustione dell'idrogeno. La piccola parte che brucia produce
  ossigeno-17, la cui quantità rispetto all'ossigeno-16 si misura nelle giganti
  rosse e nei grani di polvere stellare trovati nei meteoriti, e serve a
  verificare i modelli stellari.
details: >-
  There are no resonances at stellar energies. The cross section is direct
  capture to the ¹⁷F ground state and to its first excited state, a weakly bound
  1/2⁺ level whose extended wave function makes the capture to it dominant at
  low energy and gives the S-factor a steep rise towards zero energy. The
  energy dependence is therefore well described by direct-capture and
  microscopic models, and the rate rests on surface data scaled with such a
  model. Solar Fusion II adopts S(0) = 10.6 ± 0.8 keV b from model
  calculations normalized to the data of 1973 and 1997. A 2008 evaluation,
  which corrected the data sets since 1958 for coincidence summing and
  stopping powers, gives the rate with an uncertainty of about 7%. A Bayesian
  fit of all reliable data, with a potential model whose scaling parameters
  are the asymptotic normalization coefficients of the two bound states,
  halves that uncertainty to ±4.2% (Iliadis et al. 2022).
status: well-known
status_note: >-
  A non-resonant direct-capture reaction whose energy dependence is fixed by
  theory; a Bayesian analysis (2022) gives the rate to ±4.2%, about half the
  earlier 7%, limited by the normalization of the surface data.
status_note_it: >-
  Una reazione di cattura diretta non risonante il cui andamento in energia è
  fissato dalla teoria; un'analisi bayesiana (2022) dà il tasso entro il
  ±4,2%, circa metà del 7% precedente, limitato dalla normalizzazione dei dati
  in superficie.
status_plain: >-
  Known to about 4%: how the cross section changes with energy is well
  understood from theory, and the remaining uncertainty is in the overall
  scale of the measurements.
status_plain_it: >-
  Nota a circa il 4%: come la sezione d'urto varia con l'energia è ben
  compreso dalla teoria, e l'incertezza residua riguarda la scala
  complessiva delle misure.
methods: [direct-surface, theory]
measurements:
  - year: 1997
    method: direct-surface
    note: >-
      Cross sections for capture to the ground state and to the first excited
      state. The S-factor for the excited-state transition rises as the energy
      decreases, which the authors explained by the loose binding of the
      proton in the 1/2⁺ state.
    refs: [morlock1997]
  - year: 2022
    method: theory
    energy: "all reliable data sets, refitted"
    energy_it: "tutte le serie di dati affidabili, in un nuovo fit"
    note: >-
      All reliable cross sections fitted with a single-particle potential
      model, the ANCs of the ¹⁷F ground and first excited states used as
      scaling parameters, with statistical and systematic uncertainties
      treated separately; the rate uncertainty is ±4.2%, about half of the
      previously reported 7.5%.
    refs: [iliadis2022]
evaluations: [adelberger2011, iliadis2008, acharya2025, iliadis2022]
open_questions:
  - Direct data closer to the Gamow window, to test the predicted rise of the S-factor at low energy.
open_questions_it:
  - "Dati diretti più vicini alla finestra di Gamow, per verificare l'aumento previsto del fattore S a bassa energia."
related: [17F-bp-17O, 15N-pg-16O, 17O-pa-14N]
rmatrix: [17F]
