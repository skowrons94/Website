# 22Ne(a,n): the owner's decision (2026-10-13) that below the 830 keV
# resonance (E_alpha,lab) the direct data are upper limits. Drotleff 1991 and
# Harms 1991 give plain values there; the later direct measurements give only
# limits at the same energies. Not compilation errors (nrdc: false). The
# boundary, E_lab = 819 keV, is the lowest energy at which Drotleff 1993
# (A0613.002) gives a value (E_cm 0.693 MeV = E_lab 819 keV), on the
# low-energy edge of the 830 keV resonance.

- id: O0967.002
  reaction: 22Ne(a,n)25Mg, cross section
  paper: H. W. Drotleff et al., Z. Phys. A 338, 367 (1991)
  problem: "Below the 830 keV resonance, the rows that are not DATA-MAX are given as plain values (DATA, 8-70% errors), including the bump at E_lab = 617-650 keV (the entry's title: 'New Ne-22(A,N)Mg-25 resonances at very low energies'); the same group's later measurement ascribes a resonance near 620 keV to background and gives only upper limits at these energies."
  correct:
    - {column: DATA, heading: DATA-MAX, where: {column: EN, below: 819}}
  evidence:
    - "O0967.002 DATA: EN 566.9-607.4 KEV already DATA-MAX (upper limits); 617.1-649.4, 687.7, 726.8, 775.9 and 806.6 KEV given as DATA (8.E-05 MICRO-B, 60% at 617.1, and so on); the 830 keV resonance from 829.4 KEV; O0967.001 TITLE: 'New Ne-22(A,N)Mg-25 resonances at very low energies'."
    - "A0613.001 (Drotleff et al., ApJ 414, 735 (1993), same group and set-up, REL-REF of O0967.001: 'More detailed experiment'), abstract: 'A Resonance at About E=620 KeV Could Clearly be Ascribed to the Background Reaction 11-B(A,N)14-N'; A0613.002 gives only DATA-MAX below EN-CM 0.693 MEV (E_lab 819 keV)."
    - "A0444.002 (Jaeger et al., PRL 87, 202501 (2001)) gives only DATA-MAX below EN 821.17 KEV, at 578.79-816.1 KEV."
    - "A measured yield that includes background is an upper bound on the 22Ne(a,n) cross section: read as DATA-MAX, the rows keep their numbers."
  verified: "EXFOR files O0967, A0613 and A0444 at the pinned commit"
  status: confirmed by the owner (2026-10-13), from the literature on 22Ne(a,n)
  reported_to_nrdc: no
  nrdc: false

