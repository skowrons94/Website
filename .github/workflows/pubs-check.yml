# Once a month, compare content/publications.yaml with ORCID and Crossref
# (`npm run pubs:check`, scripts/pubs/check.mjs) and, when there is anything
# to review, open an issue with the proposal (or comment on the one already
# open). It never edits the YAML and never commits.
#
# Opt-in. The schedule does nothing until the repository variable
# PUBS_CHECK is set to `true` (Settings → Secrets and variables → Actions →
# Variables). "Run workflow" on the Actions tab runs it at any time.
# Optional variable PUBS_MAILTO: an address for Crossref's "polite pool"
# (sent to Crossref with each request; leave unset to send none).
#
# Permissions: the `check` job (which installs packages and fetches from
# ORCID and Crossref) holds a read-only token; only the `report` job, which
# runs nothing but `gh` on the uploaded proposal, may write issues. Actions
# are pinned by commit SHA.
name: Publications check (ORCID)

on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pubs-check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.PUBS_CHECK == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      count: ${{ steps.compare.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # js-yaml is the only package the check needs; no install scripts run.
      - run: npm ci --ignore-scripts

      - name: Compare with ORCID and Crossref
        id: compare
        env:
          PUBS_MAILTO: ${{ vars.PUBS_MAILTO }}
        run: |
          npm run pubs:check -- --out pubs-proposal.md
          count=$(node -p 'Number(require("./pubs-proposal.json").count) || 0')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # An issue body is limited to 65536 characters.
          head -c 60000 pubs-proposal.md > body.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.compare.outputs.count != '0'
        with:
          name: pubs-proposal
          path: body.md
          retention-days: 7

  report:
    needs: check
    if: needs.check.outputs.count != '0' && needs.check.outputs.count != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pubs-proposal

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Publications: ORCID and Crossref differences to review"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
