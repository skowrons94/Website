# The astrophysical scenarios of the rates explorer (/atlas/rates).
#
# Read by scripts/rates/build.py, which resolves each composition into mass
# fractions of every network's own nuclei and writes them into
# public/rates/<network>.json. Every number carries its source in a comment
# here and in the `source` field (shown in the page's expert fold). Where no
# source pins a value, the field says so: `note` explains how it was chosen.
#
# A one-zone model holds T and ρ fixed for the whole burn: it shows which
# reactions matter and how, not the yields of a real star.
#
#   short     a name of a word or two for chart labels (and short_it)
#   T9        temperature in GK
#   rho       density in g/cm³
#   time      burn time in seconds
#   until     optional: stop when nucleus (network name: p, he4) falls below `fraction` of its
#             initial abundance (the burn time is then an upper limit)
#   composition:
#     base    lodders: present-day solar mass fractions of Lodders (2021),
#             as tabulated in pynucastro (nucdata/composition.py, LODDERS_DATA)
#     set     mass fractions fixed by hand, nucleus: X (Lodders names: h1, h2)
#     balance the nucleus that takes whatever is left to make ΣX = 1
#     mix     [ [weight, composition], ... ], mass-weighted
#   Nuclei that are not in a network are inert there: they are dropped, not
#   renormalised into the others.

constants:
  yr: 3.15576e7          # Julian year, s

scenarios:
  # Bahcall, Pinsonneault & Basu (2001), ApJ 555, 990 (model BP2000):
  # central temperature 15.7 × 10⁶ K, central density ≈ 150 g/cm³ (152.7 in
  # the model), central hydrogen fraction X = 0.340 today (0.708 at the
  # zero-age main sequence). The metals keep the Lodders surface mixture:
  # in the real core ¹²C has already turned into ¹⁴N, which the burn redoes.
  - id: sun-core
    short: "☉ Sun"
    short_it: "☉ Sole"
    name: Centre of the Sun today
    name_it: Centro del Sole oggi
    T9: 0.0157
    rho: 150
    time_yr: 1.0e9
    composition:
      base: lodders
      set: { h1: 0.340 }
      balance: he4
    source: "Bahcall, Pinsonneault & Basu 2001, ApJ 555, 990 (BP2000): T = 15.7 MK, ρ ≈ 150 g/cm³, X(H) = 0.340; metals: Lodders 2021"
    source_it: "Bahcall, Pinsonneault e Basu 2001, ApJ 555, 990 (BP2000): T = 15,7 MK, ρ ≈ 150 g/cm³, X(H) = 0,340; metalli: Lodders 2021"
    note: "Burn time 1 Gyr: long enough for ³He, ⁷Be and the CN nuclei to reach their equilibrium values, short against the Sun's 10 Gyr."
    note_it: "Tempo di combustione 1 miliardo di anni: abbastanza perché ³He, ⁷Be e i nuclei CN raggiungano l'equilibrio, breve rispetto ai 10 miliardi di anni del Sole."

  # Woosley, Heger & Weaver (2002), Rev. Mod. Phys. 74, 1015, Table I,
  # hydrogen burning in a 15 M☉ star: T = 0.035 GK, ρ = 5.8 g/cm³,
  # duration 1.1 × 10⁷ yr. Initial composition: Lodders solar.
  - id: massive-15
    short: "15 M☉"
    short_it: "15 M☉"
    name: Core of a 15 M☉ star, hydrogen burning
    name_it: Nucleo di una stella di 15 M☉, combustione dell'idrogeno
    T9: 0.035
    rho: 5.8
    time_yr: 1.1e7
    until: { nucleus: p, fraction: 0.01 }
    composition: { base: lodders }
    source: "Woosley, Heger & Weaver 2002, Rev. Mod. Phys. 74, 1015, Table I (15 M☉, H burning): T = 0.035 GK, ρ = 5.8 g/cm³, 1.1 × 10⁷ yr; composition: Lodders 2021"
    source_it: "Woosley, Heger e Weaver 2002, Rev. Mod. Phys. 74, 1015, tabella I (15 M☉, combustione di H): T = 0,035 GK, ρ = 5,8 g/cm³, 1,1 × 10⁷ anni; composizione: Lodders 2021"
    note: "The burn stops at the model's duration, or earlier when hydrogen falls to 1% of its initial value."
    note_it: "La combustione si ferma alla durata del modello, o prima se l'idrogeno scende all'1% del valore iniziale."

  # Same table, 25 M☉: T = 0.038 GK, ρ = 3.81 g/cm³, 6.7 × 10⁶ yr. The core
  # hydrogen burning of massive stars makes the ²⁶Al later blown out by
  # Wolf-Rayet winds, and runs the NeNa cycle.
  - id: massive-25
    short: "25 M☉"
    short_it: "25 M☉"
    name: Core of a 25 M☉ star, hydrogen burning
    name_it: Nucleo di una stella di 25 M☉, combustione dell'idrogeno
    T9: 0.038
    rho: 3.81
    time_yr: 6.7e6
    until: { nucleus: p, fraction: 0.01 }
    composition: { base: lodders }
    source: "Woosley, Heger & Weaver 2002, Rev. Mod. Phys. 74, 1015, Table I (25 M☉, H burning): T = 0.038 GK, ρ = 3.81 g/cm³, 6.7 × 10⁶ yr; composition: Lodders 2021"
    source_it: "Woosley, Heger e Weaver 2002, Rev. Mod. Phys. 74, 1015, tabella I (25 M☉, combustione di H): T = 0,038 GK, ρ = 3,81 g/cm³, 6,7 × 10⁶ anni; composizione: Lodders 2021"
    note: "The burn stops at the model's duration, or earlier when hydrogen falls to 1% of its initial value."
    note_it: "La combustione si ferma alla durata del modello, o prima se l'idrogeno scende all'1% del valore iniziale."

  # Hot-bottom burning at the base of the convective envelope of a massive
  # AGB star: T ≈ 80 MK (networks.yaml; Karakas & Lattanzio 2014, PASA 31,
  # e030). The density there is low, of order a few g/cm³; we take 3 g/cm³.
  # At fixed T the proton captures depend only on ρ × t, so the density and
  # the burn time are one parameter; 10 years is a choice (see `note`).
  - id: agb-hbb
    short: "AGB envelope"
    short_it: "inviluppo AGB"
    name: AGB star, hot-bottom burning
    name_it: Stella AGB, combustione alla base dell'inviluppo
    T9: 0.08
    rho: 3
    time_yr: 10
    composition: { base: lodders }
    source: "T ≈ 80 MK at the base of the envelope of massive AGB stars (Karakas & Lattanzio 2014, PASA 31, e030); composition: Lodders 2021"
    source_it: "T ≈ 80 MK alla base dell'inviluppo delle stelle AGB massicce (Karakas e Lattanzio 2014, PASA 31, e030); composizione: Lodders 2021"
    note: "ρ = 3 g/cm³ is an order of magnitude only, and the 10-year burn is a choice, long enough to show the NeNa and MgAl cycles at work and short of burning the magnesium away: in the star the envelope passes through the thin hot layer again and again, spending only a fraction of its time there. At fixed temperature only ρ × t matters for proton captures."
    note_it: "ρ = 3 g/cm³ è solo un ordine di grandezza, e i 10 anni di combustione sono una scelta, abbastanza per vedere all'opera i cicli NeNa e MgAl senza bruciare tutto il magnesio: nella stella l'inviluppo attraversa più e più volte il sottile strato caldo, passandovi solo una parte del suo tempo. A temperatura fissa per le catture protoniche conta solo ρ × t."

  # Classical nova at peak: hydrodynamic models reach 0.2–0.35 GK at the
  # base of the envelope (José & Hernanz 1998, ApJ 494, 680); Iliadis et al.
  # (2002, ApJS 142, 105) used profiles peaking at 0.145–0.418 GK. The
  # envelope is solar matter mixed 50% with the white dwarf's core (the
  # mixing assumed by José & Hernanz); here a CO core of equal parts ¹²C and
  # ¹⁶O. The density is an order of magnitude, the 300 s burn a choice; a
  # real nova cools as it expands.
  - id: nova
    short: "CO nova"
    short_it: "nova CO"
    name: Classical nova on a carbon–oxygen white dwarf
    name_it: Nova classica su una nana bianca al carbonio e ossigeno
    T9: 0.25
    rho: 1.0e3
    time: 300
    composition:
      mix:
        - [0.5, { base: lodders }]
        - [0.5, { set: { c12: 0.5, o16: 0.5 } }]
    source: "Peak 0.2–0.35 GK (José & Hernanz 1998, ApJ 494, 680; Iliadis et al. 2002, ApJS 142, 105); 50% solar (Lodders 2021) + 50% CO white-dwarf matter"
    source_it: "Picco 0,2–0,35 GK (José e Hernanz 1998, ApJ 494, 680; Iliadis et al. 2002, ApJS 142, 105); 50% solare (Lodders 2021) + 50% materia della nana bianca CO"
    note: "ρ = 10³ g/cm³ is an order of magnitude and 300 s at constant peak temperature is a simplification: a real nova cools as the envelope expands."
    note_it: "ρ = 10³ g/cm³ è un ordine di grandezza e 300 s a temperatura di picco costante sono una semplificazione: una nova vera si raffredda mentre l'inviluppo si espande."

  # The same nova on an oxygen–neon white dwarf, where the NeNa and MgAl
  # cycles start from the white dwarf's own neon, sodium and magnesium.
  # Core composition: the ONe white dwarf of Ritossa, García-Berro & Iben
  # (1996, ApJ 460, 489) as José & Hernanz (1998) used it, its main nuclei
  # rounded (¹⁶O 0.511, ²⁰Ne 0.313, ²³Na 0.064, ²⁴Mg 0.055, ²⁵Mg 0.016,
  # ²⁶Mg 0.011, ¹²C 0.009); the ~2% of minor nuclei is given to ²⁰Ne. ONe
  # novae are the hotter ones; 0.3 GK is within the range above.
  - id: nova-one
    short: "ONe nova"
    short_it: "nova ONe"
    name: Classical nova on an oxygen–neon white dwarf
    name_it: Nova classica su una nana bianca all'ossigeno e neon
    T9: 0.3
    rho: 1.0e3
    time: 300
    composition:
      mix:
        - [0.5, { base: lodders }]
        - [0.5, { set: { o16: 0.511, na23: 0.064, mg24: 0.055, mg25: 0.016, mg26: 0.011, c12: 0.009 }, balance: ne20 }]
    source: "Peak 0.2–0.35 GK (José & Hernanz 1998, ApJ 494, 680; Iliadis et al. 2002, ApJS 142, 105); 50% solar (Lodders 2021) + 50% ONe white-dwarf matter (Ritossa, García-Berro & Iben 1996, ApJ 460, 489, as used by José & Hernanz 1998)"
    source_it: "Picco 0,2–0,35 GK (José e Hernanz 1998, ApJ 494, 680; Iliadis et al. 2002, ApJS 142, 105); 50% solare (Lodders 2021) + 50% materia della nana bianca ONe (Ritossa, García-Berro e Iben 1996, ApJ 460, 489, come in José e Hernanz 1998)"
    note: "The white dwarf's main nuclei are rounded and its ~2% of minor nuclei counted as ²⁰Ne. ρ = 10³ g/cm³ is an order of magnitude and 300 s at constant peak temperature a simplification: a real nova cools as the envelope expands."
    note_it: "I nuclei principali della nana bianca sono arrotondati e il suo ~2% di nuclei minori è contato come ²⁰Ne. ρ = 10³ g/cm³ è un ordine di grandezza e 300 s a temperatura di picco costante sono una semplificazione: una nova vera si raffredda mentre l'inviluppo si espande."

  # -- the s-process ----------------------------------------------------------
  # Temperatures from the atlas (content/atlas/networks.yaml): the ¹³C pocket
  # at kT ≈ 8 keV (0.09 GK) and the thermal pulses at kT ≈ 23 keV (0.27 GK)
  # of low-mass AGB stars (Straniero et al. 2006, Nucl. Phys. A 777, 311;
  # Käppeler et al. 2011, Rev. Mod. Phys. 83, 157); core helium burning in
  # massive stars at kT ≈ 26 keV, 0.3 GK (Pignatari et al. 2010, ApJ 710,
# 1557). The intershell
  # of an AGB star is about three quarters ⁴He and one quarter ¹²C, with ~2%
  # ²²Ne and ~1% ¹⁶O (Karakas & Lattanzio 2014, PASA 31, e030). The heavy
  # seeds are Lodders' solar mixture from iron up.
  #
  # The neutron density is computed, not imposed: it follows from the
  # sources and the captures. At fixed T it scales with ρ, which is chosen
  # so that it comes out near the values quoted for each site (about
  # 10⁷ cm⁻³ in the pocket, 10¹⁰ cm⁻³ at the peak of a pulse: Straniero et
  # al. 2006); the exposure of a pocket burnt to the end does not depend on
  # ρ at all.
  - id: agb-13c-pocket
    short: "¹³C pocket"
    short_it: "tasca di ¹³C"
    name: AGB star, ¹³C pocket between pulses
    name_it: Stella AGB, tasca di ¹³C tra due impulsi
    T9: 0.09
    rho: 3.5e+3
    time_yr: 1.0e+5
    until: { nucleus: c13, fraction: 0.001 }
    composition:
      heavy: lodders
      set: { c12: 0.23, o16: 0.01, ne22: 0.02, c13: 0.005, n14: 0.0005 }
      balance: he4
    source: "T = 0.09 GK (kT ≈ 8 keV; Straniero et al. 2006; Käppeler et al. 2011); intershell ⁴He, ¹²C, ²²Ne, ¹⁶O after Karakas & Lattanzio 2014; seeds: Lodders 2021"
    source_it: "T = 0,09 GK (kT ≈ 8 keV; Straniero et al. 2006; Käppeler et al. 2011); intershell ⁴He, ¹²C, ²²Ne, ¹⁶O da Karakas e Lattanzio 2014; semi: Lodders 2021"
    note: "X(¹³C) = 0.005 and X(¹⁴N) = 0.0005 are illustrative: how much ¹³C the pocket holds is the main free parameter of AGB models, so both can be scaled. The burn runs until 99.9% of the ¹³C is gone; ρ only sets how fast (it is chosen so that the neutron density comes out near 10⁷ cm⁻³)."
    note_it: "X(¹³C) = 0,005 e X(¹⁴N) = 0,0005 sono illustrativi: quanto ¹³C contenga la tasca è il principale parametro libero dei modelli AGB, perciò si possono scalare entrambi. La combustione continua finché il 99,9% del ¹³C non è consumato; ρ ne fissa solo la rapidità (è scelta perché la densità di neutroni risulti vicina a 10⁷ cm⁻³)."

  - id: agb-thermal-pulse
    short: "thermal pulse"
    short_it: "impulso termico"
    name: AGB star, ²²Ne in a thermal pulse
    name_it: Stella AGB, ²²Ne in un impulso termico
    T9: 0.27
    rho: 3.5e+3
    time_yr: 5
    composition:
      heavy: lodders
      set: { c12: 0.23, o16: 0.01, ne22: 0.02 }
      balance: he4
    source: "T = 0.27 GK (kT ≈ 23 keV; Straniero et al. 2006; Käppeler et al. 2011); intershell after Karakas & Lattanzio 2014; seeds: Lodders 2021"
    source_it: "T = 0,27 GK (kT ≈ 23 keV; Straniero et al. 2006; Käppeler et al. 2011); intershell da Karakas e Lattanzio 2014; semi: Lodders 2021"
    note: "The ²²Ne source burns only briefly at the peak of a pulse; ρ is chosen so that the neutron density comes out near 10¹⁰ cm⁻³ (Straniero et al. 2006). At this density helium burning is too fast: in five years ⁴He falls from 0.74 to 0.24, far more than in a real pulse, so read the light nuclei with care. The seeds start solar here; in a star they are what the pocket made."
    note_it: "La sorgente di ²²Ne brucia solo brevemente al picco di un impulso; ρ è scelta perché la densità di neutroni risulti vicina a 10¹⁰ cm⁻³ (Straniero et al. 2006). A questa densità l'elio brucia troppo in fretta: in cinque anni il ⁴He scende da 0,74 a 0,24, molto più che in un impulso vero, quindi i nuclei leggeri vanno letti con cautela. Qui i semi partono solari; in una stella sono ciò che ha prodotto la tasca."

  - id: massive-he-core
    short: "He core"
    short_it: "nucleo di He"
    name: Massive star, end of core helium burning
    name_it: Stella massiccia, fine della combustione centrale dell'elio
    T9: 0.3
    rho: 1.0e+3
    time_yr: 1.0e+5
    until: { nucleus: he4, fraction: 0.01 }
    composition:
      heavy: lodders
      set: { he4: 0.1, c12: 0.3, ne22: 0.0147 }
      balance: o16
    source: "T = 0.3 GK (kT ≈ 26 keV; Pignatari et al. 2010, ApJ 710, 1557); ρ = 10³ g/cm³, the order of the central density in core helium burning (Woosley, Heger & Weaver 2002, Table I); X(²²Ne) = 0.0147: all of Lodders' C, N and O turned into ¹⁴N by hydrogen burning, then into ²²Ne; seeds: Lodders 2021"
    source_it: "T = 0,3 GK (kT ≈ 26 keV; Pignatari et al. 2010, ApJ 710, 1557); ρ = 10³ g/cm³, l'ordine della densità centrale nella combustione dell'elio (Woosley, Heger e Weaver 2002, tabella I); X(²²Ne) = 0,0147: tutto il C, N e O di Lodders trasformato in ¹⁴N dalla combustione dell'idrogeno, poi in ²²Ne; semi: Lodders 2021"
    note: "Schematic: the last tenth of the helium (X = 0.1, with ¹²C 0.3 and ¹⁶O the rest) burnt at constant T and ρ until 1% is left. In the star the core heats up as the helium runs out, and most of the weak s-process happens then. Here ²²Ne burns down to about 2 × 10⁻⁴ of its start; in a real star much of it survives into carbon-shell burning, so the weak s-process comes out too strong."
    note_it: "Schematico: l'ultimo decimo dell'elio (X = 0,1, con ¹²C 0,3 e ¹⁶O il resto) bruciato a T e ρ costanti finché ne resta l'1%. Nella stella il nucleo si scalda mentre l'elio si esaurisce, ed è allora che avviene gran parte del processo s debole. Qui il ²²Ne brucia fino a circa 2 × 10⁻⁴ del valore iniziale; in una stella vera gran parte sopravvive fino alla combustione del carbonio in shell, quindi il processo s debole risulta troppo forte."
