  - id: gelina
    name: GELINA, Geel
    lab: Joint Research Centre (JRC), European Commission
    lab_it: Centro comune di ricerca (JRC), Commissione europea
    location: Geel
    country: Belgium
    country_it: Belgio
    underground: false
    accelerator: >-
      pulsed electron linear accelerator; measurement stations 10 to 400 m
      from the neutron source
    accelerator_it: >-
      acceleratore lineare di elettroni pulsato; stazioni di misura tra 10 e
      400 m dalla sorgente di neutroni
    url: https://joint-research-centre.ec.europa.eu/laboratories-z/jrc-neutron-time-flight-facility_en
    summary: >-
      A neutron time-of-flight facility of the European Commission. Short
      bursts of electrons make bursts of neutrons of every energy from
      thermal to about 20 MeV, and the time each neutron takes to reach a
      sample gives its energy. It measures neutron cross sections for
      nuclear data and for astrophysics, ¹⁹⁷Au(n,γ) among them.
    summary_it: >-
      Un impianto a tempo di volo per neutroni della Commissione europea.
      Brevi impulsi di elettroni producono impulsi di neutroni di ogni energia,
      da quella termica fino a circa 20 MeV, e il tempo che ciascun neutrone
      impiega a raggiungere il campione ne dà l'energia. Misura sezioni d'urto
      neutroniche per i dati nucleari e per l'astrofisica, tra cui ¹⁹⁷Au(n,γ).
    details: >-
      The electron pulses are compressed to about 1 ns; up to ten
      experiments run at once on flight paths between 10 and 400 m, covering
      neutron energies from 10 meV to 20 MeV.
    details_it: >-
      Gli impulsi di elettroni sono compressi a circa 1 ns; fino a dieci
      esperimenti lavorano insieme su basi di volo tra 10 e 400 m, con energie
      dei neutroni da 10 meV a 20 MeV.
    refs: [massimi2014]

  - id: lansce-dance
    name: DANCE at LANSCE
    lab: Los Alamos Neutron Science Center, Los Alamos National Laboratory
    location: Los Alamos, New Mexico
    country: United States
    country_it: Stati Uniti
    underground: false
    accelerator: >-
      800 MeV protons on a tungsten spallation target (Lujan Center); DANCE
      on a 20 m flight path
    accelerator_it: >-
      protoni da 800 MeV su un bersaglio di spallazione di tungsteno (Lujan
      Center); DANCE su una base di volo di 20 m
    summary: >-
      The Detector for Advanced Neutron Capture Experiments: a ball of
      barium fluoride crystals that surrounds a tiny sample and catches
      nearly every γ-ray emitted when it captures a neutron. Because the
      sample can weigh as little as a milligram, it can be radioactive, which
      is what branch points of the s-process need.
    summary_it: >-
      Il Detector for Advanced Neutron Capture Experiments: una sfera di
      cristalli di fluoruro di bario che circonda un campione minuscolo e
      raccoglie quasi tutti i raggi γ emessi quando cattura un neutrone.
      Poiché il campione può pesare appena un milligrammo, può essere
      radioattivo, come serve per i punti di diramazione del processo s.
    details: >-
      Up to 160 BaF₂ crystals form a 4π shell of about 17 cm inner radius and
      15 cm thickness; samples down to about 1 mg, or with activities up to
      about 1 Ci, can be measured. Neutron energies come from the time of
      flight.
    details_it: >-
      Fino a 160 cristalli di BaF₂ formano un guscio 4π con raggio interno di
      circa 17 cm e spessore di 15 cm; si possono misurare campioni fino a
      circa 1 mg, o con attività fino a circa 1 Ci. L'energia dei neutroni si
      ricava dal tempo di volo.
    refs: [weigand2015]

  - id: franz
