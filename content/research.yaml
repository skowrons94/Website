outlook:
  title: What comes next
  title_it: Prospettive
  line: >-
    Next: open, FAIR data from underground experiments, a shared database of
    R-matrix evaluations, and new observables — γ-ray tracking and
    polarization — at LUNA.
  line_it: >-
    Prossimi passi: dati aperti e FAIR dagli esperimenti sotterranei, un
    database condiviso di valutazioni R-matrix e nuove osservabili a LUNA, dal
    tracciamento γ alla polarizzazione.
  intro: >-
    A measurement is only as useful as the data, the code and the model that
    survive it. My next years are about making all three last, and about
    giving R-matrix analyses new kinds of information.
  intro_it: >-
    Una misura vale quanto i dati, il codice e il modello che le
    sopravvivono. I prossimi anni del mio lavoro servono a far durare tutti e
    tre, e a dare alla R-matrix informazioni di tipo nuovo.
  items:
    - lead: Open data that stays open.
      lead_it: Dati aperti che restano aperti.
      text: >-
        Too many good measurements have been lost because nobody kept the data,
        or the software that reads them, alive. With modern tools, maintaining
        that software is no longer the burden it was, so preserving data is
        within every collaboration's reach. I want the data of the experiments I
        take part in to be FAIR (findable, accessible, interoperable and
        reusable) from the moment they are recorded, and I am developing the
        LUNA data acquisition to that end.
      text_it: >-
        Troppe buone misure sono andate perse perché nessuno riusciva a tenere
        in vita i dati, o il software che li leggeva. Mantenere il software non
        è più il peso di una volta, quindi conservare i dati è ormai alla
        portata di ogni collaborazione. Voglio che i
        dati degli esperimenti a cui partecipo siano FAIR (reperibili,
        accessibili, interoperabili, riutilizzabili) fin dal momento in cui
        vengono acquisiti, ed è con questo obiettivo che continuo a sviluppare
        l'acquisizione dati di LUNA.
    - lead: A database of R-matrix evaluations.
      lead_it: Un database di valutazioni R-matrix.
      text: >-
        R-matrix theory is where theory meets every detail of an experiment:
        resolution, target effects, normalizations, angular distributions. That
        is why I love it. Yet most evaluations live in one person's files. The
        field needs a shared, versioned database of evaluations that anyone can
        rerun, refit and extend when new data arrive. This is the aim of GENESIS
        (NSF, 2026–2031), a project on quantum-enhanced R-matrix evaluation of
        nuclear cross sections in which I take part, and of my work on the IAEA
        INDEN-LE committee. AZURE2 and the evaluations on this site, which anyone
        can open, change and rerun in the browser, are a working prototype; the
        rate explorer shows where such evaluations end up: in the reaction rates
        of stellar models.
      text_it: >-
        L'analisi R-matrix è il punto in cui la teoria incontra ogni dettaglio
        sperimentale: risoluzione, effetti del bersaglio, normalizzazioni,
        distribuzioni angolari. È proprio per questo che la amo. Eppure la
        maggior parte delle valutazioni vive nei file di una sola persona. Al
        settore serve un database condiviso e versionato di valutazioni, che
        chiunque possa rieseguire, aggiornare ed estendere quando arrivano
        nuovi dati. È la direzione di GENESIS (NSF, 2026–2031), sulla
        valutazione delle sezioni d'urto nucleari nella teoria R-matrix con
        metodi quantistici, a cui partecipo, e del mio lavoro nel comitato
        INDEN-LE dell'IAEA. AZURE2 e le valutazioni di questo sito, che
        chiunque può aprire, modificare e ricalcolare nel browser, ne sono un
        prototipo funzionante; l'esploratore dei tassi è pensato per mostrare
        dove finiscono queste valutazioni, nei tassi di reazione dei modelli
        stellari.
    - lead: New observables, underground.
      lead_it: Nuove osservabili, sotto terra.
      text: >-
        I want to keep contributing to LUNA's measurements, and to bring new
        kinds of information to them: a segmented, AGATA-like γ-ray detector
        deep underground, and polarization measurements, which give the
        R-matrix input independent of the cross section. The starting points are
        the measurements I already lead: ¹⁹F + p at the LUNA 400 kV
        accelerator, and the lifetime of the 6.79 MeV state of ¹⁵O measured with
        AGATA, which constrains the CNO rate and its neutrino flux.
      text_it: >-
        Voglio continuare a contribuire alle misure di LUNA e portarvi
        informazioni di tipo nuovo: un rivelatore γ segmentato, simile ad
        AGATA, in laboratorio sotterraneo, e misure di polarizzazione, che
        danno alla R-matrix un'informazione indipendente dalla sezione d'urto.
        I punti di partenza sono le misure che già guido: ¹⁹F + p all'acceleratore
        LUNA da 400 kV e la vita media dello stato a 6,79 MeV del ¹⁵O,
        misurata con AGATA, che vincola il ritmo del ciclo CNO e il suo flusso di neutrini.
    - lead: Working across the whole experiment.
      lead_it: Versatilità.
      text: >-
        I enjoy moving between the accelerator, the detectors, the simulations,
        the data acquisition and the theory, and I think an experiment needs
        people who can.
      text_it: >-
        Passare dall'acceleratore ai rivelatori, alle simulazioni,
        all'acquisizione dati e alla teoria è ciò che mi piace di più, ed è,
        credo, ciò che un esperimento chiede a chi ci lavora.
    - lead: AI as a research tool.
      lead_it: L'IA come strumento di ricerca.
      text: >-
        Used with care, AI takes over the maintenance and boilerplate that used
        to swallow our time, leaves more of it for physics, and puts a much
        broader set of tools within reach of a small group. LUNA Skills is how I
        put this into practice, openly, so that others can do the same.
      text_it: >-
        L'intelligenza artificiale sta cambiando rapidamente il modo di fare
        ricerca. Usata con attenzione si fa carico della manutenzione e del
        lavoro ripetitivo che prima ci consumavano il tempo, ne lascia di più
        alla fisica e mette alla portata di un piccolo gruppo strumenti molto
        più ampi. LUNA Skills è il modo in cui lo metto in pratica,
        apertamente, perché anche altri possano farlo.
