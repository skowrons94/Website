summary: >-
  ⁷Be captures one of the electrons around it and becomes ⁷Li, emitting a
  neutrino of fixed energy; in the Sun these are the ⁷Be solar neutrinos.
summary_it: >-
  Il ⁷Be cattura uno degli elettroni che lo circondano e diventa ⁷Li, emettendo
  un neutrino di energia fissa; nel Sole sono i neutrini solari del ⁷Be.
