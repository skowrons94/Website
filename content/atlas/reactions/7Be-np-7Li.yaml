id: 7Be-np-7Li
label: ⁷Be(n,p)⁷Li
kind: transfer
target: 7Be
projectile: n
ejectile: 1H
product: 7Li
networks: [bbn]
importance: major
summary: >-
  A ⁷Be nucleus absorbs a neutron and becomes ⁷Li, emitting a proton. After the
  Big Bang it was the main reaction that destroyed ⁷Be, and with it much of the
  future lithium.
summary_it: >-
  Un nucleo di ⁷Be assorbe un neutrone e diventa ⁷Li, emettendo un protone. Dopo
  il Big Bang fu la reazione principale che distrusse il ⁷Be, e con esso gran
  parte del futuro litio.
role: >-
  Most of the primordial lithium was first made as ⁷Be, which turned into ⁷Li
  only after the nucleosynthesis was over. Any ⁷Be destroyed earlier lowers the
  lithium predicted today. This reaction removed the largest share. Because the
  predicted lithium is higher than the amount seen in old stars, its rate has
  been re-measured to check whether a larger value could close the gap.
role_it: >-
  La maggior parte del litio primordiale si formò prima come ⁷Be, che si
  trasformò in ⁷Li solo a nucleosintesi conclusa. Tutto il ⁷Be distrutto prima
  abbassa il litio previsto oggi. Questa reazione ne eliminò la parte maggiore.
  Poiché il litio previsto è più alto della quantità osservata nelle stelle
  antiche, il suo tasso è stato rimisurato per verificare se un valore più
  grande potesse colmare la differenza.
details: >-
  The reaction has a large cross section at thermal energies and follows a
  1/v trend up to resonances in ⁸Be at higher neutron energies. BBN needs
  neutron energies of tens of keV. Direct measurements combine radioactive ⁷Be
  targets with neutron time-of-flight beams. Before 2018 the only two data sets
  from thermal to keV energies dated from the 1980s, did not reach the BBN
  window and disagreed with each other. The n_TOF measurement at CERN, with a
  ⁷Be target implanted at ISOLDE, covered neutron energies from thermal up to about
  325 keV. Its cross section is higher than the evaluations at low energy and
  agrees with values inferred from the time-reversed ⁷Li(p,n)⁷Be reaction, but
  the change reduces the predicted primordial lithium only slightly. A Trojan
  Horse measurement with a ⁷Be beam (Hayakawa et al. 2021) separated the
  (n,p₀) and (n,p₁) channels and quantified the transition to the first
  excited state of ⁷Li at BBN energies for the first time; including it lowers
  the predicted ⁷Li by about a tenth, still far from the factor of about three
  that the lithium problem needs.
status: improving
status_note: >-
  Time-of-flight data now cover the BBN energies; the higher cross section they
  give is far from enough to solve the lithium problem.
status_note_it: >-
  I dati a tempo di volo coprono ora le energie della nucleosintesi primordiale;
  la sezione d'urto più alta che danno è ben lontana dal bastare a risolvere il
  problema del litio.
methods: [neutron-beams, thm]
measurements:
  - year: 1988
    facility: other
    lab: "LANSCE, Los Alamos National Laboratory, Los Alamos NM"
    method: neutron-beams
    energy: "25 meV to 13.5 keV (neutron energy)"
    energy_it: "da 25 meV a 13,5 keV (energia del neutrone)"
    note: >-
      Time-of-flight measurement with a ⁷Be sample, normalized to the thermal
      cross section measured at the Omega West Reactor; it stops below the BBN
      energies.
    refs: [koehler1988]
  - year: 2018
    facility: n-tof
    method: neutron-beams
    energy: "thermal to about 325 keV (neutron energy)"
    energy_it: "da energie termiche a circa 325 keV (energia del neutrone)"
    note: >-
      High-purity ⁷Be target implanted at ISOLDE, the EAR2 flight path and a
      silicon telescope; the cross section is higher than the evaluations at
      low energy and agrees with ⁷Li(p,n)⁷Be data. The effect on the lithium
      problem is minor.
    refs: [damone2018]
  - year: 2021
    facility: other
    lab: "CRIB radioactive-beam separator, Japan"
    method: thm
    energy: "BBN energies (via ⁷Be(d,⁷Li p)¹H and ⁷Be(d,αα)¹H)"
    energy_it: "energie della nucleosintesi primordiale (tramite ⁷Be(d,⁷Li p)¹H e ⁷Be(d,αα)¹H)"
    note: >-
      Trojan Horse measurement of ⁷Be(n,p)⁷Li and ⁷Be(n,α)⁴He at the same time;
      an improved (n,p₀) cross section and the first quantification of the
      (n,p₁) channel in the BBN energy region, which in the PRIMAT code lowers
      the predicted ⁷Li by about a tenth.
    refs: [hayakawa2021]
evaluations: [descouvemont2004, iliadis2020]
open_questions:
  - The contribution of transitions to the first excited state of ⁷Li at BBN energies, which the total cross-section measurements of 1988 and 2018 do not separate; the 2021 Trojan Horse data give a first value, still to be confirmed by a direct measurement.
open_questions_it:
  - "Il contributo delle transizioni al primo stato eccitato del ⁷Li alle energie della nucleosintesi primordiale, che le misure della sezione d'urto totale del 1988 e del 2018 non separano; i dati del cavallo di Troia del 2021 ne danno un primo valore, ancora da confermare con una misura diretta."
related: [3He-ag-7Be, 7Be-ec-7Li, 7Li-pa-4He]
