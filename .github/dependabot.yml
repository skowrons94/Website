# Keeps the SHA-pinned actions, the npm packages (site and WebDAQ demo), the
# hash-pinned pip files and the Docker base images current (DEPLOY.md,
# "Security"): once a month, one grouped pull request per ecosystem, so the
# checks run (and can fail) once rather than once per package. Security
# updates are not affected by the grouping and still arrive when needed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    # Major versions (Next, Tailwind, TypeScript...) need a migration by
    # hand, so the monthly pull request leaves them out; security updates
    # for them still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The WebDAQ demo's own build (webdaq-demo/package-lock.json), same policy.
  - package-ecosystem: npm
    directory: /webdaq-demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      webdaq-demo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The hash-pinned pip files: CI and the Pages build (.github/requirements-*)
  # and the API image (deploy/requirements-azure2.txt).
  - package-ecosystem: pip
    directories: ["/.github", "/deploy"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The base images of deploy/Dockerfile.* (ubuntu:22.04 pinned by digest).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
