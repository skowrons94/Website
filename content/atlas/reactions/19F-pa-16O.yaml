id: 19F-pa-16O
label: ¹⁹F(p,α)¹⁶O
kind: transfer
target: 19F
projectile: 1H
ejectile: 4He
product: 16O
networks: [cno4]
importance: key
summary: >-
  Fluorine-19 captures a proton and splits into oxygen-16 and a helium
  nucleus. It is the main way stars destroy fluorine during hydrogen burning.
summary_it: >-
  Il fluoro-19 cattura un protone e si spezza in ossigeno-16 e un nucleo di
  elio. È il modo principale in cui le stelle distruggono il fluoro durante la
  combustione dell'idrogeno.
role: >-
  Fluorine is the most fragile of the light elements made in stars, and its
  origin is still debated. In AGB stars, which are thought to make much of the
  fluorine in the Galaxy, part of the fluorine produced can be destroyed by
  this reaction if it is mixed into hot hydrogen-burning layers. The reaction
  also returns material to oxygen-16 and closes the fourth CNO cycle.
role_it: >-
  Il fluoro è il più fragile degli elementi leggeri prodotti nelle stelle, e la
  sua origine è ancora discussa. Nelle stelle AGB, che si pensa producano gran
  parte del fluoro della Galassia, una parte del fluoro prodotto può essere
  distrutta da questa reazione se viene mescolata in strati caldi in cui brucia
  l'idrogeno. La reazione riporta anche materia all'ossigeno-16 e chiude il
  quarto ciclo CNO.
details: >-
  The reaction proceeds through states of ²⁰Ne and has several α channels:
  to the ¹⁶O ground state, emitting α particles, and to excited ¹⁶O states,
  followed by γ-ray (and pair) emission. At low energy each channel must be
  measured separately. For the α₀ channel, direct data reach 0.2 MeV and give
  S-factors 1.5–2 times larger than the adopted extrapolations, and
  Trojan-Horse data, which reach lower energies, show resonances that direct
  measurements had not seen. The (p,αγ) channel was measured deep underground
  at JUNA across the whole Gamow window, from E = 72 to 344 keV.
status: uncertain
status_note: >-
  The part of the reaction that leaves oxygen excited, so that it emits a
  γ-ray, has now been measured underground at stellar energies. The main part,
  which leaves oxygen in its ground state, is known below 200 keV only from
  the indirect Trojan Horse method.
status_note_it: >-
  La parte della reazione che lascia l'ossigeno eccitato, così che emette un
  raggio γ, è stata ora misurata sotto terra alle energie stellari. La parte
  principale, che lascia l'ossigeno nello stato fondamentale, sotto 200 keV è
  nota solo dal metodo indiretto del cavallo di Troia.
methods: [direct-underground, direct-surface, thm]
measurements:
  - year: 2011
    method: thm
    energy: "below about 300 keV (α₀ channel)"
    energy_it: "sotto circa 300 keV (canale α₀)"
    note: >-
      First study of the α₀ channel at astrophysical energies, from the
      quasi-free parts of ²H(¹⁹F,α¹⁶O)n and ¹⁹F(³He,α¹⁶O)d. Resonances not
      observed before raise the rate at astrophysical temperatures by up to a
      factor of 1.7.
    refs: [lacognata2011]
  - year: 2015
    method: direct-surface
    energy: "0.2–0.6 MeV (α₀ channel)"
    energy_it: "0,2–0,6 MeV (canale α₀)"
    note: >-
      Direct measurement at deeply sub-Coulomb energies; the S-factor is
      1.5–2 times larger than the extrapolations then adopted.
    refs: [lombardo2015]
  - year: 2017
    method: thm
    energy: "about 0–1 MeV (α₀ channel)"
    energy_it: "circa 0–1 MeV (canale α₀)"
    note: >-
      Improved Trojan-Horse measurement of the α₀ S-factor over the energy
      range of astrophysical interest.
    refs: [indelicato2017]
  - year: 2021
    facility: juna
    method: direct-underground
    energy: "72.4–344 keV"
    note: >-
      First measurement of the (p,αγ) channel in the low-energy part of the
      Gamow window (70–200 keV), at the China JinPing Underground
      Laboratory.
    refs: [zhang2021]
open_questions:
  - The contribution of low-energy resonances to the separate α channels.
  - The ratio to ¹⁹F(p,γ)²⁰Ne, which decides how much material leaks from the CNO cycles towards neon.
open_questions_it:
  - "Il contributo delle risonanze a bassa energia ai singoli canali α."
  - "Il rapporto con ¹⁹F(p,γ)²⁰Ne, che decide quanta materia sfugge dai cicli CNO verso il neon."
related: [19F-pg-20Ne, 18O-pg-19F, 15N-pa-12C]
details_it: >-
  La reazione procede attraverso stati del ²⁰Ne e ha diversi canali α: verso
  lo stato fondamentale del ¹⁶O, con emissione di particelle α, e verso
  stati eccitati del ¹⁶O, seguiti da emissione di raggi γ (e di coppie). A
  bassa energia ogni canale va misurato separatamente. Per il canale α₀ i
  dati diretti arrivano a 0,2 MeV e danno fattori S 1,5–2 volte più grandi
  delle estrapolazioni adottate, e i dati del Cavallo di Troia, che arrivano
  a energie più basse, mostrano risonanze che le misure dirette non avevano
  visto. Il canale (p,αγ) è stato misurato in profondità sotto terra a JUNA
  in tutta la finestra di Gamow, da E = 72 a 344 keV.
