# The static site on GitHub Pages, with AZURE2 running in the visitor's
# browser (see browser/README.md).  The Docker deployment is unaffected.
#
# Steps: build AZURE2's engine module natively (as deploy/Dockerfile.azure2
# does) and precompute every evaluation at its shipped parameters; build the
# same module for WebAssembly; lay out public/azure2/; build the WebDAQ demo
# into public/webdaq-demo/; export the site.
name: GitHub Pages

# Builds and deploys from main only (the Checks workflow covers pull
# requests); "Run workflow" builds any branch by hand.
#
# Supply chain (DEPLOY.md, "Security"): the build job, which runs npm, pip,
# emsdk and every downloaded tool, holds a read-only token and nothing else;
# only the small deploy job can write to Pages (pages, id-token). Every action
# is pinned to a commit (the tag in the comment; Dependabot proposes updates),
# emsdk to the tag's commit, GSL and AZURE2 to commits, and every download is
# checked against a recorded SHA-256: emsdk's archives and Pyodide here, the
# xbuildenv in browser/azure2/build.sh, the browser's Python packages in
# browser/assemble.py, and pip installs with --require-hashes. Caches are written by main alone and restored without fallback
# keys, so a branch build can read main's caches but never plant one that
# main, and so the deployed site, would use.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYODIDE: "0.28.3"
  PYODIDE_CORE_SHA256: "46fd28bfacd5b78333d73f171412cc992a2cab2332b067e4d2181fd255cca730"
  EMSCRIPTEN: "4.0.9"   # the version that Pyodide release was built with
  # emsdk's tag 4.0.9, and the two archives `emsdk install 4.0.9` fetches
  # (emsdk itself checks no checksum): the LLVM/Binaryen/Emscripten build
  # cb2a69bc... and Node 20.18.0 (the latter equal to nodejs.org's SHASUMS256).
  # To move to another version: see DEPLOY.md, "Security".
  EMSDK_COMMIT: "3bcf1dcd01f040f370e10fe673a092d9ed79ebb5"
  EMSDK_RELEASE: "cb2a69bce627bd2247624c71fc12907cb8785d2f"
  EMSDK_RELEASE_SHA256: "c6fd245138e6bbdd8349963cb4045c557d657e4be0ea44155375633c689c8be9"
  EMSDK_NODE: "node-v20.18.0-linux-x64.tar.xz"
  EMSDK_NODE_SHA256: "4543670b589593f8fa5f106111fd5139081da42bb165a9239f05195e405f240a"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read           # configure-pages reads the site's base path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails until Pages is enabled (Settings > Pages > Source: GitHub
      # Actions); the build still runs, for the repository's own path.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true

      # SITE_URL: the origin the site is served from, for the canonical
      # addresses, the structured data, the sitemap and the feeds (lib/site-url.ts).
      - name: Base path and address
        run: |
          if [ "${{ steps.pages.outcome }}" = success ]; then
            echo "BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
            echo "SITE_URL=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          fi

      # npm's cache holds tarballs that npm ci checks against the lockfile's
      # integrity hashes, so it cannot smuggle anything in.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webdaq-demo/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: AZURE2 commit
        id: azure2
        run: echo "ref=$(sed -n 's/^ARG AZURE2_REF=//p' deploy/Dockerfile.azure2)" >> "$GITHUB_OUTPUT"

      # -- native engine, for the precomputed results -------------------------
      - name: Native AZURE2 (pyazr)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgsl-dev libreadline-dev libncurses-dev
          # Hash-pinned (.github/requirements-build.in says how to refresh it).
          pip install --quiet --require-hashes -r .github/requirements-build.txt
          git clone --quiet https://github.com/rdeboer1/AZURE2.git /tmp/AZURE2
          git -C /tmp/AZURE2 checkout --quiet --detach ${{ steps.azure2.outputs.ref }}
          cmake -S /tmp/AZURE2 -B /tmp/AZURE2-build -DCMAKE_BUILD_TYPE=Release \
            -DUSE_API=ON -DBUILD_GUI=OFF -DUSE_QWT=OFF \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" > /dev/null
          cmake --build /tmp/AZURE2-build --target _azure2 -j "$(nproc)" > /dev/null
          # No build isolation: the build backend (setuptools) and pybind11 are
          # the hash-pinned ones installed above, not the latest from PyPI.
          # No deps: numpy, mpmath and scipy are pinned in that file already.
          pip install --quiet --no-deps --no-build-isolation /tmp/AZURE2
          python -c "import pyazr, pyazr._azure2; print('pyazr', pyazr.__version__)"

      - name: Check the evaluations, and the server's tests
        # Before the slow steps: a broken info.json or .azr stops the build
        # here, with what to fix (docs/ADDING-AN-EVALUATION.md).
        run: |
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          (cd server && python -m app.check)
          (cd server && python -m pytest -q tests)

      - name: Precompute the evaluations
        # --timings: measure the typical timings the page shows (initial.json).
        run: python browser/precompute.py --timings server/evaluations build/azure2/evaluations

      # -- WebAssembly engine -------------------------------------------------
      - name: Restore the WebAssembly build
        id: wasm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/wasm/obj
            build/wasm/gsl-prefix
            build/wasm/xbuildenv
          key: azure2-wasm-${{ steps.azure2.outputs.ref }}-${{ env.EMSCRIPTEN }}-${{ env.PYODIDE }}-${{ hashFiles('browser/azure2/*') }}

      - name: Emscripten
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          git -C /tmp/emsdk checkout --quiet --detach "$EMSDK_COMMIT"
          test "$(git -C /tmp/emsdk rev-parse HEAD)" = "$EMSDK_COMMIT"
          # Fetch emsdk's two archives ourselves, check them, and let emsdk
          # use them as already downloaded (EMSDK_KEEP_DOWNLOADS).
          mkdir -p /tmp/emsdk/downloads
          base=https://storage.googleapis.com/webassembly/emscripten-releases-builds
          curl -sSfL -o "/tmp/emsdk/downloads/$EMSDK_RELEASE-wasm-binaries.tar.xz" \
            "$base/linux/$EMSDK_RELEASE/wasm-binaries.tar.xz"
          curl -sSfL -o "/tmp/emsdk/downloads/$EMSDK_NODE" "$base/deps/$EMSDK_NODE"
          ( cd /tmp/emsdk/downloads && sha256sum -c - ) <<SUMS
          $EMSDK_RELEASE_SHA256  $EMSDK_RELEASE-wasm-binaries.tar.xz
          $EMSDK_NODE_SHA256  $EMSDK_NODE
          SUMS
          export EMSDK_KEEP_DOWNLOADS=1
          /tmp/emsdk/emsdk install "$EMSCRIPTEN" > /dev/null
          /tmp/emsdk/emsdk activate "$EMSCRIPTEN" > /dev/null

      - name: AZURE2 for WebAssembly
        run: |
          source /tmp/emsdk/emsdk_env.sh > /dev/null 2>&1
          browser/azure2/build.sh build/wasm

      - name: Save the WebAssembly build (main only)
        if: github.ref == 'refs/heads/main' && steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/wasm/obj
            build/wasm/gsl-prefix
            build/wasm/xbuildenv
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}

      - name: Pyodide
        run: |
          mkdir -p build/pyodide
          curl -sSfL -o /tmp/pyodide-core.tar.bz2 \
            "https://github.com/pyodide/pyodide/releases/download/$PYODIDE/pyodide-core-$PYODIDE.tar.bz2"
          echo "$PYODIDE_CORE_SHA256  /tmp/pyodide-core.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/pyodide-core.tar.bz2 -C build/pyodide --strip-components=1
          # NumPy is checked against the SHA-256 Pyodide's own lock file
          # records for it (the lock file came from the checked archive).
          read -r numpy numpy_sha <<< "$(python -c "import json; p=json.load(open('build/pyodide/pyodide-lock.json'))['packages']['numpy']; print(p['file_name'], p['sha256'])")"
          curl -sSfL -o "build/pyodide/$numpy" "https://cdn.jsdelivr.net/pyodide/v$PYODIDE/full/$numpy"
          echo "$numpy_sha  build/pyodide/$numpy" | sha256sum -c -
          echo "NUMPY=build/pyodide/$numpy" >> "$GITHUB_ENV"

      - name: Assemble public/azure2
        run: |
          python browser/assemble.py --pyodide build/pyodide --numpy "$NUMPY" \
            --module build/wasm/_azure2.cpython-313-wasm32-emscripten.so \
            --pyazr build/wasm/AZURE2/pyazr \
            --evaluations build/azure2/evaluations --out public/azure2

      # -- the data explorer's data (scripts/data/README.md) -------------------
      # The index and the atlas nuclei's ENSDF files are committed; the
      # per-reaction shards (~460 MB) and the other ENSDF summaries are built
      # here from the EXFOR commit and ENSDF archive pinned in
      # scripts/data/sources.json. The inputs are cached by that file, the
      # output by it and the pipeline's code, so an unchanged pipeline costs
      # one cache restore.
      #
      # Integrity: EXFOR is fetched by its pinned commit (git checks every
      # object's hash). ENSDF comes from the NNDC archive only when
      # sources.json records its SHA-256s (fetch-ensdf then refuses a
      # mismatch); until they are recorded, from the mirror pinned by commit.
      - name: Restore the data explorer's inputs
        id: dx-in
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dx/exfor_master.git
            build/dx/ensdf
          key: dx-inputs-${{ hashFiles('scripts/data/sources.json') }}

      - name: Restore the data explorer's output
        id: dx
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data
          key: dx-out-${{ hashFiles('scripts/data/sources.json', 'scripts/data/nucdata/**', 'scripts/data/vendor/**', 'content/atlas/reactions/**', 'content/atlas/nuclear-data/**') }}

      - name: Data explorer (EXFOR shards, ENSDF summaries)
        if: steps.dx.outputs.cache-hit != 'true'
        run: |
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python scripts/data/dx.py fetch-exfor
          python scripts/data/dx.py build-exfor --shards all
          source=$(python -c "import json; s=json.load(open('scripts/data/sources.json'))['ensdf']; print('nndc' if len(s.get('nndc_sha256') or {}) == len(s['nndc_urls']) else 'mirror')")
          python scripts/data/dx.py fetch-ensdf --source "$source"
          python scripts/data/dx.py build-ensdf --set scope

      - name: Save the data explorer's inputs (main only)
        if: github.ref == 'refs/heads/main' && steps.dx-in.outputs.cache-hit != 'true' && hashFiles('build/dx/exfor_master.git/HEAD') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/dx/exfor_master.git
            build/dx/ensdf
          key: ${{ steps.dx-in.outputs.cache-primary-key }}

      - name: Save the data explorer's output (main only)
        if: github.ref == 'refs/heads/main' && steps.dx.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data
          key: ${{ steps.dx.outputs.cache-primary-key }}

      - name: Data explorer checks
        run: |
          pip install --quiet --require-hashes -r .github/requirements-ci.txt
          python scripts/data/dx.py check --shards 500
          python -m pytest -q scripts/data/tests

      # -- the WebDAQ demo (webdaq-demo/README.md) -----------------------------
      # The WebDAQ frontend at the commit pinned in webdaq-demo/pin.json, with
      # the demo's overlay and simulated backend, exported into
      # public/webdaq-demo/ (served at $BASE_PATH/webdaq-demo/). git checks
      # the pinned commit's objects; build.mjs checks the whole fetched tree
      # against pin.json's treeHash on every build, cached or fetched, and the
      # hash of every upstream file the overlay replaces; npm checks the
      # integrity of JSROOT's tarball. The fetched source is cached by the
      # pinned commit (main writes it).
      - name: WebDAQ commit
        id: webdaq
        run: echo "ref=$(node -p "require('./webdaq-demo/pin.json').commit")" >> "$GITHUB_OUTPUT"

      - name: Restore the WebDAQ source
        id: webdaq-src
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: webdaq-demo/.work/upstream
          key: webdaq-src-${{ steps.webdaq.outputs.ref }}

      - name: WebDAQ demo
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd webdaq-demo
          npm ci --ignore-scripts
          DEMO_BASE_PATH="$BASE_PATH/webdaq-demo" node build.mjs
          node scripts/size.mjs ../public/webdaq-demo   # fails over budget

      - name: Save the WebDAQ source (main only)
        if: github.ref == 'refs/heads/main' && steps.webdaq-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: webdaq-demo/.work/upstream
          key: ${{ steps.webdaq-src.outputs.cache-primary-key }}

      # -- the site -----------------------------------------------------------
      # No install scripts: nothing the site depends on needs one, and none
      # then runs with the job's environment (the Docker build does the same).
      - run: npm ci --ignore-scripts
      - name: Static export
        env:
          STATIC_EXPORT: "1"
          API_BASE: browser
        run: npm run build

      # Every page's canonical address, hreflang, Open Graph card and JSON-LD,
      # the sitemap and the feeds (scripts/seo-test.mjs).
      - name: Structured data, sitemap and feeds
        env:
          STATIC_EXPORT: "1"
        run: npm run test:seo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  # Only this job can publish: it checks out nothing and runs no code from
  # the repository, it only hands the build's artifact to Pages.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
