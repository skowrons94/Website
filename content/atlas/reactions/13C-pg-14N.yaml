id: 13C-pg-14N
label: ¹³C(p,γ)¹⁴N
kind: capture
target: 13C
projectile: 1H
ejectile: g
product: 14N
networks: [cno1]
importance: key
summary: >-
  Carbon-13 captures a proton, emits a γ-ray and becomes nitrogen-14. It is
  the step of the CN cycle that destroys carbon-13.
summary_it: >-
  Il carbonio-13 cattura un protone, emette un raggio γ e diventa azoto-14. È il
  passo del ciclo CN che distrugge il carbonio-13.
role: >-
  The balance between this reaction, which destroys carbon-13, and the capture
  on carbon-12, which makes it, sets the ratio of the two carbon isotopes left
  behind by hydrogen burning. That ratio is measured in red giants, in planetary
  nebulae and in meteoritic grains, and is used to test how material is mixed
  inside stars. The rate also controls how much carbon-13 survives to act as a
  neutron source in giant stars.
role_it: >-
  L'equilibrio tra questa reazione, che distrugge il carbonio-13, e la cattura
  sul carbonio-12, che lo produce, fissa il rapporto tra i due isotopi del
  carbonio lasciati dalla combustione dell'idrogeno. Quel rapporto si misura
  nelle giganti rosse, nelle nebulose planetarie e nei grani delle meteoriti, e
  serve a verificare come si rimescola la materia all'interno delle stelle. Il
  tasso controlla anche quanto carbonio-13 sopravvive per fare da sorgente di
  neutroni nelle stelle giganti.
details: >-
  Below 1 MeV the cross section is the sum of direct capture and of two
  resonances, a 2⁻ state and a 1⁻ state in ¹⁴N observed at proton energies of
  about 448 and 551 keV. Capture populates the ground state and several excited
  states of ¹⁴N, so the total S-factor at low energy rests on R-matrix fits of
  the individual transitions. For a long time a single data set reported all
  transitions. The LUNA measurement extended the data down to E = 60 keV and,
  together with the later Felsenkeller data, gives S-factors 20–30% lower than
  the earlier literature.
status: improving
status_note: >-
  Underground data now reach 60 keV with 7–8% systematic uncertainty; the
  rate is lower than in the compilations based on the 1994 data, and the
  resonance parameters have been revised.
status_note_it: >-
  I dati sotterranei arrivano ora a 60 keV con un'incertezza sistematica del 7–8
  %; il tasso è più basso che nelle compilazioni basate sui dati del 1994, e i
  parametri delle risonanze sono stati rivisti.
status_plain: >-
  Measured underground down to low energies with an uncertainty under 10%;
  the rate came out lower than in the older tables.
status_plain_it: >-
  Misurata sotto terra fino a basse energie con un'incertezza sotto il 10 %;
  il tasso è risultato più basso che nelle tabelle precedenti.
methods: [direct-underground, direct-surface, anc]
measurements:
  - year: 1994
    method: direct-surface
    energy: "120–950 keV (proton energy)"
    energy_it: "120–950 keV (energia del protone)"
    note: >-
      Cross sections for capture to the first six states of ¹⁴N, most of them
      for the first time; resonances at Ep = 450.4 and 557.6 ± 0.5 keV; total
      S-factor extrapolated to 25 keV of 7.7 ± 1.0 keV b.
    refs: [king1994]
  - year: 2023
    facility: luna-400
    method: direct-underground
    energy: "down to 60 keV"
    energy_it: "fino a 60 keV"
    note: >-
      Prompt γ-ray detection with overall systematic uncertainties of 7–8%;
      the S-factor is about 30% lower than most earlier data.
    refs: [skowronski2023]
  - year: 2025
    facility: felsenkeller
    method: direct-underground
    energy: "310–680 keV (Ep = 330–740 keV)"
    note: >-
      Shallow-underground measurement in direct kinematics. The S-factor
      agrees with LUNA at low energy and is about 20% below the earlier
      literature over the whole range; new parameters for the two resonances
      and S_tot(0) = 6.4(4) keV b.
    refs: [skowronski2025]
evaluations: [acharya2025]
open_questions:
  - The branching of the capture to the excited states of ¹⁴N below 300 keV, where only the LUNA data exist.
  - The cause of the 20–30% difference between the recent data and the 1994 data set.
open_questions_it:
  - "La diramazione della cattura verso gli stati eccitati del ¹⁴N sotto 300 keV, dove esistono solo i dati di LUNA."
  - "La causa della differenza del 20–30 % tra i dati recenti e l'insieme di dati del 1994."
related: [12C-pg-13N, 13N-bp-13C, 14N-pg-15O]
rmatrix: [14N]
details_it: >-
  Sotto 1 MeV la sezione d'urto è la somma della cattura diretta e di due
  risonanze, uno stato 2⁻ e uno stato 1⁻ nel ¹⁴N osservati a energie del
  protone di circa 448 e 551 keV. La cattura popola lo stato fondamentale e
  diversi stati eccitati del ¹⁴N, quindi il fattore S totale a bassa energia
  si basa su fit R-matrix delle singole transizioni. Per molto tempo un solo
  insieme di dati riportava tutte le transizioni. La misura di LUNA ha
  esteso i dati fino a E = 60 keV e, insieme ai dati successivi di
  Felsenkeller, dà fattori S più bassi del 20–30% rispetto alla letteratura
  precedente.
