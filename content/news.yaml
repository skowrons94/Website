# What is new on the site: /news (and /it/news), the latest day's items (three
# to six) on the home page, and the Atom feed at /news/feed.xml (/it/news/feed.xml in Italian).
#
# Add an item at the top (the list is shown newest first whatever the order
# here, but newest-on-top keeps the file easy to read):
#
#   - date: 2026-10-12          # YYYY-MM-DD, the day it went on the site
#     text: >-                  # one or two plain sentences; the first one is
#       What changed, and       # the feed entry's title. Nuclide notation
#       why it is useful.       # (¹²C) may be typed as Unicode, as elsewhere.
#     text_it: >-               # the same in Italian; without it the Italian
#       Che cosa è cambiato.    # page shows the English
#     link: /atlas/rates        # optional: a page of the site (English path,
#                               # localized on /it) or a full https:// address
#     commit: 90727fb           # optional: where the date comes from
#
# Only things that are on the site, dated by when they arrived there: the
# dates below are those of the commits that added them (git log).
# `npm run test:seo` (after a build) and `npm run build` check the file: a
# date must be a real YYYY-MM-DD, every item needs `text`, and a link to a
# page of the site must be a page that exists.

news:
  - date: 2026-10-13
    commit: a33321c
    link: /data
    text: >-
      Nuclear data explorer: the measurements in EXFOR, the international
      library of nuclear experiments, linked to the reaction atlas, with the
      gap between the energies stars need and the lowest ones measured, and
      the levels of each nucleus.
    text_it: >-
      Esploratore dei dati nucleari: le misure di EXFOR, la libreria
      internazionale degli esperimenti nucleari, collegate all'atlante delle
      reazioni, con il vuoto tra le energie che servono alle stelle e le più
      basse misurate, e i livelli di ogni nucleo.

  - date: 2026-10-13
    commit: 7caaa58
    link: /data/path/iron-to-lead
    text: >-
      Guided paths: short walks through the site, from a question (why does
      the Sun shine slowly? where does the sodium in salt come from? how do
      stars get from iron to lead?) to what we still don't know.
    text_it: >-
      Percorsi guidati: brevi passeggiate nel sito, da una domanda (perché il
      Sole brilla lentamente? da dove viene il sodio del sale? come arrivano
      le stelle dal ferro al piombo?) a ciò che ancora non sappiamo.

  - date: 2026-10-13
    commit: 62490d8
    link: /atlas/open-questions
    text: >-
      Open questions: what the field still argues about, reaction by
      reaction, and what would settle it.
    text_it: >-
      Questioni aperte: su che cosa si discute ancora, reazione per reazione,
      e che cosa lo risolverebbe.

  - date: 2026-10-13
    commit: 7325438
    link: /learn/exercises
    text: >-
      Exercises: problems to solve with the atlas, the rate explorer and an
      evaluation, each with a worked solution.
    text_it: >-
      Esercizi: problemi da risolvere con l'atlante, l'esploratore dei tassi e
      una valutazione, ciascuno con la soluzione svolta.

  - date: 2026-10-13
    commit: 2d186a0
    link: /privacy
    text: >-
      Privacy: what the site and its server record, and for how long. No
      cookies and no trackers.
    text_it: >-
      Privacy: che cosa registrano il sito e il suo server, e per quanto
      tempo. Niente cookie e niente tracciamento.

  - date: 2026-10-12
    commit: eff78d8
    link: /atlas/rates/curiosities
    text: >-
      Rate curiosities: what would change if a single reaction ran twice as
      fast, in short sentences whose numbers come from the rate explorer's own
      calculations.
    text_it: >-
      Curiosità sui tassi: che cosa cambierebbe se una sola reazione fosse due
      volte più veloce, in frasi brevi i cui numeri vengono dai calcoli
      dell'esploratore dei tassi.

  - date: 2026-10-12
    commit: 90727fb
    link: /atlas/rates
    text: >-
      Rate explorer: the rates of the pp chains, the CNO cycles and
      the NeNa and MgAl cycles plotted against temperature, how long a nucleus
      waits before each reaction, and what a burn does when one rate is
      changed. It runs in the browser.
    text_it: >-
      Esploratore dei tassi di reazione: i tassi delle catene pp, dei cicli
      CNO e dei cicli NeNa e MgAl in funzione della temperatura, quanto aspetta
      un nucleo prima di ogni reazione, e che cosa fa una combustione quando si
      cambia un tasso. Funziona nel browser.

  - date: 2026-10-12
    commit: 43aa3f0
    text: >-
      Site search: press / or Ctrl-K (⌘-K on a Mac) on any page to find a
      reaction, a glossary term, a paper or a page.
    text_it: >-
      Ricerca nel sito: premi / o Ctrl-K (⌘-K su Mac) in qualunque pagina per
      trovare una reazione, un termine del glossario, un articolo o una pagina.

  - date: 2026-10-12
    commit: 653e4f6
    link: /atlas/s-process
    text: >-
      The s-process: how stars make about half the nuclei heavier than iron,
      one neutron capture at a time, with the path drawn on the chart of
      nuclides and its branch points.
    text_it: >-
      Il processo s: come le stelle producono circa metà dei nuclei più
      pesanti del ferro, una cattura di neutroni alla volta, con il percorso
      disegnato sulla carta dei nuclidi e i suoi punti di diramazione.

  - date: 2026-10-12
    commit: 409b0e2
    link: /glossary
    text: >-
      A glossary of the words the atlas uses, from Gamow window to reduced
      width, in plain language.
    text_it: >-
      Un glossario dei termini usati nell'atlante, dalla finestra di Gamow
      alla larghezza ridotta, in linguaggio semplice.

  - date: 2026-10-11
    commit: f2f885a
    link: /it
    text: >-
      The site in Italian: every page also exists under /it. The notes on
      R-matrix theory stay in English.
    text_it: >-
      Il sito in italiano: ogni pagina esiste anche sotto /it. Le note sulla
      teoria R-matrix restano in inglese.

  - date: 2026-10-11
    commit: 724298a
    link: /evaluations
    text: >-
      The R-matrix evaluations can now run entirely in the browser: in the
      static build of this site AZURE2 is compiled to WebAssembly and
      calculates on the reader's own computer, with no server.
    text_it: >-
      Le valutazioni R-matrix ora possono funzionare interamente nel browser:
      nella versione statica del sito AZURE2 è compilato in WebAssembly e
      calcola sul computer di chi legge, senza server.

  - date: 2026-10-11
    commit: cb87f00
    link: /atlas
    text: >-
      The reaction atlas: the nuclear reactions that power stars and make the
      elements, on the chart of nuclides, each with how it has been measured
      and what is still uncertain.
    text_it: >-
      L'atlante delle reazioni: le reazioni nucleari che alimentano le stelle e
      producono gli elementi, sulla carta dei nuclidi, ognuna con il modo in cui
      è stata misurata e ciò che resta incerto.
