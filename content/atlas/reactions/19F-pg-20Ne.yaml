id: 19F-pg-20Ne
label: ¹⁹F(p,γ)²⁰Ne
kind: capture
target: 19F
projectile: 1H
ejectile: g
product: 20Ne
networks: [cno4]
importance: key
summary: >-
  Fluorine-19 captures a proton and keeps it, becoming neon-20. This is the
  way out of the CNO cycles towards heavier elements.
summary_it: >-
  Il fluoro-19 cattura un protone e lo trattiene, diventando neon-20. È la via
  d'uscita dai cicli CNO verso elementi più pesanti.
role: >-
  In all the CNO cycles the catalyst nuclei carbon, nitrogen, oxygen and
  fluorine are recycled, so their total number stays the same. This reaction
  is the exception: it carries material out of the cycles into neon, from
  which the NeNa and MgAl cycles can build heavier nuclei. Its rate,
  compared with the much more frequent ¹⁹F(p,α)¹⁶O, sets how fast this
  leakage happens in very hot hydrogen burning, as in massive stars without
  heavy elements and in nova explosions.
role_it: >-
  In tutti i cicli CNO i nuclei catalizzatori, carbonio, azoto, ossigeno e
  fluoro, vengono riciclati, così il loro numero totale resta lo stesso. Questa
  reazione è l'eccezione: porta materia fuori dai cicli verso il neon, da cui i
  cicli NeNa e MgAl possono costruire nuclei più pesanti. Il suo tasso,
  confrontato con quello, molto più alto, della ¹⁹F(p,α)¹⁶O, fissa quanto
  velocemente avviene questa fuga nella combustione dell'idrogeno molto calda,
  come nelle stelle massicce prive di elementi pesanti e nelle esplosioni di
  nova.
details: >-
  The γ-ray channel is weak compared with the α channels of the same ²⁰Ne
  states, so measurements at low energy need intense beams and
  low-background detection, which motivated underground experiments. The
  rate at the relevant temperatures depends on low-energy resonances and on
  the non-resonant contribution, and on the γ-ray branchings of the ²⁰Ne
  states near the proton threshold. A surface measurement in 2008 observed
  only the transition to the first excited state of ²⁰Ne and gave an upper
  limit for the resonance near 213 keV. The JUNA experiment, deep under the
  JinPing mountain, reached E = 186 keV and identified a key resonance at
  225 keV; near 0.1 GK its rate is up to 7.4 times the previous
  recommendation. Before the JUNA result, an R-matrix analysis fitted the
  (p,γ), (p,α) and (p,p) data together (deBoer et al. 2021). It found the
  rate uncertainty considerably larger than previously reported. The causes
  are unresolved interferences, possible threshold and subthreshold states
  and direct capture. A Gamow shell model calculation gives, near 0.1 GK, a
  rate close to the JUNA one (Dong et al. 2024, preprint). A ¹⁹F + p
  measurement is under way at the LUNA 400 kV accelerator.
status: uncertain
status_note: >-
  Underground data now reach 186 keV; below that the rate depends on weak
  resonances not yet measured directly, and on the (p,γ)/(p,α) ratio.
status_note_it: >-
  I dati sotterranei arrivano ora a 186 keV; più in basso il tasso dipende da
  risonanze deboli non ancora misurate direttamente, e dal rapporto (p,γ)/(p,α).
status_plain: >-
  Measured underground down to fairly low energies. Below them the rate
  depends on weak resonances not yet seen directly, and on how often this
  reaction wins over its competitor ¹⁹F(p,α)¹⁶O.
status_plain_it: >-
  Misurata sotto terra fino a energie piuttosto basse. Più in basso il tasso
  dipende da risonanze deboli non ancora osservate direttamente, e da quanto
  spesso questa reazione prevale sulla concorrente ¹⁹F(p,α)¹⁶O.
methods: [direct-underground, direct-surface]
measurements:
  - year: 2008
    facility: notre-dame
    method: direct-surface
    energy: "200–760 keV"
    note: >-
      Resonances at 323.9, 564 and 634 keV and interference terms between
      them; only an upper limit for the expected resonance at 213 keV. Only
      the transition to the first excited state of ²⁰Ne was measured.
    refs: [couture2008]
  - year: 2022
    facility: juna
    method: direct-underground
    energy: "down to 186 keV"
    energy_it: "fino a 186 keV"
    note: >-
      Direct measurement at the China JinPing Underground Laboratory; a key
      resonance at 225 keV raises the rate near 0.1 GK by up to a factor of
      7.4. Stellar models then give a stronger breakout from the CNO cycle in
      first stars, a possible source of the calcium seen in the most
      iron-poor stars.
    refs: [zhang2022]
evaluations: [acharya2025]
refs: [deboer2021, dong2024]
open_questions:
  - The strength of the lowest-energy resonances and the non-resonant contribution.
  - The leakage ratio (p,γ)/(p,α) at the temperatures of hot hydrogen burning.
open_questions_it:
  - "L'intensità delle risonanze di energia più bassa e il contributo non risonante."
  - "Il rapporto di fuga (p,γ)/(p,α) alle temperature della combustione dell'idrogeno ad alta temperatura."
related: [19F-pa-16O, 18O-pg-19F, 20Ne-pg-21Na]
