# The landing page's first paragraph: plain words, for any reader. A link is
# written [text](/path); /path is an English path and is localized on /it.
lead: >-
  Stars shine because atomic nuclei fuse in their cores. I measure those nuclear
  reactions in the laboratory, at the low energies at which they happen inside
  stars. There they are so rare that the experiments must be shielded from
  cosmic rays, under 1.4 km of rock at
  [LUNA](/atlas/methods#direct-underground), the underground accelerator
  beneath the Gran Sasso mountain in Italy. I also develop the software that
  turns the measurements into the reaction rates astrophysicists use.
lead_it: >-
  Le stelle brillano perché nel loro cuore i nuclei atomici si fondono tra loro.
  Io misuro queste reazioni nucleari in laboratorio, alle basse energie a cui
  avvengono dentro le stelle. A quelle energie sono così rare che gli
  esperimenti vanno protetti dai raggi cosmici, sotto 1,4 km di roccia: a
  [LUNA](/atlas/methods#direct-underground), l'acceleratore sotterraneo sotto il
  Gran Sasso. Sviluppo anche il software che trasforma le misure nei tassi di
  reazione usati dagli astrofisici.

