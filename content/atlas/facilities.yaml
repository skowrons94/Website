# Laboratories and accelerators referred to by reactions (measurements[].facility)
# and by the timeline. Order here is display order on /atlas/methods.
#
#   id, name, lab, location, country, underground (true/false), depth (text,
#   e.g. "1400 m rock, 3800 m w.e."), accelerator (text), years (text),
#   luna (true for the LUNA accelerators), url, summary (general reader),
#   details (specialist, optional), refs (reference keys, optional)
#
# Italian (/it/atlas/methods): any text field may have an `_it` twin beside it
# (`summary_it`, `details_it`, `country_it`, `depth_it`, ...); names of
# laboratories stay as they are. Missing translations fall back to English.
#
# Fields are filled only where a source was checked (web search, 2026-10-11):
#   LNGS depth: LUNA reviews (arXiv 0906.1097, broggini2010).
#   JUNA: HIAT 2022 paper "First intense beam at JUNA 400 kV underground
#     accelerator" (JACoW) and the CJPL muon-flux paper (arXiv 2007.15925),
#     which converts 2400 m of rock to 6720 m w.e. with a rock density of
#     2.8 g/cm³.
#   CASPAR: SURF overview (arXiv 1710.11584), sanfordlab.org news and
#     experiment pages, and a 2025 CASPAR status talk (D. Robertson).
#   Felsenkeller: HZDR laboratory page, ChETEC-INFRA access page and the TU
#     Dresden press release on the inauguration.
#   LENA: TUNL LENA accelerator page and the TUNL white paper (arXiv 2211.10327).
#   Notre Dame: ISNAP accelerator page.
#   HZDR: HZDR measurement papers (arXiv 2104.06914, 1507.03893).
#   n_TOF: guerrero2013 and n_TOF Collaboration papers (arXiv 2106.11242).
# Entries without depth, years or url still lack a checked source for them;
# their summaries give no numbers. The entries after `nif` were added for
# laboratories that appear in reaction files; they carry only the facts
# (name, place, kind of machine) that were not in doubt and no numbers.
# csnsm-orsay, cenbg, riken and gsi (2026-10-12) replace the free-text `lab`
# of measurements whose papers name the laboratory: Hammache et al. 1998 and
# 2001 (CENBG and CSNSM), Chafa et al. 2005 (CSNSM), Motobayashi et al. 1994
# (RIKEN RIPS; see also the review arXiv nucl-ex/9712002), Schümann et al.
# 2003/2006 and Hammache et al. 2010 (GSI). CSNSM became part of IJCLab in
# 2020.
# karlsruhe-vdg details, gelina, lansce-dance, franz and saraf-lilit
# (2026-10-12): EXFOR entries 21647, 22099 and 22916 for the Karlsruhe
# activation and 4π BaF₂ set-ups; the JRC facility page and the CERIC-ERIC
# instrument page for GELINA; the DANCE description in arXiv 1310.1884 and
# 1512.02263 and the LANL Lujan Center page; reifarth2009 and the ChETEC
# facility listing for FRANZ; tessler2015 for LiLiT at SARAF.
# andromede (2026-10-12): Heine et al. 2018 (STELLA at Andromède, IPN Orsay)
# and EPJ Web Conf. (HIAS 2025) 00029 for the ¹²C + ¹²C runs there.

facilities:
  - id: luna-50
    name: LUNA 50 kV
    lab: Laboratori Nazionali del Gran Sasso (INFN)
    location: Assergi, L'Aquila
    country: Italy
    country_it: Italia
    underground: true
    depth: about 1400 m of rock, 3800 metres water equivalent
    depth_it: circa 1400 m di roccia, pari a 3800 m di acqua equivalente
    accelerator: 50 kV ion accelerator with a windowless gas target
    accelerator_it: acceleratore di ioni da 50 kV con bersaglio gassoso senza finestre
    years: described in 1994; first results on ³He(³He,2p)⁴He in 1996
    years_it: descritto nel 1994; primi risultati su ³He(³He,2p)⁴He nel 1996
    luna: true
    summary: >-
      The first accelerator built deep underground for nuclear astrophysics.
      It was a small pilot machine, installed under the Gran Sasso mountain to
      show that the rock overhead removes enough cosmic-ray background to
      measure fusion reactions at the energies found in the Sun.
    summary_it: >-
      Il primo acceleratore costruito in profondità sotto terra per
      l'astrofisica nucleare. Era una piccola macchina pilota, installata sotto
      il Gran Sasso per dimostrare che la roccia sovrastante elimina abbastanza
      fondo dovuto ai raggi cosmici da misurare reazioni di fusione alle energie
      che si trovano nel Sole.
    details: >-
      Compact 50 kV accelerator with a windowless, differentially pumped gas
      target, a beam calorimeter for the current measurement and silicon
      detector telescopes for the charged reaction products. It was designed
      for ³He(³He,2p)⁴He in the solar Gamow peak, which it reached down to
      16.5 keV.
    details_it: >-
      Acceleratore compatto da 50 kV con un bersaglio gassoso senza finestre a
      pompaggio differenziale, un calorimetro di fascio per la misura della
      corrente e telescopi di rivelatori al silicio per i prodotti carichi della
      reazione. Era progettato per ³He(³He,2p)⁴He nel picco di Gamow solare, che
      raggiunse fino a 16,5 keV.
    refs: [greife1994, arpesella1996, junker1998, bonetti1999, broggini2010]

  - id: luna-400
    name: LUNA 400 kV
    lab: Laboratori Nazionali del Gran Sasso (INFN)
    location: Assergi, L'Aquila
    country: Italy
    country_it: Italia
    underground: true
    depth: about 1400 m of rock, 3800 metres water equivalent
    depth_it: circa 1400 m di roccia, pari a 3800 m di acqua equivalente
    accelerator: 400 kV electrostatic accelerator (LUNA II)
    accelerator_it: acceleratore elettrostatico da 400 kV (LUNA II)
    years: in operation from the early 2000s (facility paper 2003)
    years_it: in funzione dai primi anni 2000 (articolo sull'acceleratore del 2003)
    luna: true
    summary: >-
      The second LUNA accelerator, installed at Gran Sasso after the 50 kV
      pilot machine. Its very stable proton beam has been used for most of the
      underground measurements of hydrogen burning.
    summary_it: >-
      Il secondo acceleratore di LUNA, installato al Gran Sasso dopo la macchina
      pilota da 50 kV. Il suo fascio di protoni, molto stabile, è stato usato
      per la maggior parte delle misure sotterranee della combustione
      dell'idrogeno.
    details: >-
      High-current 400 kV accelerator. Resonance scans gave an absolute proton
      energy known to about ±300 eV, an energy spread below 100 eV and a
      long-term drift of about 5 eV per hour. It has served both solid targets
      with HPGe detectors and a windowless gas target with a 4π BGO summing
      detector.
    details_it: >-
      Acceleratore da 400 kV ad alta corrente. Scansioni di risonanze hanno dato
      un'energia assoluta dei protoni nota entro circa ±300 eV, una dispersione
      in energia inferiore a 100 eV e una deriva a lungo termine di circa 5 eV
      all'ora. Ha servito sia bersagli solidi con rivelatori HPGe sia un
      bersaglio gassoso senza finestre con un rivelatore BGO 4π a somma.
    refs: [formicola2003, broggini2010, lemut2006]

  - id: bellotti-ibf
    name: Bellotti Ion Beam Facility (BIBF)
    lab: Laboratori Nazionali del Gran Sasso (INFN)
    location: Assergi, L'Aquila
    country: Italy
    country_it: Italia
    underground: true
    depth: about 1400 m of rock, 3800 metres water equivalent
    depth_it: circa 1400 m di roccia, pari a 3800 m di acqua equivalente
    accelerator: 3.5 MV Singletron (High Voltage Engineering Europa), terminal voltage 0.3–3.5 MV, ECR ion source
    accelerator_it: >-
      Singletron da 3,5 MV (High Voltage Engineering Europa), tensione di
      terminale 0,3–3,5 MV, sorgente di ioni ECR
    years: installed 2022; inaugurated October 2023
    years_it: installato nel 2022; inaugurato nell'ottobre 2023
    luna: true
    url: https://www.chetec-infra.eu/ta/tna-labs/bellotti-ion-beam-facility/
    summary: >-
      An underground accelerator laboratory at Gran Sasso with a 3.5 MV
      machine, named after Enrico Bellotti, the first director of the
      laboratory. Its proton, helium and carbon beams extend underground
      measurements from hydrogen burning to helium and carbon burning.
    summary_it: >-
      Un laboratorio sotterraneo con acceleratore al Gran Sasso, con una
      macchina da 3,5 MV, intitolato a Enrico Bellotti, il primo direttore del
      laboratorio. I suoi fasci di protoni, elio e carbonio estendono le misure
      sotterranee dalla combustione dell'idrogeno a quella dell'elio e del
      carbonio.
    details: >-
      The Singletron has a 10 GHz permanent-magnet ECR source and delivers
      about 1 mA of protons, 0.5 mA of helium and 0.15 mA of carbon. The design
      paper reports an energy stability better than 10⁻⁵ and a terminal-voltage
      ripple of 1.5 × 10⁻⁵. The facility is run as a user facility by the LNGS
      accelerator service, with beam time allocated through yearly calls.
    details_it: >-
      Il Singletron ha una sorgente ECR a magneti permanenti da 10 GHz e
      fornisce circa 1 mA di protoni, 0,5 mA di elio e 0,15 mA di carbonio.
      L'articolo di progetto riporta una stabilità in energia migliore di 10⁻⁵ e
      un ripple della tensione di terminale di 1,5 × 10⁻⁵. L'infrastruttura è
      gestita come user facility dal servizio acceleratori dei LNGS, con il
      tempo fascio assegnato tramite bandi annuali.
    refs: [sen2019, junker2023]

  - id: juna
    name: JUNA
    lab: China Jinping Underground Laboratory
    location: Jinping, Sichuan
    country: China
    country_it: Cina
    underground: true
    depth: about 2400 m of marble, 6720 metres water equivalent
    depth_it: circa 2400 m di marmo, 6720 metri di acqua equivalente
    accelerator: 400 kV high-current platform with ECR ion sources (H⁺, He⁺, He²⁺)
    accelerator_it: >-
      piattaforma da 400 kV ad alta corrente con sorgenti di ioni ECR (H⁺, He⁺,
      He²⁺)
    years: first experiments underground in early 2021
    years_it: primi esperimenti sotterranei all'inizio del 2021
    summary: >-
      The Jinping Underground laboratory for Nuclear Astrophysics, a
      high-current accelerator deep inside a mountain in south-west China. Like
      LUNA, it uses the rock above it to reduce the background from cosmic
      rays.
    summary_it: >-
      Il Jinping Underground laboratory for Nuclear Astrophysics, un
      acceleratore ad alta corrente nel cuore di una montagna nel sud-ovest
      della Cina. Come LUNA, usa la roccia sovrastante per ridurre il fondo
      dovuto ai raggi cosmici.
    details: >-
      The 400 kV platform was designed for 10 emA of H⁺ and He⁺ and 2 emA of
      He²⁺ from ECR sources. It ran for more than 2000 hours underground in
      early 2021, with BGO and neutron detectors, on reactions including
      ¹²C(α,γ)¹⁶O, ¹³C(α,n)¹⁶O, ²⁵Mg(p,γ)²⁶Al and ¹⁹F(p,α)¹⁶O. The muon flux
      measured at the laboratory is (3.53 ± 0.22 ± 0.07) × 10⁻¹⁰ cm⁻² s⁻¹.
    details_it: >-
      La piattaforma da 400 kV è stata progettata per 10 emA di H⁺ e He⁺ e 2 emA
      di He²⁺ da sorgenti ECR. All'inizio del 2021 ha funzionato per più di 2000
      ore sotto terra, con rivelatori BGO e di neutroni, su reazioni tra cui
      ¹²C(α,γ)¹⁶O, ¹³C(α,n)¹⁶O, ²⁵Mg(p,γ)²⁶Al e ¹⁹F(p,α)¹⁶O. Il flusso di muoni
      misurato nel laboratorio è (3,53 ± 0,22 ± 0,07) × 10⁻¹⁰ cm⁻² s⁻¹.
    refs: [zhang2022]

  - id: caspar
    name: CASPAR
    lab: Sanford Underground Research Facility
    location: Lead, South Dakota
    country: United States
    country_it: Stati Uniti
    underground: true
    depth: 4850 ft level, 4300 metres water equivalent
    depth_it: livello 4850 ft, 4300 metri di acqua equivalente
    accelerator: JN Van de Graaff, about 150 kV to 1.1 MV, moved from Notre Dame
    accelerator_it: Van de Graaff JN, da circa 150 kV a 1,1 MV, trasferito da Notre Dame
    years: first beam 2017, inaugurated July 2017
    years_it: primo fascio nel 2017, inaugurato nel luglio 2017
    url: https://sanfordlab.org/experiments/caspar
    summary: >-
      The Compact Accelerator System for Performing Astrophysical Research, an
      underground accelerator in the former Homestake gold mine, where Davis
      ran his solar neutrino experiment. It is used mainly for helium-induced
      reactions, including the stellar neutron sources.
    summary_it: >-
      Il Compact Accelerator System for Performing Astrophysical Research, un
      acceleratore sotterraneo nell'ex miniera d'oro di Homestake, dove Davis
      condusse il suo esperimento sui neutrini solari. È usato soprattutto per
      le reazioni indotte da elio, comprese le sorgenti di neutroni stellari.
    details: >-
      A JN-type Van de Graaff that ran above ground at Notre Dame was moved to
      the 4850 ft level of SURF from 2015. It delivers proton and α beams of
      200–250 μA on target. The CASPAR collaboration gives a muon flux of about
      4.4 × 10⁻⁹ cm⁻² s⁻¹. CASPAR is run by Notre Dame, the South Dakota School
      of Mines and Technology and the Colorado School of Mines.
    details_it: >-
      Un Van de Graaff di tipo JN che funzionava in superficie a Notre Dame è
      stato trasferito dal 2015 al livello 4850 ft di SURF. Fornisce fasci di
      protoni e di particelle α di 200–250 μA sul bersaglio. La collaborazione
      CASPAR indica un flusso di muoni di circa 4,4 × 10⁻⁹ cm⁻² s⁻¹. CASPAR è
      gestito da Notre Dame, dalla South Dakota School of Mines and Technology e
      dalla Colorado School of Mines.

  - id: felsenkeller
    name: Felsenkeller 5 MV
    lab: Felsenkeller underground laboratory (HZDR and TU Dresden)
    lab_it: Laboratorio sotterraneo Felsenkeller (HZDR e TU Dresden)
    location: Dresden
    location_it: Dresda
    country: Germany
    country_it: Germania
    underground: true
    depth: 45 m of rock
    depth_it: 45 m di roccia
    accelerator: 5 MV Pelletron (NEC 15SDH-2), with an external sputter ion source and an internal RF source
    accelerator_it: >-
      Pelletron da 5 MV (NEC 15SDH-2), con una sorgente di ioni a sputtering
      esterna e una sorgente RF interna
    years: inaugurated 4 July 2019
    years_it: inaugurato il 4 luglio 2019
    url: https://hzdr.de/db/Cms?pNid=1029
    summary: >-
      A shallow-underground accelerator laboratory in tunnels under a hill in
      Dresden. The rock above it, together with detectors that veto cosmic-ray
      muons, lowers the background enough for many reactions that are hard to
      measure at the surface.
    summary_it: >-
      Un laboratorio con acceleratore a bassa profondità, in gallerie sotto una
      collina di Dresda. La roccia sovrastante, insieme a rivelatori che
      escludono i muoni cosmici, abbassa il fondo abbastanza per molte reazioni
      difficili da misurare in superficie.
    details: >-
      The rock reduces the muon flux by a factor of 40 and the neutron flux by
      a factor of 180 with respect to the surface. With an active muon veto
      the γ-ray background is about twice that of a deep underground site.
      The Pelletron was used before for ¹⁴C accelerator mass spectrometry in
      York. Typical beam currents are up to 30 μA for helium and carbon. The
      laboratory is run jointly by HZDR and TU Dresden.
    details_it: >-
      La roccia riduce il flusso di muoni di un fattore 40 e quello di neutroni
      di un fattore 180 rispetto alla superficie. Con un veto attivo per i muoni
      il fondo di raggi γ è circa il doppio di quello di un sito sotterraneo
      profondo. Il Pelletron era usato in precedenza a York per la spettrometria
      di massa con acceleratore del ¹⁴C. Le correnti tipiche arrivano a 30 μA
      per elio e carbonio. Il laboratorio è gestito congiuntamente da HZDR e TU
      Dresden.

