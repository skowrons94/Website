id: 1H-ng-2H
label: ¹H(n,γ)²H
kind: capture
target: 1H
projectile: n
ejectile: g
product: 2H
networks: [bbn]
importance: major
summary: >-
  A neutron and a proton bind into a deuteron and give off a γ-ray. This is the
  first step of Big Bang nucleosynthesis: all later reactions start from the
  deuterium it makes.
summary_it: >-
  Un neutrone e un protone si legano in un deutone ed emettono un raggio γ. È il
  primo passo della nucleosintesi primordiale: tutte le reazioni successive
  partono dal deuterio che produce.
role: >-
  In the first minutes after the Big Bang, neutrons and protons combined into
  deuterons almost as fast as energetic photons broke them apart again. Only
  when the Universe had cooled enough did deuterium survive, and the build-up
  of heavier nuclei could begin. The rate of this capture therefore sets when
  nucleosynthesis starts and how many neutrons are still left, which in turn
  fixes the amount of helium.
role_it: >-
  Nei primi minuti dopo il Big Bang, neutroni e protoni si combinavano in
  deutoni quasi alla stessa velocità con cui fotoni energetici li spezzavano di
  nuovo. Solo quando l'Universo si fu raffreddato abbastanza il deuterio
  sopravvisse, e poté cominciare la formazione di nuclei più pesanti. Il tasso
  di questa cattura fissa quindi quando comincia la nucleosintesi e quanti
  neutroni restano ancora, il che a sua volta determina la quantità di elio.
details: >-
  At BBN energies the capture is dominated by the isovector M1 transition from
  the ¹S₀ continuum at the lowest energies and by isovector E1 capture from P
  waves at higher energies. The cross section is calculated in pionless
  effective field theory, with the M1 amplitude to next-to-next-to-leading
  order and the E1 amplitude to N4LO; one counterterm is fixed by the cold
  neutron capture rate and another by deuteron photodisintegration data. The
  stated accuracy is 1 % for centre-of-mass energies up to about 1 MeV.
status: well-known
status_note: >-
  Calculated to about 1 % at the energies of the Big Bang, with a theory tied
  to measurements of slow-neutron capture and of deuterons broken up by
  γ-rays.
status_note_it: >-
  Calcolata a circa l'1 % alle energie della nucleosintesi primordiale, con
  una teoria vincolata dalle misure di cattura di neutroni lenti e di deutoni
  spezzati da raggi γ.
status_plain: >-
  Calculated to about 1 % at the energies of the Big Bang, with a theory
  checked against laboratory measurements.
status_plain_it: >-
  Calcolata a circa l'1 % alle energie della nucleosintesi primordiale, con
  una teoria verificata su misure di laboratorio.
methods: [theory]
measurements:
  - year: 2000
    method: theory
    energy: "up to about 1 MeV"
    energy_it: "fino a circa 1 MeV"
    note: >-
      Pionless effective field theory calculation with M1 to NNLO and E1 to
      N4LO, constrained by the cold-neutron capture rate and by deuteron
      photodisintegration; 1 % accuracy over the BBN range.
    refs: [rupak2000]
evaluations: [fields2020]
