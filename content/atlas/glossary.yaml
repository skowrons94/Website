# The glossary at /glossary (/it/glossary): the terms the atlas uses, in plain
# words. Order here is display order. Each term's `id` is its anchor
# (/glossary#gamow-window); reaction pages and the map link to these anchors,
# so an id is never renamed.
#
#   id, term, also (abbreviations or other names, optional), text (one short
#   paragraph for a general reader), see (other ids, optional)
#
# Italian: `term_it`, `also_it`, `text_it` beside the English.
#
# Values quoted here are textbook ones (Iliadis, Nuclear Physics of Stars,
# 2nd ed. 2015; Rolfs and Rodney, Cauldrons in the Cosmos, 1988) or are given,
# with their sources, elsewhere in the atlas (Gran Sasso depth: facilities.yaml;
# Gamow window of ¹⁴N + p: computed by the site).

terms:
  - id: chart
    term: Chart of nuclides
    term_it: Carta dei nuclidi
    text: >-
      A map of all atomic nuclei. Each square is one nucleus: one step up adds
      a proton (and so makes the next element), one step to the right adds a
      neutron (a heavier isotope of the same element). Capturing a proton
      moves a nucleus up, capturing a neutron moves it right, and a β⁺ decay,
      in which a proton turns into a neutron, moves it one step down and one
      to the right. On the atlas map the stable nuclei are filled in grey and
      the radioactive ones are outlined.
    text_it: >-
      Una mappa di tutti i nuclei atomici. Ogni casella è un nucleo: un passo
      verso l'alto aggiunge un protone (e quindi dà l'elemento successivo), un
      passo verso destra aggiunge un neutrone (un isotopo più pesante dello
      stesso elemento). La cattura di un protone sposta il nucleo in alto,
      quella di un neutrone a destra, e un decadimento β⁺, in cui un protone si
      trasforma in un neutrone, lo sposta di un passo in basso e di uno a
      destra. Sulla mappa dell'atlante i nuclei stabili sono pieni, in grigio, e
      quelli radioattivi solo contornati.
    see: [notation]

  - id: notation
    term: Reaction notation
    term_it: Notazione delle reazioni
    also: target(in,out)product
    also_it: bersaglio(entra,esce)prodotto
    text: >-
      Physicists write a reaction as target(in,out)product. ¹⁴N(p,γ)¹⁵O reads:
      a nitrogen‑14 nucleus (the target) captures a proton (p, what comes in)
      and becomes oxygen‑15 (the product), giving off a gamma ray (γ, what comes
      out). The small number before the symbol is the mass number, the count
      of protons and neutrons. Common particles have short names: p for a
      proton, n for a neutron, d for a deuteron (a proton and a neutron), α
      for a helium‑4 nucleus, γ for a gamma ray, e⁺ for a positron and ν for a
      neutrino.
    text_it: >-
      I fisici scrivono una reazione come bersaglio(entra,esce)prodotto.
      ¹⁴N(p,γ)¹⁵O si legge: un nucleo di azoto‑14 (il bersaglio) cattura un
      protone (p, ciò che entra) e diventa ossigeno‑15 (il prodotto), emettendo
      un raggio γ (γ, ciò che esce). Il numerino prima del simbolo è il numero
      di massa, cioè quanti protoni e neutroni ci sono nel nucleo. Le
      particelle più comuni hanno nomi brevi: p per il protone, n per il
      neutrone, d per il deutone (un protone e un neutrone), α per un nucleo di
      elio‑4, γ per un raggio gamma, e⁺ per il positrone e ν per il neutrino.
    see: [chart, q-value]

  - id: kev
    term: keV and MeV
    term_it: keV e MeV
    also: kilo-electronvolt, mega-electronvolt
    also_it: chiloelettronvolt, megaelettronvolt
    text: >-
      Units of energy for single particles. One electronvolt (eV) is the
      energy an electron gains across 1 volt; a keV is a thousand of them and
      an MeV a million. In the centre of the Sun the typical thermal energy of
      a nucleus is about 1.3 keV, while the energy released by one fusion
      reaction is a few MeV.
    text_it: >-
      Unità di energia per singole particelle. Un elettronvolt (eV) è l'energia
      che un elettrone acquista attraversando una differenza di potenziale di
      1 volt; un keV ne vale mille e un MeV un milione. Al centro del Sole
      l'energia termica tipica di un nucleo è di circa 1,3 keV, mentre l'energia
      liberata da una singola reazione di fusione è di qualche MeV.

  - id: cross-section
    term: Cross section
    term_it: Sezione d'urto
    also: σ; barn (b), picobarn (pb)
    also_it: σ; barn (b), picobarn (pb)
    text: >-
      The probability that a reaction happens, expressed as an effective
      target area that each nucleus presents to an incoming one. It is
      measured in barns: 1 barn is 10⁻²⁴ cm², roughly the size of a large
      nucleus. At stellar energies cross sections are tiny, often picobarns
      (10⁻¹² barn) or less, which is why so few reactions happen in an
      experiment and why they are so hard to count.
    text_it: >-
      La probabilità che una reazione avvenga, espressa come l'area efficace
      che ogni nucleo offre a un nucleo in arrivo. Si misura in barn: 1 barn
      vale 10⁻²⁴ cm², all'incirca la dimensione di un nucleo grande. Alle
      energie stellari le sezioni d'urto sono minuscole, spesso picobarn
      (10⁻¹² barn) o meno: per questo in un esperimento avvengono così poche
      reazioni ed è così difficile contarle.
    see: [s-factor, gamow-window]

  - id: differential-cross-section
    term: Differential cross section
    term_it: Sezione d'urto differenziale
    also: dσ/dΩ
    text: >-
      The cross section per unit of solid angle in a given direction: how
      likely it is that the product of a reaction, or a scattered nucleus,
      flies off at that angle. Summed over all directions it gives the total
      cross section. Elastic scattering data, which are often used in
      R-matrix fits, are differential cross sections, usually divided by the
      Rutherford value expected from the electric repulsion alone.
    text_it: >-
      La sezione d'urto per unità di angolo solido in una data direzione:
      quanto è probabile che il prodotto di una reazione, o un nucleo
      diffuso, esca a quell'angolo. Sommata su tutte le direzioni dà la
      sezione d'urto totale. I dati di diffusione elastica, spesso usati nei
      fit R-matrix, sono sezioni d'urto differenziali, di solito divise per il
      valore di Rutherford atteso dalla sola repulsione elettrica.
    see: [cross-section, r-matrix]

  - id: s-factor
    term: Astrophysical S-factor
    term_it: Fattore astrofisico S
    also: S(E), S(0); keV b
    text: >-
      The cross section with its steepest, well-understood parts taken out.
      Because nuclei must tunnel through their electric repulsion, the cross
      section falls by many orders of magnitude as the energy drops. Writing
      σ(E) = S(E) exp(−2πη) / E, that is, dividing out the tunnelling
      probability (the Gamow factor exp(−2πη)) and a factor 1/E that comes
      from the quantum-mechanical size of the colliding nuclei, leaves the
      S-factor, which changes only slowly with energy (except near
      resonances) and is therefore much easier to extend from measured
      energies down to stellar ones. S(0) is its value extrapolated to zero
      energy; it is quoted in keV b or MeV b. For two carbon nuclei a modified
      S-factor, S*, divides out a further factor that remains in such a heavy
      system.
    text_it: >-
      La sezione d'urto privata delle sue parti più ripide, che sono ben note.
      Poiché i nuclei devono attraversare per effetto tunnel la loro
      repulsione elettrica, la sezione d'urto crolla di molti ordini di
      grandezza quando l'energia scende. Scrivendo σ(E) = S(E) exp(−2πη) / E,
      cioè dividendo per la probabilità di tunnel (il fattore di Gamow
      exp(−2πη)) e per un fattore 1/E che viene dalle dimensioni quantistiche
      dei nuclei che si urtano, resta il fattore S, che varia lentamente con
      l'energia (tranne vicino alle risonanze) ed è quindi molto più facile da
      prolungare dalle energie misurate a quelle stellari. S(0) è il suo
      valore estrapolato a energia zero; si esprime in keV b o MeV b. Per due
      nuclei di carbonio si usa un fattore S modificato, S*, che divide anche
      per un ulteriore fattore che resta in un sistema così pesante.
    see: [cross-section, r-matrix]

  - id: coulomb-barrier
    term: Coulomb barrier
    term_it: Barriera coulombiana
    text: >-
      The electric repulsion between two positively charged nuclei, which
      keeps them apart until they come close enough for the strong nuclear
      force to take over. For a proton and nitrogen‑14 the barrier is about
      2–3 MeV high, while in the Sun the typical energy is about a thousand
      times smaller; fusion still happens, rarely, by quantum tunnelling
      through the barrier. A neutron has no charge and feels no barrier.
    text_it: >-
      La repulsione elettrica tra due nuclei carichi positivamente, che li
      tiene separati finché non arrivano abbastanza vicini perché prevalga la
      forza nucleare forte. Per un protone e l'azoto‑14 la barriera è alta
      2–3 MeV, mentre nel Sole l'energia tipica è circa mille volte più
      piccola; la fusione avviene lo stesso, raramente, per effetto tunnel
      attraverso la barriera. Un neutrone non ha carica e non sente alcuna
      barriera.
    see: [gamow-window, s-factor]

  - id: gamow-window
    term: Gamow window
    term_it: Finestra di Gamow
    keywords: ["Gamow peak", "stellar energies"]
    keywords_it: ["picco di Gamow", "energie stellari"]
    also: Gamow peak, E₀
    also_it: picco di Gamow, E₀
    text: >-
      The narrow band of energies at which a reaction actually happens in a
      star. Fast nuclei are rare in a hot gas, but slow ones almost never get
      through the electric repulsion; the product of the two is a peak, at an
      energy well above the typical thermal one. For ¹⁴N + p at the centre of
      the Sun it lies near 27 keV. Measuring a cross section inside, or close
      to, the Gamow window is the goal of experiments like LUNA.
    text_it: >-
      La stretta banda di energie a cui una reazione avviene davvero in una
      stella. In un gas caldo i nuclei veloci sono rari, mentre quelli lenti
      non superano quasi mai la repulsione elettrica; il prodotto dei due
      fattori è un picco, a un'energia ben più alta di quella termica tipica.
      Per ¹⁴N + p al centro del Sole si trova intorno a 27 keV. Misurare una
      sezione d'urto dentro la finestra di Gamow, o vicino, è l'obiettivo di
      esperimenti come LUNA.
    see: [kev, cross-section, temperature]

  - id: resonance
    term: Resonance
    term_it: Risonanza
    also: resonance strength ωγ
    also_it: intensità della risonanza ωγ
    text: >-
      When the energy of the two colliding nuclei matches an excited state of
      the nucleus they form together, the cross section rises sharply, often
      by orders of magnitude, over a narrow range of energy. A narrow
      resonance is characterised by its energy and by its strength (ωγ). A
      single low-energy resonance can dominate the rate of a reaction in a
      star, so finding and measuring them is a large part of the work.
    text_it: >-
      Quando l'energia dei due nuclei che si urtano coincide con uno stato
      eccitato del nucleo che formano insieme, la sezione d'urto cresce di
      colpo, spesso di ordini di grandezza, in un intervallo stretto di
      energia. Una risonanza stretta è caratterizzata dalla sua energia e dalla
      sua intensità (ωγ). Una sola risonanza a bassa energia può dominare il
      tasso di una reazione in una stella: trovarle e misurarle è una parte
      importante del lavoro.
    see: [r-matrix]

  - id: excited-state
    term: Excited state
    term_it: Stato eccitato
    also: energy level
    also_it: livello energetico
    text: >-
      A nucleus, like an atom, can exist only at certain energies. The lowest
      is the ground state; the others are excited states, which usually give
      up their extra energy within a tiny fraction of a second by emitting a
      γ-ray or a particle. Each nucleus has its own pattern of levels, and the
      ones just above the energy at which two nuclei can merge decide where a
      reaction has resonances.
    text_it: >-
      Un nucleo, come un atomo, può esistere solo a certe energie. La più
      bassa è lo stato fondamentale; le altre sono stati eccitati, che di
      solito cedono la loro energia in più in una minuscola frazione di
      secondo emettendo un raggio γ o una particella. Ogni nucleo ha il suo
      schema di livelli, e quelli appena sopra l'energia a cui due nuclei
      possono unirsi decidono dove una reazione ha risonanze.
    see: [resonance, compound-nucleus]

  - id: compound-nucleus
    term: Compound nucleus
    term_it: Nucleo composto
    text: >-
      The nucleus formed for a moment when two nuclei merge: a proton and
      nitrogen‑14 form oxygen‑15, two carbon nuclei form magnesium‑24. It is
      born in an excited state and at once gets rid of the extra energy, by
      emitting a γ-ray (a capture) or by breaking up into other particles.
      Which way it decays does not depend on how it was formed, only on its
      energy and its other properties.
    text_it: >-
      Il nucleo che si forma per un istante quando due nuclei si uniscono: un
      protone e l'azoto‑14 formano l'ossigeno‑15, due nuclei di carbonio il
      magnesio‑24. Nasce in uno stato eccitato e si libera subito dell'energia
      in più, emettendo un raggio γ (una cattura) o spezzandosi in altre
      particelle. Il modo in cui decade non dipende da come si è formato, ma
      solo dalla sua energia e dalle sue altre proprietà.
    see: [excited-state, branching-ratio, resonance]

  - id: q-value
    term: Q-value
    term_it: Valore Q
    text: >-
      The energy released by a reaction, in MeV. It is the difference between
      the masses before and after, converted with E = mc². A positive Q-value
      means the reaction gives off energy, which is what heats a star; a
      negative one means energy must be supplied. The atlas computes it from
      the measured atomic masses of the 2020 Atomic Mass Evaluation (AME2020).
    text_it: >-
      L'energia liberata da una reazione, in MeV. È la differenza tra le masse
      prima e dopo, convertita con E = mc². Un valore Q positivo significa che
      la reazione libera energia, ed è ciò che scalda una stella; uno negativo
      che l'energia va fornita. L'atlante lo calcola dalle masse atomiche
      misurate della valutazione delle masse del 2020 (AME2020).
    see: [notation]

  - id: threshold
    term: Threshold and endothermic reactions
    term_it: Soglia e reazioni endotermiche
    also: endothermic, Q < 0
    also_it: endotermica, Q < 0
    text: >-
      A reaction with a negative Q-value is endothermic: it takes energy
      instead of releasing it, and it can happen only if the colliding nuclei
      bring at least that much energy with them, the threshold (|Q| in the
      centre of mass). In a star only the fastest nuclei are above it, so for
      such a reaction the atlas shows the range of energies just above the
      threshold, not the ordinary Gamow window, which would lie partly or
      wholly below it.
    text_it: >-
      Una reazione con valore Q negativo è endotermica: assorbe energia invece
      di liberarla, e può avvenire solo se i nuclei che si urtano portano con
      sé almeno quell'energia, la soglia (|Q| nel centro di massa). In una
      stella solo i nuclei più veloci la superano, quindi per una reazione di
      questo tipo l'atlante mostra l'intervallo di energie appena sopra la
      soglia, non la finestra di Gamow ordinaria, che cadrebbe in parte o del
      tutto al di sotto.
    see: [q-value, gamow-window]

  - id: branching-ratio
    term: Branching ratio
    term_it: Rapporto di diramazione
    also: branch
    also_it: ramo
    text: >-
      When a nucleus can decay, or a reaction can end, in more than one way,
      the branching ratio is the fraction that goes each way. Two carbon
      nuclei, for example, end up as neon‑20 and an alpha particle or as
      sodium‑23 and a proton; the split between the two decides how much
      sodium a star makes.
    text_it: >-
      Quando un nucleo può decadere, o una reazione può concludersi, in più di
      un modo, il rapporto di diramazione è la frazione che segue ciascuna
      via. Due nuclei di carbonio, per esempio, finiscono in neon‑20 e una
      particella alfa oppure in sodio‑23 e un protone; la ripartizione tra le
      due vie decide quanto sodio produce una stella.
    see: [compound-nucleus]

  - id: rate
    term: Reaction rate
    term_it: Tasso di reazione
    also: N_A⟨σv⟩
    text: >-
      How many reactions happen per second in a given amount of stellar
      matter. It combines the cross section at every energy with the
      distribution of speeds of the nuclei at the temperature of the star.
      Stellar models use tables of rates against temperature, which is why
      the atlas says how well each rate is known. What the tables give is
      N_A⟨σv⟩, the rate per pair of particles, in cm³ mol⁻¹ s⁻¹; the number of
      reactions per cubic centimetre and per second is
      r = n₁n₂⟨σv⟩ / (1 + δ₁₂), with n₁ and n₂ the number densities of the
      two nuclei and δ₁₂ = 1 for identical ones, so that each pair is counted
      once.
    text_it: >-
      Quante reazioni avvengono al secondo in una data quantità di materia
      stellare. Combina la sezione d'urto a ogni energia con la distribuzione
      delle velocità dei nuclei alla temperatura della stella. I modelli
      stellari usano tabelle di tassi in funzione della temperatura: per
      questo l'atlante dice quanto bene è noto ciascun tasso. Le tabelle
      riportano N_A⟨σv⟩, il tasso per coppia di particelle, in
      cm³ mol⁻¹ s⁻¹; il numero di reazioni per centimetro cubo e per secondo
      è r = n₁n₂⟨σv⟩ / (1 + δ₁₂), con n₁ e n₂ le densità numeriche dei due
      nuclei e δ₁₂ = 1 se sono identici, così che ogni coppia sia contata una
      volta sola.
    see: [cross-section, status]

  - id: status
    term: How well a rate is known
    term_it: Quanto bene è noto un tasso
    also: Well known, Improving, Uncertain, Unmeasured
    also_it: Ben noto, In miglioramento, Incerto, Non misurato
    text: >-
      Each reaction page carries one of four labels. Well known: the rate is
      known well enough for the stellar models that use it. Improving: recent
      measurements have narrowed it, but some uncertainty remains. Uncertain:
      the uncertainty is large enough to change the models that depend on it.
      Unmeasured: there are no direct data at the energies that matter, and
      the rate rests on extrapolation, indirect methods or theory. The label
      is the author's summary of the evaluations cited on the page.
    text_it: >-
      Ogni pagina di reazione porta una di quattro etichette. Ben noto: il
      tasso è noto abbastanza bene per i modelli stellari che lo usano. In
      miglioramento: misure recenti hanno ridotto l'incertezza, ma una parte
      resta. Incerto: l'incertezza è abbastanza grande da cambiare i modelli
      che ne dipendono. Non misurato: non ci sono dati diretti alle energie
      che contano, e il tasso si basa su estrapolazioni, metodi indiretti o
      teoria. L'etichetta è la sintesi dell'autore delle valutazioni citate
      nella pagina.
    see: [rate]

  - id: temperature
    term: Temperatures in stars
    term_it: Temperature nelle stelle
    also: MK, GK, T₉
    text: >-
      Stellar temperatures are given in millions of kelvin (MK) or billions of
      kelvin (GK, gigakelvin); T₉ is the temperature in GK. The centre of the
      Sun is at about 15.7 MK, or T₉ = 0.0157; helium burns at about 100–
      300 MK, and the hottest explosive burning reaches a few GK.
    text_it: >-
      Le temperature stellari si danno in milioni di kelvin (MK) o in miliardi
      di kelvin (GK, gigakelvin); T₉ è la temperatura in GK. Il centro del Sole
      è a circa 15,7 MK, cioè T₉ = 0,0157; l'elio brucia a circa 100–300 MK, e
      la combustione esplosiva più calda raggiunge alcuni GK.
    see: [gamow-window]

  - id: solar-mass
    term: Solar mass
    term_it: Massa solare
    also: M☉
    text: >-
      The mass of the Sun, about 2 × 10³⁰ kg, used as the unit for the masses
      of stars. A 15 M☉ star has fifteen times the mass of the Sun; the mass
      decides how hot a star's core gets and so which reactions run in it.
    text_it: >-
      La massa del Sole, circa 2 × 10³⁰ kg, usata come unità per le masse delle
      stelle. Una stella di 15 M☉ ha quindici volte la massa del Sole; la massa
      decide quanto si scalda il nucleo della stella e quindi quali reazioni vi
      avvengono.

  - id: main-sequence
    term: Main sequence
    term_it: Sequenza principale
    text: >-
      The long, stable phase in which a star burns hydrogen into helium in its
      core, by the pp chains or the CNO cycle. Stars spend most of their lives
      there; the Sun has been on the main sequence for about 4.6 billion
      years. When the hydrogen in the core runs out, the star leaves it and
      becomes a red giant.
    text_it: >-
      La lunga fase stabile in cui una stella brucia idrogeno in elio nel suo
      nucleo, con le catene pp o con il ciclo CNO. Le stelle vi trascorrono la
      maggior parte della loro vita; il Sole è sulla sequenza principale da
      circa 4,6 miliardi di anni. Quando l'idrogeno nel nucleo si esaurisce,
      la stella la lascia e diventa una gigante rossa.
    see: [solar-mass]

  - id: half-life
    term: Half-life
    term_it: Tempo di dimezzamento
    also: t½
    text: >-
      The time after which half of a sample of a radioactive nucleus has
      decayed. It ranges from fractions of a second to billions of years. The
      atlas takes half-lives from the NUBASE2020 evaluation; in a star, where
      the atoms are ionized, a half-life that depends on electrons (electron
      capture) can be different.
    text_it: >-
      Il tempo dopo il quale metà di un campione di un nucleo radioattivo è
      decaduta. Va da frazioni di secondo a miliardi di anni. L'atlante prende
      i tempi di dimezzamento dalla valutazione NUBASE2020; in una stella, dove
      gli atomi sono ionizzati, un tempo di dimezzamento che dipende dagli
      elettroni (cattura elettronica) può essere diverso.

  - id: agb-star
    term: AGB star
    term_it: Stella AGB
    also: asymptotic giant branch
    also_it: ramo asintotico delle giganti
    text: >-
      A late stage in the life of stars of roughly 1 to 8 solar masses. The
      star has a core of carbon and oxygen, burns hydrogen and helium in thin
      shells around it, and swells into a cool giant that loses much of its
      mass in a slow wind. AGB stars make about half of the elements heavier
      than iron, through the s-process, and enrich the Galaxy with carbon and
      nitrogen.
    text_it: >-
      Una fase avanzata della vita delle stelle tra circa 1 e 8 masse solari.
      La stella ha un nucleo di carbonio e ossigeno, brucia idrogeno ed elio in
      gusci sottili intorno a esso e si gonfia in una gigante fredda che perde
      gran parte della sua massa in un vento lento. Le stelle AGB producono
      circa metà degli elementi più pesanti del ferro, con il processo s, e
      arricchiscono la Galassia di carbonio e azoto.
    see: [s-process, solar-mass]

  - id: s-process
    term: s-process
    term_it: Processo s
    keywords: ["slow neutron capture", "heavy elements", "gold", "lead"]
    keywords_it: ["cattura lenta di neutroni", "elementi pesanti", "oro", "piombo"]
    also: slow neutron capture
    also_it: cattura lenta di neutroni
    text: >-
      The slow neutron-capture process. Nuclei capture neutrons one at a time,
      slowly enough that an unstable nucleus usually decays before it
      captures the next one, so the process climbs along the valley of stable
      nuclei. It runs mainly in AGB stars and in massive stars, with neutrons
      from the reactions ¹³C(α,n)¹⁶O and ²²Ne(α,n)²⁵Mg, and makes about half
      of the nuclei heavier than iron.
    text_it: >-
      Il processo di cattura lenta di neutroni. I nuclei catturano neutroni uno
      alla volta, abbastanza lentamente che un nucleo instabile di solito
      decade prima di catturare il successivo, così il processo risale lungo la
      valle dei nuclei stabili. Avviene soprattutto nelle stelle AGB e nelle
      stelle massicce, con i neutroni prodotti dalle reazioni ¹³C(α,n)¹⁶O e
      ²²Ne(α,n)²⁵Mg, e produce circa metà dei nuclei più pesanti del ferro.
    page: /atlas/s-process
    see: [r-process, agb-star, s-components, branch-point, s-only, macs]

  - id: r-process
    term: r-process
    term_it: Processo r
    keywords: ["rapid neutron capture", "kilonova", "neutron-star merger"]
    keywords_it: ["cattura rapida di neutroni", "kilonova", "fusione di stelle di neutroni"]
    also: rapid neutron capture
    also_it: cattura rapida di neutroni
    text: >-
      The rapid neutron-capture process. In an environment flooded with
      neutrons, nuclei capture many of them in a fraction of a second, far
      faster than they can decay, and then decay back towards stability. It
      makes the other half of the heavy elements, including gold and uranium.
      Merging neutron stars are one confirmed site, from the kilonova seen
      with the gravitational-wave event GW170817 in 2017.
    text_it: >-
      Il processo di cattura rapida di neutroni. In un ambiente inondato di
      neutroni i nuclei ne catturano molti in una frazione di secondo, molto
      più in fretta di quanto possano decadere, e poi decadono di nuovo verso
      la stabilità. Produce l'altra metà degli elementi pesanti, tra cui l'oro e
      l'uranio. La fusione di stelle di neutroni è un sito confermato, dalla
      kilonova osservata con l'evento di onde gravitazionali GW170817 nel 2017.
    see: [s-process]

  - id: s-components
    term: Main and weak s-process
    term_it: Processo s principale e debole
    also: main and weak components
    also_it: componente principale e componente debole
    text: >-
      The two parts of the s-process found when its products are compared
      with the Solar System. The main component comes from low-mass AGB
      stars, with neutrons mostly from the ¹³C pocket, and makes most of the
      s-process nuclei from strontium to lead. The weak component comes from
      massive stars, with neutrons from ²²Ne at the end of core helium burning
      and in the carbon-burning shell, and makes mostly nuclei lighter than
      mass 90.
    text_it: >-
      Le due parti del processo s che emergono confrontando i suoi prodotti
      con il Sistema Solare. La componente principale viene dalle stelle AGB
      di piccola massa, con neutroni soprattutto dalla tasca di ¹³C, e produce
      la maggior parte dei nuclei del processo s dallo stronzio al piombo. La
      componente debole viene dalle stelle massicce, con neutroni dal ²²Ne alla
      fine della combustione centrale dell'elio e nel guscio in cui brucia il
      carbonio, e produce soprattutto nuclei più leggeri della massa 90.
    see: [s-process, c13-pocket, thermal-pulse]

  - id: c13-pocket
    term: ¹³C pocket
    term_it: Tasca di ¹³C
    text: >-
      A thin layer in an AGB star, between the helium shell and the hydrogen
      envelope, where a few protons mixed into helium-burning ashes turn
      carbon-12 into carbon-13. Between two thermal pulses the carbon-13
      captures helium and releases neutrons through ¹³C(α,n)¹⁶O, at a thermal
      energy of about 8 keV. Most of the heavy s-process elements are made in
      it.
    text_it: >-
      Uno strato sottile di una stella AGB, tra il guscio di elio e
      l'inviluppo di idrogeno, dove pochi protoni mescolati alle ceneri della
      combustione dell'elio trasformano il carbonio-12 in carbonio-13. Tra due
      impulsi termici il carbonio-13 cattura elio e libera neutroni con la
      ¹³C(α,n)¹⁶O, a un'energia termica di circa 8 keV. Vi si produce la
      maggior parte degli elementi pesanti del processo s.
    see: [thermal-pulse, agb-star, neutron-poison]

  - id: thermal-pulse
    term: Thermal pulse
    term_it: Impulso termico
    also: helium-shell flash
    also_it: lampo del guscio di elio
    text: >-
      In an AGB star, helium accumulates in a shell under the burning
      hydrogen until it ignites in a brief, violent flash, which drives
      convection through the shell. The flash recurs again and again. At its
      peak, around 270 million kelvin, it briefly starts the second neutron
      source of the star, ²²Ne(α,n)²⁵Mg, with a higher neutron density than
      the ¹³C pocket.
    text_it: >-
      In una stella AGB l'elio si accumula in un guscio sotto l'idrogeno che
      brucia, finché si accende in un lampo breve e violento, che rimescola il
      guscio per convezione. Il lampo si ripete più e più volte. Al suo
      culmine, intorno a 270 milioni di kelvin, accende brevemente la seconda
      sorgente di neutroni della stella, la ²²Ne(α,n)²⁵Mg, con una densità di
      neutroni più alta di quella della tasca di ¹³C.
    see: [c13-pocket, agb-star]

  - id: neutron-poison
    term: Neutron poison
    term_it: Veleno neutronico
    text: >-
      A nucleus that captures neutrons that would otherwise reach the iron
      seeds of the s-process. A poison may capture neutrons only rarely, but
      if it is far more abundant than iron it still takes a large share:
      nitrogen-14 in the ¹³C pocket, and oxygen-16 and neon-22 in massive
      stars.
    text_it: >-
      Un nucleo che cattura neutroni che altrimenti raggiungerebbero i semi di
      ferro del processo s. Un veleno può catturare neutroni solo di rado, ma
      se è molto più abbondante del ferro ne prende comunque una quota grande:
      l'azoto-14 nella tasca di ¹³C, l'ossigeno-16 e il neon-22 nelle stelle
      massicce.
    see: [c13-pocket, s-process]

  - id: neutron-density
    term: Neutron density
    term_it: Densità di neutroni
    text: >-
      The number of free neutrons per cubic centimetre in a star. In the
      s-process it is low: about 10⁷ per cubic centimetre in the ¹³C pocket of
      an AGB star, where a nucleus with a typical cross section of a tenth of
      a barn waits about 250 years between two captures, up to about 10¹⁰ in the brief ²²Ne bursts of the thermal
      pulses, and about 10¹¹–10¹² in the carbon-burning shell of a massive
      star. In the r-process it is higher still by many orders of magnitude,
      above 10²⁰. Branch points of the s-process measure it.
    text_it: >-
      Il numero di neutroni liberi per centimetro cubo in una stella. Nel
      processo s è bassa: circa 10⁷ per centimetro cubo nella tasca di ¹³C di
      una stella AGB, dove un nucleo con una tipica sezione d'urto di un
      decimo di barn aspetta circa 250 anni tra due catture, fino a circa 10¹⁰ nei brevi lampi del ²²Ne durante gli impulsi
      termici, e circa 10¹¹–10¹² nel guscio in cui brucia il carbonio di una
      stella massiccia. Nel processo r è più alta ancora di molti ordini di
      grandezza, oltre 10²⁰. I punti di diramazione del processo s la misurano.
    see: [branch-point, s-process, r-process]

  - id: magic-numbers
    term: Magic numbers
    term_it: Numeri magici
    also: closed neutron shells
    also_it: gusci di neutroni chiusi
    text: >-
      Protons and neutrons fill shells inside the nucleus, much as electrons
      do in an atom. A nucleus with 2, 8, 20, 28, 50, 82 or 126 neutrons has a
      closed shell and is especially stable and reluctant to capture another
      neutron. At N = 50, 82 and 126 the s-process slows down, which makes
      the abundance peaks at strontium, barium and lead.
    text_it: >-
      Protoni e neutroni riempiono gusci all'interno del nucleo, un po' come
      gli elettroni in un atomo. Un nucleo con 2, 8, 20, 28, 50, 82 o 126
      neutroni ha un guscio chiuso ed è particolarmente stabile e restio a
      catturare un altro neutrone. A N = 50, 82 e 126 il processo s rallenta,
      e questo produce i picchi di abbondanza allo stronzio, al bario e al
      piombo.
    see: [s-process, chart]

  - id: branch-point
    term: Branch point
    term_it: Punto di diramazione
    keywords: ["isomer", "¹⁸⁵W", "bound-state beta decay", "¹⁶³Dy"]
    keywords_it: ["isomero", "¹⁸⁵W", "decadimento beta in stato legato", "¹⁶³Dy"]
    text: >-
      A radioactive nucleus on the s-process path that lives long enough to
      capture a neutron before it decays, but not always. There the path
      forks, and the share of each branch depends on the neutron density and
      sometimes on the temperature of the star. The abundances of the nuclei
      beyond, such as krypton-86 or the samarium isotopes, therefore act as a
      gauge of neutron density or as a thermometer.
    text_it: >-
      Un nucleo radioattivo sul percorso del processo s che vive abbastanza da
      catturare un neutrone prima di decadere, ma non sempre. Lì il percorso si
      biforca, e la quota di ciascun ramo dipende dalla densità di neutroni e
      talvolta dalla temperatura della stella. Le abbondanze dei nuclei che
      seguono, come il kripton-86 o gli isotopi del samario, fanno quindi da
      misuratore della densità di neutroni o da termometro.
    page: /atlas/s-process
    see: [neutron-density, s-process, branching-ratio]

  - id: s-only
    term: s-only and r-only isotopes
    term_it: Isotopi solo s e solo r
    keywords: ["s-only isotopes", "shielded nuclei", "¹⁵⁰Sm", "²⁰⁴Pb"]
    keywords_it: ["isotopi solo s", "nuclei schermati", "¹⁵⁰Sm", "²⁰⁴Pb"]
    text: >-
      A stable isotope is s-only when a stable isobar of lower Z (a nucleus
      with the same mass number and fewer protons) shields it from the decays that follow the
      r-process, while the s-process path passes through it; samarium-148
      and lead-204 are examples. An r-only isotope is a neutron-rich one the
      s-process path skips, such as ytterbium-176. Their abundances separate
      the two processes.
    text_it: >-
      Un isotopo stabile è solo s quando un isobaro stabile con Z minore (un
      nucleo con lo stesso numero di massa e meno protoni) lo scherma dai decadimenti che
      seguono il processo r, mentre il percorso del processo s lo attraversa;
      il samario-148 e il piombo-204 ne sono esempi. Un isotopo solo r è un
      isotopo ricco di neutroni che il percorso del processo s salta, come
      l'itterbio-176. Le loro abbondanze separano i due processi.
    see: [s-process, r-process]

  - id: macs
    term: Maxwellian-averaged cross section
    term_it: Sezione d'urto mediata su una maxwelliana
    also: MACS
    text: >-
      In a star the neutrons have the spread of energies of a hot gas, the
      Maxwell–Boltzmann distribution. The Maxwellian-averaged cross section is
      the capture cross section averaged over that distribution at a given
      temperature, which is what stellar models need. By convention it is
      quoted at a thermal energy kT = 30 keV, about 350 million kelvin. The
      measured values are collected in KADoNiS, the Karlsruhe Astrophysical
      Database of Nucleosynthesis in Stars (Dillmann et al. 2014).
    text_it: >-
      In una stella i neutroni hanno la distribuzione di energie di un gas
      caldo, la distribuzione di Maxwell–Boltzmann. La sezione d'urto mediata
      su una maxwelliana è la sezione d'urto di cattura mediata su quella
      distribuzione a una data temperatura, ed è ciò che serve ai modelli
      stellari. Per convenzione si cita a un'energia termica kT = 30 keV,
      circa 350 milioni di kelvin. I valori misurati sono raccolti in KADoNiS,
      il Karlsruhe Astrophysical Database of Nucleosynthesis in Stars
      (Dillmann et al. 2014).
    see: [cross-section, time-of-flight, activation]

  - id: time-of-flight
    term: Time of flight
    term_it: Tempo di volo
    text: >-
      A way to measure a neutron's energy: neutrons of all energies are made
      in a short burst, and the time each takes to cover a known distance,
      tens to hundreds of metres, gives its speed and so its energy. One
      experiment then measures a cross section at many energies at once. n_TOF
      at CERN, GELINA in Geel and LANSCE in Los Alamos work this way.
    text_it: >-
      Un modo di misurare l'energia di un neutrone: neutroni di tutte le
      energie vengono prodotti in un breve impulso, e il tempo che ciascuno
      impiega a percorrere una distanza nota, da decine a centinaia di metri,
      ne dà la velocità e quindi l'energia. Un solo esperimento misura così
      una sezione d'urto a molte energie insieme. n_TOF al CERN, GELINA a Geel
      e LANSCE a Los Alamos funzionano in questo modo.
    see: [macs, activation]

  - id: activation
    term: Activation
    term_it: Attivazione
    text: >-
      A way to count reactions after the fact: a sample is irradiated, and the
      radioactive nuclei the reaction made are counted afterwards from their
      decay. For the s-process, neutrons with a spectrum close to that in a
      star, made by protons on lithium, irradiate the sample beside a gold
      foil, whose well-known capture serves as the reference.
    text_it: >-
      Un modo di contare le reazioni a posteriori: un campione viene
      irraggiato, e i nuclei radioattivi prodotti dalla reazione si contano
      dopo, dal loro decadimento. Per il processo s, neutroni con uno spettro
      vicino a quello di una stella, prodotti da protoni sul litio, irraggiano
      il campione accanto a un foglio d'oro, la cui cattura ben nota fa da
      riferimento.
    see: [macs, time-of-flight]

  - id: luna
    term: LUNA and underground laboratories
    term_it: LUNA e i laboratori sotterranei
    keywords: ["underground", "why underground", "Gran Sasso"]
    keywords_it: ["sottoterra", "perché sottoterra", "Gran Sasso"]
    also: Laboratory for Underground Nuclear Astrophysics
    text: >-
      At the Earth's surface, cosmic rays leave far more signals in a γ-ray
      detector than the few reactions of a measurement at stellar energies. A
      laboratory deep underground is shielded by the rock above it. LUNA, at
      the Gran Sasso National Laboratories of INFN in Italy, has run
      accelerators under about 1400 m of rock since the early 1990s; the rock
      reduces the cosmic-ray muons by about a factor of a million. Besides
      LUNA's 400 kV accelerator, the Bellotti Ion Beam Facility (BIBF),
      inaugurated there in 2023, hosts a 3.5 MV machine for helium and carbon
      burning. Other deep underground accelerators run in China (JUNA)
      and the United States (CASPAR); Felsenkeller in Dresden, under 45 m of
      rock, is a shallow-underground laboratory that adds active muon vetoes.
    text_it: >-
      In superficie i raggi cosmici lasciano in un rivelatore di raggi γ molti
      più segnali delle poche reazioni di una misura alle energie stellari. Un
      laboratorio in profondità è schermato dalla roccia che lo sovrasta. LUNA,
      ai Laboratori Nazionali del Gran Sasso dell'INFN, usa acceleratori sotto
      circa 1400 m di roccia dall'inizio degli anni Novanta; la roccia riduce i
      muoni cosmici di circa un milione di volte. Oltre all'acceleratore da
      400 kV di LUNA, il Bellotti Ion Beam Facility (BIBF), inaugurato nel 2023,
      ospita una macchina da 3,5 MV per la combustione dell'elio e del
      carbonio. Altri acceleratori in profondità sono in funzione in Cina
      (JUNA) e negli Stati Uniti (CASPAR); il Felsenkeller di Dresda, sotto
      45 m di roccia, è un laboratorio a bassa profondità che aggiunge veti
      attivi per i muoni.
    see: [mwe, gamow-window]

  - id: mwe
    term: Metres water equivalent
    term_it: Metri di acqua equivalente
    also: m w.e.
    text: >-
      A way of comparing the depth of underground laboratories under different
      rock: the thickness of water that would stop cosmic rays as well as the
      rock does. The 1400 m of rock above the Gran Sasso laboratories
      correspond to about 3800 m w.e.
    text_it: >-
      Un modo di confrontare la profondità di laboratori sotterranei sotto
      rocce diverse: lo spessore d'acqua che fermerebbe i raggi cosmici quanto
      la roccia. I 1400 m di roccia sopra i Laboratori del Gran Sasso
      corrispondono a circa 3800 m di acqua equivalente (m w.e.).
    see: [luna]

  - id: electron-screening
    term: Electron screening
    term_it: Schermaggio elettronico
    text: >-
      In a laboratory target the nuclei are inside atoms, and their electrons
      partly hide the nuclear charge from an incoming nucleus. This lowers the
      electric barrier and makes the measured cross section at the lowest
      energies larger than that of bare nuclei. In a star the screening comes
      from the free electrons of the plasma and is different, so laboratory
      data must be corrected; the enhancement measured in the laboratory is
      often larger than atomic physics predicts.
    text_it: >-
      In un bersaglio di laboratorio i nuclei stanno dentro gli atomi, e i loro
      elettroni nascondono in parte la carica del nucleo a un nucleo in arrivo.
      Questo abbassa la barriera elettrica e rende la sezione d'urto misurata
      alle energie più basse maggiore di quella dei nuclei nudi. In una stella
      lo schermaggio viene dagli elettroni liberi del plasma ed è diverso,
      quindi i dati di laboratorio vanno corretti; l'aumento misurato in
      laboratorio è spesso maggiore di quanto preveda la fisica atomica.
    see: [cross-section, trojan-horse]

  - id: r-matrix
    term: R-matrix
    term_it: R-matrix
    also: R-matrix theory, AZURE2
    also_it: teoria della R-matrix, AZURE2
    text: >-
      A theoretical framework for fitting nuclear reaction data. Inside a
      certain radius the nucleus is described by a set of levels, each with an
      energy and widths; outside it, the particles move under the known
      electric force. Fitting these parameters to all the data on a nucleus at
      once gives a model that can be extended to the low energies of stars.
      AZURE2 is an R-matrix code, and the evaluations on this site use it.
    text_it: >-
      Un quadro teorico per il fit dei dati di reazioni nucleari. Entro un
      certo raggio il nucleo è descritto da un insieme di livelli, ciascuno con
      un'energia e delle larghezze; al di fuori le particelle si muovono sotto
      la forza elettrica, che è nota. Il fit di questi parametri a tutti i dati
      su un nucleo insieme dà un modello che si può prolungare alle basse
      energie delle stelle. AZURE2 è un codice R-matrix, ed è quello usato dalle
      valutazioni di questo sito.
    see: [s-factor, resonance, anc]

  - id: anc
    term: Asymptotic normalization coefficient
    term_it: Coefficiente di normalizzazione asintotica
    also: ANC
    text: >-
      When a capture at very low energy goes directly, without passing
      through a resonance, it happens mostly far outside the nucleus (it is
      peripheral), where only the tail of the final nucleus' wave function
      matters. The ANC measures the size of that tail. It can be found from
      transfer reactions at higher energy, where the cross section is large,
      and then gives the direct, non-resonant part of the capture at stellar
      energies without measuring the capture itself; resonances are added
      separately.
    text_it: >-
      Quando una cattura a energie molto basse avviene in modo diretto, senza
      passare per una risonanza, avviene per lo più lontano dal nucleo (è
      periferica), dove conta solo la coda della funzione d'onda del nucleo
      finale. L'ANC misura l'ampiezza di quella coda. Si può ricavare da
      reazioni di trasferimento a energia più alta, dove la sezione d'urto è
      grande, e dà poi la parte diretta, non risonante, della cattura alle
      energie stellari senza misurare la cattura stessa; le risonanze si
      aggiungono a parte.
    see: [r-matrix]

  - id: spin-parity
    term: Spin and parity
    term_it: Spin e parità
    keywords: ["Jπ", "angular momentum", "parity"]
    keywords_it: ["Jπ", "momento angolare", "parità"]
    also: Jπ
    also_it: Jπ
    text: >-
      How a nuclear level spins, and how it looks in a mirror: the two labels
      that decide which levels two colliding nuclei can form. Every level
      carries them, written together as Jπ, for example 3/2⁻. J is the spin,
      the level's total angular momentum, counted in units of ħ; the parity
      π, + or −, says whether its wave function stays the same or changes
      sign when mirrored through the centre. Both are conserved in a
      reaction, so they fix which levels can form and with how much orbital
      angular momentum the two nuclei must come together.
    text_it: >-
      Come ruota un livello nucleare e come appare allo specchio: le due
      etichette che decidono quali livelli possono formare due nuclei che si
      scontrano. Ogni livello le porta, scritte insieme come Jπ, per esempio
      3/2⁻. J è lo spin, il momento angolare totale del livello, contato in
      unità di ħ; la parità π, + o −, dice se la sua funzione d'onda resta
      uguale o cambia segno quando la si specchia attraverso il centro.
      Entrambi si conservano in una reazione, quindi fissano quali livelli
      possono formarsi e con quanto momento angolare orbitale i due nuclei
      devono avvicinarsi.
    see: [excited-state, resonance]

  - id: reduced-width
    term: Partial and reduced width
    term_it: Larghezza parziale e ridotta
    also: Γ, γ²
    also_it: Γ, γ²
    text: >-
      How readily a level decays through one channel, for example by
      emitting a proton or a γ-ray. The partial width Γ is an energy (eV,
      keV): the larger it is, the faster that decay and the broader the
      resonance; the widths of all channels add up to the level's total
      width. The reduced width γ² is the same quantity with the
      penetrability of the Coulomb and centrifugal barriers divided out, so it
      measures the nuclear structure alone. An R-matrix fit adjusts these
      widths, together with the level energies, to the data.
    text_it: >-
      Quanto facilmente un livello decade attraverso un canale, per esempio
      emettendo un protone o un raggio γ. La larghezza parziale Γ è
      un'energia (eV, keV): più è grande, più rapido è quel decadimento e più
      larga la risonanza; le larghezze di tutti i canali si sommano nella
      larghezza totale del livello. La larghezza ridotta γ² è la stessa
      grandezza da cui si è tolta la penetrabilità delle barriere coulombiana
      e centrifuga, e misura quindi la sola struttura nucleare. Un fit
      R-matrix regola queste larghezze, insieme alle energie dei livelli, sui
      dati.
    see: [r-matrix, resonance, anc]

  - id: coincidence
    term: Particle–γ coincidence
    term_it: Coincidenza particella–γ
    text: >-
      Recording a particle and a γ-ray only when they arrive together, within
      a few billionths of a second. A real reaction often gives both, a
      proton and the γ-ray of the nucleus left behind, while most background
      gives only one; requiring the two together removes most of the
      background, at the cost of missing the decays that give no γ-ray.
    text_it: >-
      Registrare una particella e un raggio γ solo quando arrivano insieme,
      entro pochi miliardesimi di secondo. Una reazione vera dà spesso
      entrambi, un protone e il raggio γ del nucleo rimasto, mentre la maggior
      parte del fondo ne dà uno solo; richiederli insieme toglie quasi tutto il
      fondo, al prezzo di perdere i decadimenti che non emettono raggi γ.
    see: [cross-section]

  - id: normalisation
    term: Normalization
    term_it: Normalizzazione
    also: scale factor, systematic uncertainty
    also_it: fattore di scala, incertezza sistematica
    text: >-
      Every measured data set carries an overall scale uncertainty, from the
      beam current, the number of target nuclei or the detector efficiency,
      which moves all its points up or down together. In a fit such as an
      R-matrix evaluation each data set may be given a normalization factor,
      allowed to move only within its quoted scale uncertainty.
    text_it: >-
      Ogni insieme di dati misurati porta con sé un'incertezza di scala
      complessiva, dovuta alla corrente del fascio, al numero di nuclei del
      bersaglio o all'efficienza del rivelatore, che sposta tutti i suoi punti
      in su o in giù insieme. In un fit come una valutazione R-matrix a ogni
      insieme di dati si può dare un fattore di normalizzazione, libero di
      muoversi solo entro la sua incertezza di scala dichiarata.
    see: [r-matrix, chi-squared]

  - id: chi-squared
    term: χ² (chi-squared)
    term_it: χ² (chi quadro)
    also: χ²/N
    also_it: χ²/N
    text: >-
      A measure of how well a model fits data: for each point, the difference
      between model and measurement divided by the measurement's
      uncertainty, squared, and summed over all points. Divided by the number
      of points, χ²/N close to 1 means the model agrees with the data within
      their uncertainties; much larger values mean it does not, or that the
      uncertainties are underestimated.
    text_it: >-
      Una misura di quanto un modello descrive bene i dati: per ogni punto, la
      differenza tra modello e misura divisa per l'incertezza della misura,
      elevata al quadrato e sommata su tutti i punti. Diviso per il numero di
      punti, un χ²/N vicino a 1 significa che il modello è in accordo con i
      dati entro le loro incertezze; valori molto più grandi indicano che non
      lo è, o che le incertezze sono sottostimate.
    see: [r-matrix, normalisation]

  - id: trojan-horse
    term: Trojan Horse method
    term_it: Metodo del cavallo di Troia
    also: THM
    text: >-
      An indirect method. The reaction of interest is hidden inside another
      one at higher energy: the projectile is carried in by a larger nucleus
      (the Trojan horse, for example a deuteron carrying a proton), which
      passes the Coulomb barrier easily. Selecting the events in which the
      rest of the carrier is only a spectator gives the energy dependence of
      the low-energy reaction, without Coulomb suppression or electron
      screening. The result is normalized to direct data at higher energy.
    text_it: >-
      Un metodo indiretto. La reazione che interessa è nascosta dentro un'altra
      a energia più alta: il proiettile viene portato dentro da un nucleo più
      grande (il cavallo di Troia, per esempio un deutone che porta un
      protone), che supera facilmente la barriera coulombiana. Selezionando gli
      eventi in cui il resto del nucleo portatore fa solo da spettatore si
      ottiene l'andamento in energia della reazione a bassa energia, senza
      soppressione coulombiana né schermaggio elettronico. Il risultato si
      normalizza ai dati diretti a energia più alta.
    see: [electron-screening]

  - id: inverse-kinematics
    term: Inverse kinematics
    term_it: Cinematica inversa
    text: >-
      Swapping the roles of beam and target: the heavier nucleus is
      accelerated and hits a target of hydrogen or helium. The products then
      fly forward in a narrow cone, where they can be caught and identified,
      and the heavy nucleus can be a short-lived one that could never be made
      into a target.
    text_it: >-
      Lo scambio dei ruoli di fascio e bersaglio: il nucleo più pesante viene
      accelerato e colpisce un bersaglio di idrogeno o di elio. I prodotti
      volano allora in avanti in un cono stretto, dove si possono raccogliere e
      identificare, e il nucleo pesante può essere uno a vita breve, con cui non
      si potrebbe mai fare un bersaglio.
    see: [recoil-separator]

  - id: recoil-separator
    term: Recoil separator
    term_it: Separatore di rinculo
    text: >-
      A set of magnets and electric fields that picks out the few product
      nuclei of a reaction in inverse kinematics from the beam, which is
      billions of times more intense and moves in almost the same direction.
      Counting the products directly gives the cross section. DRAGON at
      TRIUMF, ERNA and St. George are examples.
    text_it: >-
      Un insieme di magneti e campi elettrici che isola i pochi nuclei prodotti
      da una reazione in cinematica inversa dal fascio, miliardi di volte più
      intenso e diretto quasi nella stessa direzione. Contare direttamente i
      prodotti dà la sezione d'urto. DRAGON a TRIUMF, ERNA e St. George ne sono
      esempi.
    see: [inverse-kinematics]

  - id: fusion-hindrance
    term: Fusion hindrance
    term_it: Soppressione della fusione
    text: >-
      A fall of the fusion probability of two heavy nuclei, at energies far
      below the Coulomb barrier, faster than the usual models predict. If it
      happens for two carbon nuclei, the S-factor reaches a maximum and then
      drops towards stellar energies, and carbon burns more slowly than the
      standard rate says. Whether it does is still debated.
    text_it: >-
      Una diminuzione della probabilità di fusione di due nuclei pesanti, a
      energie molto sotto la barriera coulombiana, più rapida di quanto
      prevedono i modelli usuali. Se avviene per due nuclei di carbonio, il
      fattore S raggiunge un massimo e poi cala verso le energie stellari, e il
      carbonio brucia più lentamente di quanto dica il tasso standard. Se
      avvenga davvero è ancora discusso.
    see: [s-factor]

  - id: superburst
    term: Superburst
    term_it: Superburst
    text: >-
      A rare, very long X-ray burst from a neutron star that pulls matter
      from a companion star. Ordinary X-ray bursts, from helium and hydrogen
      burning near the surface, last seconds to minutes; superbursts last
      hours and are thought to start when carbon ignites deeper down, in the
      ashes of earlier bursts.
    text_it: >-
      Un lampo X raro e molto lungo emesso da una stella di neutroni che
      sottrae materia a una stella compagna. I lampi X ordinari, dovuti alla
      combustione di elio e idrogeno vicino alla superficie, durano da secondi
      a minuti; i superburst durano ore e si pensa che comincino quando il
      carbonio si accende più in profondità, nelle ceneri dei lampi
      precedenti.
