  - id: karlsruhe-vdg
    name: Karlsruhe Van de Graaff
    lab: Kernforschungszentrum Karlsruhe (now Karlsruhe Institute of Technology)
    lab_it: Kernforschungszentrum Karlsruhe (oggi Karlsruhe Institute of Technology)
    location: Karlsruhe
    country: Germany
    country_it: Germania
    underground: false
    accelerator: single-ended Van de Graaff (3.7 MV)
    accelerator_it: Van de Graaff single-ended (3,7 MV)
    summary: >-
      A Van de Graaff accelerator at the Karlsruhe nuclear research centre,
      used for measurements of ¹²C(α,γ)¹⁶O and, for decades, of the neutron
      captures of the s-process. Protons on a lithium target there make
      neutrons whose energies mimic those in a star, and many of the stellar
      capture rates in use today were measured with them.
    summary_it: >-
      Un acceleratore Van de Graaff del centro di ricerca nucleare di Karlsruhe,
      usato per misure di ¹²C(α,γ)¹⁶O e, per decenni, delle catture di neutroni
      del processo s. Lì i protoni su un bersaglio di litio producono neutroni
      con energie che imitano quelle di una stella, e molti dei tassi di
      cattura stellari usati oggi sono stati misurati con essi.
    details: >-
      Protons of 1912 keV, just above the ⁷Li(p,n)⁷Be threshold, give a
      forward-collimated neutron spectrum that closely resembles a
      Maxwell–Boltzmann distribution at kT = 25 keV; a sample in the cone is
      activated, and the ⁷Be activity of the target gives the integrated flux
      (Beer and Käppeler 1980; Ratynski and Käppeler 1988). With a pulsed beam
      the same machine served time-of-flight measurements with the Karlsruhe
      4π BaF₂ array, 42 crystals forming a spherical shell of 10 cm inner
      radius and 15 cm thickness (Wisshak et al. 2006).
    refs: [beer1980, ratynski1988, wisshak2006]

