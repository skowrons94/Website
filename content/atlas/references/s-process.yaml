# References for the s-process page (/atlas/s-process), the neutron poisons and
# the heavy-element neutron captures. Verified by web search on 2026-10-12:
# direct access to publishers was blocked from the build container, so
# `checked` names the records (arXiv listings, INSPIRE, EXFOR, institutional
# repositories) that confirmed each entry. A DOI is given only where a record
# showed it, or where it follows the APS scheme from a confirmed APS journal
# reference. b2fh1957 (history.yaml), guerrero2013 (history.yaml) and
# woosley2002 (carbon.yaml) are reused from the other files.

