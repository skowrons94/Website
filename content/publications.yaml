# Add a paper by adding an entry. Sorted by `year` descending; within a year the
# file order is kept, so put a new same-year paper where you want it to appear.
#
#   kind:      article | proceedings   (anything else becomes its own section)
#   role:      my part in it, when that is more than an author's and the author
#              list does not show it (role_it in Italian); shown under the authors
#   status:    shown instead of the journal, for anything not yet out
#   status_it: the same, in Italian, for /it/publications (titles stay as published)
#   tags:      [luna] for a paper of the LUNA collaboration (measured at, or about,
#              the LUNA accelerators); drives the "LUNA" filter. Tag only what is
#              certain: LUNA in the title, the atlas' LUNA flag, or the paper itself.
#
# The papers marked on /publications (a rule at the left) are not chosen here:
# they are those with "J. Skowronski" first in `authors`, and those with a
# `role` (lib/content.ts). Corresponding authorship is not recorded; to mark a
# paper on which I am corresponding author, give it a `role`.

